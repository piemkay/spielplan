# Spielplan — spec v2.1 §2. One internal HTTP port, no GPU anywhere.
# TLS/ingress is the operator's existing Traefik + Cloudflare; this stack speaks plain HTTP.
#
# §1 draws four services (frontend/backend/worker/db). The frontend is a *static* SvelteKit
# build and §1 explicitly permits it to be "served by backend"; it is therefore compiled in a
# node build stage of ops/backend.Dockerfile and served by the backend, so nothing is lost and
# there is one fewer long-running process on a 4-vCPU box. README's "Shape" says why that process
# must stay a single one, and its "Recovery" section is every operator procedure this file implies.

x-app-env: &app-env
  # The database password is stated once, in POSTGRES_PASSWORD, and read back out here. It used
  # to be declared twice — `.env.example` asked for POSTGRES_PASSWORD and again for a
  # DATABASE_URL carrying it, and this anchor and the `db` service below defaulted each
  # independently — so an operator who set a real password and left the URL as copied got a
  # backend that could not authenticate on first boot, a health check that called it healthy and
  # a bare traceback in place of an error. The nested defaults read exactly the three variables
  # `db` reads, so the two cannot drift. DATABASE_URL stays overridable for §2's other supported
  # install, a Postgres outside this compose file; a password put there by hand must be
  # percent-encoded (see .env.example). [M4.7 ops-12]
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-spielplan}:${POSTGRES_PASSWORD:-spielplan}@db:5432/${POSTGRES_DB:-spielplan}}
  PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required — WebAuthn binds credentials to this origin}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  SECRETS_KEY: ${SECRETS_KEY:?SECRETS_KEY is required — connector secrets never fall back to SESSION_SECRET}
  TZ: ${TZ:-Europe/Berlin}
  DATA_DIR: /data
  # §2: "env vars may *seed* connector config on first boot for automated installs." `Settings`
  # declares all six, `.env.example` documents all six, `app.py` calls `seed_from_env` at every
  # boot and a coverage row certifies the behaviour — and not one of them ever reached a
  # container, because this anchor named six variables and these were not among them, no service
  # declares `env_file`, and `.dockerignore` keeps `.env` out of the image so the settings file
  # finds nothing either. A documented feature, dead in the only deployment this repository
  # ships. Forwarded one at a time rather than with `env_file: .env`, which would also push
  # POSTGRES_*, BIND_ADDR and PORT into the app containers and widen what they can read past the
  # list §2 gives them. An empty value is safe: `connectors/registry.py` seeds a connector only
  # when its url and its key are both truthy. [M4.7 ds01, dd-compose]
  JELLYFIN_URL: ${JELLYFIN_URL:-}
  JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
  TMDB_API_KEY: ${TMDB_API_KEY:-}
  OMDB_API_KEY: ${OMDB_API_KEY:-}
  TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
  TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}

# The worker's five: it writes the nightly dump, stages an import and owns the model cache.
x-worker-volumes: &worker-volumes
  - ./data/raw:/data/raw
  - ./data/artifacts:/data/artifacts
  - ./data/cache:/data/cache
  - ./data/import:/data/import
  - ./data/backups:/data/backups

# The backend's three. Both services used to share the five above, which put every night's
# pg_dump — each member's whole Ledger and the wrapped DEK — inside the process that also serves
# §6's SPA fallback to anonymous callers; `e2e/specs/07-boundaries.spec.js` records the traversal
# bug that once served `data/backups/dump.sql` out of exactly that handler (§14.3). Dropped
# rather than mounted `:ro`, because nothing in the backend reads /data/backups or /data/raw at
# all, and a file that is not in the container cannot be served out of it. [M4.7 sec-08]
x-backend-volumes: &backend-volumes
  - ./data/artifacts:/data/artifacts
  - ./data/cache:/data/cache
  - ./data/import:/data/import

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spielplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spielplan}
      POSTGRES_DB: ${POSTGRES_DB:-spielplan}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      # §2's dumps are WRITTEN by the worker, which carries its own pinned pg_dump
      # (ops/backend.Dockerfile explains why it is not driven through this service). This mount
      # is the read side: it puts the same host directory where `pg_restore` can reach it, so a
      # restore has nothing to copy first — the one moment an operator is under pressure.
      #
      # The procedure is README's Recovery block, and it is three commands rather than the one
      # this comment used to give. Run against a target the stack has already booted — which is
      # what `docker compose up` produces before anyone can restore anything — a plain
      # `pg_restore -d ... /backups/<dump>` exits 1 with 333 errors: `connector_config`'s COPY
      # fails on its foreign key to `data_encryption_key` and the table ends empty, `app_setting`
      # fails on the primary key so the push keypair stays the fresh install's, and the result
      # boots, accepts logins and reports Jellyfin as unconfigured. Stop the app, and restore
      # with --clean --if-exists:
      #
      #   docker compose stop backend worker
      #   docker compose exec db pg_restore --clean --if-exists --no-owner \
      #       -U spielplan -d spielplan /backups/<dump>
      #   docker compose start backend worker
      #
      # The .env holding SECRETS_KEY must be the one that was current when the dump was taken,
      # and /data/artifacts is not in the dump: a box that lost it re-imports the bundle.
      #
      # And a dump restores only into the image that wrote it. --clean drops what the archive
      # holds, so a table a later release added survives the restore and that release's migration
      # then dies on it at the next boot — a DuplicateTableError naming a table, with nothing in it
      # about the dump. An older dump needs a database with nothing newer in it: README's Recovery
      # block drops and recreates it first, and lets this build migrate forward. [M4.7 ops-01]
      - ./data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spielplan} -d ${POSTGRES_DB:-spielplan}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ops/backend.Dockerfile
    environment:
      <<: *app-env
      SPIELPLAN_ROLE: backend
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
    # Docker's default is 10s to SIGKILL. 30s is for an ordinary request finishing and the pool
    # closing, and that is the whole of it, because nothing longer than that is in flight in this
    # process. §10's swap sequence ends in "restart backend + worker" and this comment used to
    # argue the number from that gesture — "while a bundle import's transaction may still be
    # open". It never is: `importer/bundle.import_bundle` opens and commits its transaction
    # inside the request, so by the time the Data tab has answered and the operator types the
    # restart, the flip is committed and there is nothing for a grace period to hold.
    #
    # So: a stop during an import is not covered, and cannot be at this value — §5.3 budgets the
    # bundle import at "minutes". A SIGKILL there rolls the database back and interrupts the copy
    # into /data/artifacts/<version>, leaving a partial staged tree, which the next import of
    # that version removes before it copies: the repair is to import again and the loss is
    # bounded. Buying that case a grace period would make every routine `docker compose stop`
    # wait minutes for a state one re-import fixes. The minutes-long work that IS worth waiting
    # for is the worker's, and its own grace period below says so. [M4.7 ops-08, cycle 2 f10]
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ops/backend.Dockerfile
    command: ["python", "-m", "spielplan.worker"]
    environment:
      <<: *app-env
      SPIELPLAN_ROLE: worker
    volumes: *worker-volumes
    depends_on:
      db:
        condition: service_healthy
    # The image's HEALTHCHECK curls the backend's HTTP port. The worker shares the image but
    # serves no HTTP, so that check can only ever fail. It used to be disabled outright, which
    # left `docker compose ps` saying "Up" for a worker whose loop was stuck — the one thing an
    # operator would want this column to tell them. `worker._tick` touches the heartbeat file at
    # the top of every tick, so its age is the age of the last completed pass round the loop.
    #
    # 120s is six ticks (TICK_SECONDS = 20), which is slack for a slow tick and not for a stopped
    # one. A single job that runs longer than that does report unhealthy, and deliberately: the
    # tick is sequential, so a job that long IS a loop that is not going round, and the nightly
    # dump — the one job whose budget is "minutes", measured at 35s on the corpus — is why
    # `stop_grace_period` below is what it is. Nothing declares `depends_on: worker:
    # service_healthy` and `restart: unless-stopped` does not act on health, so this reports
    # rather than restarts. CMD form, not CMD-SHELL: no nested quoting to get wrong.
    # [M4.7 ops-07]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, sys, time; p = pathlib.Path('/data/cache/worker.heartbeat'); sys.exit(0 if p.is_file() and time.time() - p.stat().st_mtime < 120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    # §2 budgets the nightly dump in minutes and §10 makes "restart backend + worker" a routine
    # gesture, so Docker's 10s default SIGKILLs mid-`pg_dump`: a `.partial` left behind, the pool
    # never closed, the "worker stopped" line never written, and the child `pg_dump` orphaned.
    # 5m covers the corpus dump with room. It costs nothing on a normal stop — SIGTERM sets the
    # stop event and the loop exits at the next tick boundary. This milestone does not cancel a
    # *running* job (that needs `dump()` to hold the Popen); the grace period is what buys the
    # time instead. [M4.7 ops-08]
    stop_grace_period: 5m
    restart: unless-stopped
