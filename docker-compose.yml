# Spielplan (§2). One internal plain-HTTP port, no GPU; TLS/ingress is the operator's own proxy.
# The static frontend is built in ops/backend.Dockerfile and served by the backend (§1 permits it).

x-app-env: &app-env
  # The password lives in POSTGRES_PASSWORD only; the nested defaults read what `db` reads.
  # A password written into DATABASE_URL by hand must be percent-encoded (see .env.example).
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-spielplan}:${POSTGRES_PASSWORD:-spielplan}@db:5432/${POSTGRES_DB:-spielplan}}
  PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required — WebAuthn binds credentials to this origin}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  SECRETS_KEY: ${SECRETS_KEY:?SECRETS_KEY is required — connector secrets never fall back to SESSION_SECRET}
  TZ: ${TZ:-Europe/Berlin}
  DATA_DIR: /data
  # §2: env vars may seed connector config on first boot. Forwarded one by one, not via
  # `env_file`, which would also push POSTGRES_*, BIND_ADDR and PORT into the app containers.
  JELLYFIN_URL: ${JELLYFIN_URL:-}
  JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
  TMDB_API_KEY: ${TMDB_API_KEY:-}
  OMDB_API_KEY: ${OMDB_API_KEY:-}
  TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
  TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

x-worker-volumes: &worker-volumes
  - ./data/raw:/data/raw
  - ./data/artifacts:/data/artifacts
  - ./data/cache:/data/cache
  - ./data/import:/data/import
  - ./data/backups:/data/backups

# No raw or backups: nothing in the backend reads them, and it serves anonymous callers (§14.3).
x-backend-volumes: &backend-volumes
  - ./data/artifacts:/data/artifacts
  - ./data/cache:/data/cache
  - ./data/import:/data/import

# Docker's json-file default never rotates, and the backend logs a line per healthcheck.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # The Debian suite is pinned with the major: a new one under `postgres:16` changes glibc's
    # collation, and every text index built under the old one needs a REINDEX.
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spielplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spielplan}
      POSTGRES_DB: ${POSTGRES_DB:-spielplan}
      # Read only when data/pg is first created; a cluster cannot turn checksums on while running.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      # The read side of the worker's dumps, for pg_restore. Restore per README's Recovery block:
      # a plain pg_restore into a stack that has booted fails.
      - ./data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spielplan} -d ${POSTGRES_DB:-spielplan}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: ops/backend.Dockerfile
    environment:
      <<: *app-env
      SPIELPLAN_ROLE: backend
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
    # Enough for an in-flight request. A bundle import killed mid-copy is repaired by re-importing.
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: ops/backend.Dockerfile
    command: ["python", "-m", "spielplan.worker"]
    environment:
      <<: *app-env
      SPIELPLAN_ROLE: worker
    volumes: *worker-volumes
    depends_on:
      db:
        condition: service_healthy
    # The image's HEALTHCHECK curls HTTP, which the worker does not serve. This reads the heartbeat
    # touched every tick (TICK_SECONDS = 20): 120s is six ticks. It reports; nothing restarts on it.
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, sys, time; p = pathlib.Path('/data/cache/worker.heartbeat'); sys.exit(0 if p.is_file() and time.time() - p.stat().st_mtime < 120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Lets a running nightly dump or bundle import finish. worker.BUNDLE_IMPORT_TIMEOUT is pinned
    # to this value: change both in one edit.
    stop_grace_period: 10m
    restart: unless-stopped
    logging: *logging
