<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0f" />
    <!-- §6 preamble: installable PWA, phone-first. iOS needs the app on the home screen
         before Web Push works at all, so the manifest is not optional dressing. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Fonts are self-hosted: the app has to render on the LAN and over Tailscale with no
         route to the internet, and a blocking stylesheet from a third-party host would make
         the shell wait on something it may not be able to reach. -->
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="%sveltekit.assets%/fonts/space-grotesk-400-latin.woff2" />
    <title>Spielplan</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
