# The database `pytest` runs against. Standalone, not an overlay: compose interpolates every
# service's `${VAR:?}` first, which would fail in a checkout with no `.env`.
#
#   docker compose -f ops/compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql://spielplan:spielplan@127.0.0.1:5442/spielplan_test
name: spielplan-test

services:
  testdb:
    image: postgres:16
    # Durability off, only here: every database in this cluster lives for one pytest run.
    command:
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      # Lock headroom for 16 xdist workers migrating at once; the default 64 ran out of shared memory.
      - -c
      - max_locks_per_transaction=256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spielplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spielplan}
      POSTGRES_DB: spielplan_test
    volumes:
      # A named volume, never ./data: the host bind mount is several times slower.
      - testdb-data:/var/lib/postgresql/data
    # 5442 so it cannot collide with a stack's own DB_PORT.
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5442}:5432"
    healthcheck:
      # Against `postgres`: the suite creates and drops its own databases.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spielplan} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  testdb-data:
