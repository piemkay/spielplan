# End-to-end overlay: adds a fake Jellyfin that the real stack must never have. Never auto-loaded;
# `node e2e/run.mjs` passes it itself:
#
#   docker compose -f docker-compose.yml -f ops/compose.dev.yml -f ops/compose.e2e.yml up -d
services:
  db:
    ports:
      # Re-declared: this overlay replaces the dev overlay's list, so a constant would override DB_PORT.
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  # Decision 483's no-egress switch: a harness run asks no internet host for a poster.
  backend:
    environment:
      SPIELPLAN_ART_EGRESS: "false"
  worker:
    environment:
      SPIELPLAN_ART_EGRESS: "false"

  jellyfin-fake:
    # The backend image only for its Python + uvicorn; the file is mounted, so an edit needs a
    # restart (e2e/reset.mjs does it), not a rebuild.
    build:
      context: .
      dockerfile: ops/backend.Dockerfile
    working_dir: /ops
    command: ["uvicorn", "fake_jellyfin:app", "--host", "0.0.0.0", "--port", "8096"]
    volumes:
      - ./ops/fake_jellyfin.py:/ops/fake_jellyfin.py:ro
    environment:
      FAKE_JELLYFIN_API_KEY: ${FAKE_JELLYFIN_API_KEY:-e2e-jellyfin-key}
      FAKE_JELLYFIN_PASSWORD: ${FAKE_JELLYFIN_PASSWORD:-e2e-jellyfin-password}
    ports:
      # Published so Playwright can drive the control surface directly.
      - "127.0.0.1:${JELLYFIN_FAKE_PORT:-8096}:8096"
    # The image's HEALTHCHECK curls port 8080, which this service does not serve.
    healthcheck:
      disable: true
