# Development overlay: publishes the database port. Never auto-loaded; pass it explicitly:
#
#   docker compose -f docker-compose.yml -f ops/compose.dev.yml up -d db
#   TEST_DATABASE_URL=postgresql://spielplan:<POSTGRES_PASSWORD>@127.0.0.1:5432/spielplan_test
#
# DB_PORT lets two checkouts run a stack each; the container side stays 5432.
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
