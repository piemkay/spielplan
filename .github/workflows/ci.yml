name: ci

on:
  # Every branch, not one. Eleven runs existed when this was written and all eleven were
  # `push main`: m3, m4, m45 and m5 each reached main having never run on Linux, so §12's exit
  # gates were first evaluated against a milestone on the merge commit — after the work, in one
  # diff, with nowhere to bisect. A gate that only fires after the merge is a report, not a gate.
  # [M4.8 finding 10]
  push:
    branches: ['**']
  # Kept, though `push` now covers this repository's own branches: a pull request from a fork is
  # not a push to this repository, and its ref (`refs/pull/N/merge`) is its own concurrency group,
  # so the duplicate run an internal PR now gets does not cancel the branch's.
  pull_request:
  workflow_dispatch:
  schedule:
    # A free weekly regression check on main. Nothing in this repository changes between
    # Mondays, but the runner images, the action versions and PyPI all do, and one tick a week
    # is how that arrives as a red run rather than as a red milestone.
    - cron: '17 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a branch's own in-flight run is what this setting is for. Superseding main's is
  # not: the M4 merge run was cancelled 71 s in by the next push, which left the one commit whose
  # result the gates are read off with no completed run at all. [M4.8 finding 10]
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Test-only values. The real ones live in .env, which is not in the repository.
  # `localhost`, not `127.0.0.1`: WebAuthn binds credentials to the *origin* (§2, §14.4), and
  # the browser tests must run against the same one the app was told it has.
  PUBLIC_URL: http://localhost:8080
  SESSION_SECRET: ci-session-secret-not-a-real-one
  SECRETS_KEY: ci-secrets-key-not-a-real-one-at-all
  POSTGRES_USER: spielplan
  POSTGRES_PASSWORD: spielplan
  POSTGRES_DB: spielplan

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # A venv, not `--system`: the runner's own interpreter is externally managed (PEP 668).
      - run: uv venv
      - run: uv pip install -e "backend[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      # The tuned test database developers run: a stock postgres:16 runs out of locks under -n 4.
      - run: docker compose -f ops/compose.test.yml up -d --wait
      - name: pytest (real Postgres 16)
        env:
          TEST_DATABASE_URL: postgresql://spielplan:spielplan@127.0.0.1:5442/spielplan_test
        run: python -m pytest backend/tests -q -n 4

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run check

  e2e:
    # The whole stack, from `docker compose up` to a browser. This is the only job that proves
    # what actually ships: the real backend serving the real built PWA over Postgres 16.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # run.mjs builds the fixture bundle with this venv (decision 299).
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - run: uv pip install -e "backend[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The same variables `.env.example` asks an operator to fill, and no more. DATABASE_URL used
      # to be written here too, which short-circuited the `${DATABASE_URL:-postgresql://...}`
      # default docker-compose.yml builds out of the three POSTGRES_* values — so the one
      # expression a household actually runs on was first evaluated on the household's box, by an
      # operator, at first boot. It is evaluated here now: the backend connects or this job fails.
      # [M4.7 ops-12]
      - name: write the env the compose stack requires
        run: |
          cat > .env <<EOF
          PUBLIC_URL=$PUBLIC_URL
          SESSION_SECRET=$SESSION_SECRET
          SECRETS_KEY=$SECRETS_KEY
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          BIND_ADDR=127.0.0.1
          PORT=8080
          TZ=Europe/Berlin
          EOF

      # The container runs as uid 1000 (§14.3), and Docker creates a missing bind-mount source as
      # root. data/import stays this runner's: run.mjs rebuilds it as this user.
      - name: give the container's uid the bind mounts it writes
        run: |
          mkdir -p data/raw data/artifacts data/cache data/import data/backups
          sudo chown -R 1000:1000 data/raw data/artifacts data/cache data/backups

      - run: npm --prefix e2e ci || npm --prefix e2e install
      # Both engines: the `phone` project is an iPhone 13, which Playwright runs on WebKit —
      # §6's phone-first layout is the primary one, not a resize of the desktop.
      - run: npx --prefix e2e playwright install --with-deps chromium webkit
      - name: playwright (first boot, restart, then everything)
        run: node e2e/run.mjs

      - name: stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      # `include-hidden-files`: `e2e/.results` is a dotted directory, and it holds the traces and
      # videos `playwright.config.js` retains on failure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/.results
          include-hidden-files: true
          retention-days: 7
