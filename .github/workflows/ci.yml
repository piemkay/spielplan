name: ci

on:
  # Every branch, not one. Eleven runs existed when this was written and all eleven were
  # `push main`: m3, m4, m45 and m5 each reached main having never run on Linux, so §12's exit
  # gates were first evaluated against a milestone on the merge commit — after the work, in one
  # diff, with nowhere to bisect. A gate that only fires after the merge is a report, not a gate.
  # [M4.8 finding 10]
  push:
    branches: ['**']
  # Kept, though `push` now covers this repository's own branches: a pull request from a fork is
  # not a push to this repository, and its ref (`refs/pull/N/merge`) is its own concurrency group,
  # so the duplicate run an internal PR now gets does not cancel the branch's.
  pull_request:
  workflow_dispatch:
  schedule:
    # A free weekly regression check on main. Nothing in this repository changes between
    # Mondays, but the runner images, the action versions and PyPI all do, and one tick a week
    # is how that arrives as a red run rather than as a red milestone. The corpus check this
    # cron was first written for (decision 183) answers its own copy of it in
    # `.github/workflows/real-bundle.yml`: a self-hosted job nobody has registered a runner for
    # queues for 24 hours, and the group below — which the whole run holds until its last job
    # ends — is where main's next push would spend that day pending.
    # [M4.8 review cycle 4, m48-c4-ci-01]
    - cron: '17 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a branch's own in-flight run is what this setting is for. Superseding main's is
  # not: the M4 merge run was cancelled 71 s in by the next push, which left the one commit whose
  # result the gates are read off with no completed run at all. [M4.8 finding 10]
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Test-only values. The real ones live in .env, which is not in the repository.
  # `localhost`, not `127.0.0.1`: WebAuthn binds credentials to the *origin* (§2, §14.4), and
  # the browser tests must run against the same one the app was told it has.
  PUBLIC_URL: http://localhost:8080
  SESSION_SECRET: ci-session-secret-not-a-real-one
  SECRETS_KEY: ci-secrets-key-not-a-real-one-at-all
  POSTGRES_USER: spielplan
  POSTGRES_PASSWORD: spielplan
  POSTGRES_DB: spielplan

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # A venv, not `--system`. The runner's own interpreter is externally managed (PEP 668) so
      # uv refuses to install into it, and it is not writable by the runner's user anyway — the
      # two failures arrived in that order. Putting the venv's bin on PATH keeps every command
      # below unchanged.
      - run: uv venv
      - run: uv pip install -r backend/pyproject.toml --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: ruff format --check . || true   # formatting is not enforced yet; the check is informational

  backend:
    # Everything that needs no database, plus the schema check against a real Postgres engine
    # compiled to wasm — so DDL errors surface even on a runner with no service container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: uv venv
      - run: uv pip install -e "backend[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm --prefix backend/tests/pglite ci || npm --prefix backend/tests/pglite install
      # `--junitxml`, and that is the whole of this job's change. The report is the per-push record
      # of WHICH tests ran, in the form `ops/coverage_gate.py` reads -- the question rule 2 of the
      # coverage map cannot answer: not whether a named test EXISTS, but whether it RAN.
      #
      # What it is NOT is the release gate's input, and this comment said it was. Leg 2 of
      # `release.yml` reads the JUnit LEG 1 wrote in its own job, against its own Postgres, plus
      # the `playwright-report` artifact this workflow uploads; its single `download-artifact`
      # step names that report and nothing else, so `junit-backend` and `junit-integration` are
      # downloaded by no workflow at all. They are kept for a reader. Claiming otherwise gave the
      # maintainer weighing this step's worth a premise the file it named contradicts, which is
      # the defect class this milestone exists to remove.
      #
      # The `test_migrations.py` family closes 9 rows, and eight of them go dark without
      # `backend/tests/pglite/node_modules`, which is why this job installs it; leg 2 installs it
      # for itself, for its own stated reason. The clause stays on ONE line because the guard that
      # holds it flattens whitespace and a YAML `#` would land between the count and its noun.
      # [decision 317; M4.16 cycle 4: M416-C4-CI-01, M416-C4-CI-02]
      - name: pytest (no database)
        run: python -m pytest backend/tests -q --junitxml=.reports/junit-backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-backend
          path: .reports/junit-backend.xml
          retention-days: 7

  integration:
    # The tests that only exist against a real server: COPY resolves its encoders from the
    # destination column types, so type mismatches cannot be caught anywhere else.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spielplan
          POSTGRES_PASSWORD: spielplan
          POSTGRES_DB: spielplan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spielplan -d spielplan_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - run: uv pip install -e "backend[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # The second half of the pair above, and the one that matters more to whoever opens it: the
      # integration layer is where a row's evidence disappears quietly, because a fixture that
      # cannot reach Postgres skips rather than fails (`tests/conftest.py`), and `-rs` is not on
      # by default. This report is what tells "the database was there" from "the database was
      # there and the test ran" -- for a reader of this run, not for the release gate, which
      # reaches the same layer through leg 1's own compose stack and reads leg 1's own JUnit.
      # [decision 317; M4.16 cycle 4, M416-C4-CI-01]
      - name: pytest (real Postgres 16)
        env:
          TEST_DATABASE_URL: postgresql://spielplan:spielplan@127.0.0.1:5432/spielplan_test
        run: python -m pytest backend/tests -q --junitxml=.reports/junit-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: .reports/junit-integration.xml
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      # svelte-check, appended last, because it is the only static signal this frontend has
      # and it spent the project's life as a documented command no job ran: 25 errors on one
      # day and 27 on another, on trees every gate called green. Its exit code is NOT
      # discarded the way `ruff format --check`'s is in the lint job -- that step is
      # informational on purpose and this one is not, which is the whole difference between a
      # gate and a report. It lands red by decision 273: M4.15 cleared 27 of the 28 errors
      # and left `src/routes/admin/data/+page.svelte`'s one to M4.14, which owns that file in
      # the same wave. [M4.15 finding 26]
      - run: npm --prefix frontend run check

  e2e:
    # The whole stack, from `docker compose up` to a browser. This is the only job that proves
    # what actually ships: the real backend serving the real built PWA over Postgres 16.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # The same three lines the lint, backend and integration jobs carry, and for the same
      # reason. The bundle-fixture step below used to open with a bare `python -m pip install -e
      # "backend[dev]"` against the runner image's /usr interpreter — the externally managed
      # (PEP 668) one uv refused at the M3 merge, which is why those three jobs have a venv. It
      # worked only because the ubuntu-24.04 image writes /etc/pip.conf with
      # `break-system-packages = true`, a pip-only setting uv never reads: the one job that proves
      # what actually ships was a runner-image change away from failing at its first step. It also
      # resolved torch from PyPI — about 2.8 GB of CUDA wheels to build a four-title fixture,
      # where §1 requires the CPU build and the pyproject's CPU index delivers 187 MiB. The venv
      # goes on PATH here, before the fixture step, so that step's `python` is this one.
      # [M4.8 finding 11]
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - run: uv pip install -e "backend[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The same variables `.env.example` asks an operator to fill, and no more. DATABASE_URL used
      # to be written here too, which short-circuited the `${DATABASE_URL:-postgresql://...}`
      # default docker-compose.yml builds out of the three POSTGRES_* values — so the one
      # expression a household actually runs on was first evaluated on the household's box, by an
      # operator, at first boot. It is evaluated here now: the backend connects or this job fails.
      # [M4.7 ops-12]
      - name: write the env the compose stack requires
        run: |
          cat > .env <<EOF
          PUBLIC_URL=$PUBLIC_URL
          SESSION_SECRET=$SESSION_SECRET
          SECRETS_KEY=$SECRETS_KEY
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          BIND_ADDR=127.0.0.1
          PORT=8080
          TZ=Europe/Berlin
          EOF

      # No `pool_titles`: the browser suite counts what this writes (10-home.spec.js:99,258 and
      # test_import_integration.py assert the small numbers), so the scale mode M4.8 gave
      # make_bundle stays off here on purpose. [M4.8 step 6c]
      - name: build a bundle fixture into the import directory
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'backend')
          from tests.fixtures import make_bundle as fx
          fx.make_bundle(pathlib.Path('data/import'))
          print('fixture bundle written')
          PY

      # ops/backend.Dockerfile runs its processes as uid 1000 (§14.3), and every ./data path is a
      # host bind mount: the step above created data/import as this runner's user, and Docker
      # creates the four that do not exist yet as root. Without this the worker cannot write a
      # dump and the importer cannot stage the bundle the whole e2e suite is about. README's
      # "Running it" carries the same two lines for a household box. Not data/pg — that belongs
      # to the postgres image's own user.
      #
      # It runs before the stack because Docker creates a missing mount source as root, and it is
      # spent once: `e2e/reset.mjs` empties `data/artifacts` rather than removing it, precisely so
      # that this step still holds after the reset it runs in the middle of. [M4.7 sec-08]
      #
      # And data/import comes straight back, since decision 299: `node e2e/run.mjs` below rebuilds
      # that directory with `make_bundle` as THIS runner's user, and creating `content.sqlite` or
      # an entry under `artifacts/` needs write on the DIRECTORY rather than on a file. Handing it
      # to uid 1000 and stopping there killed the e2e job at run.mjs's first statement on every
      # hosted runner, whose user is 1001. The container only ever reads it: a directory bundle is
      # opened in place, and the one uid-1000 write this directory takes is `_unpack`'s
      # `.unpacked-*` beside an ARCHIVE, which the fixture never is. The `chown -R` above stays as
      # it is, because what it protects against is Docker creating a missing mount source as root.
      # [M4.16 cycle 1, M416-REL-05]
      - name: give the container's uid the bind mounts it writes
        run: |
          mkdir -p data/raw data/artifacts data/cache data/import data/backups
          sudo chown -R 1000:1000 data/raw data/artifacts data/cache data/import data/backups
          sudo chown -R "$(id -u):$(id -g)" data/import

      # ops/compose.e2e.yml adds the fake Jellyfin §7.3's two-way sync is tested against.
      - run: >
          docker compose -f docker-compose.yml -f ops/compose.dev.yml -f ops/compose.e2e.yml
          up -d --build
      - name: wait for the backend and the fake Jellyfin
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8096/System/Info/Public > /dev/null || { sleep 2; continue; }
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - run: npm --prefix e2e ci || npm --prefix e2e install
      # Both engines: the `phone` project is an iPhone 13, which Playwright runs on WebKit —
      # §6's phone-first layout is the primary one, not a resize of the desktop.
      - run: npx --prefix e2e playwright install --with-deps chromium webkit
      - name: playwright (first boot, restart, then everything)
        run: node e2e/run.mjs

      - name: stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      # `include-hidden-files`, because `e2e/.results` is a dotted directory and v4 drops those by
      # default: the traces and videos `playwright.config.js` retains on failure, and now the JSON
      # report `release.yml`'s leg 2 reads to answer whether the map's e2e rows actually ran, were
      # all being uploaded as an empty half of this artifact. The HTML report survived, which is
      # why nobody noticed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/.results
          include-hidden-files: true
          # Thirty, not seven, and the number answers to `release.yml`'s cadence rather than
          # to this job's. Leg 2 of the release gate downloads THIS artifact for the commit
          # under test and its lookup reads no date, so on a Monday when this workflow is
          # red it falls through to the previous Monday's successful run -- which, at seven
          # days, is expiring the same morning. The download then fails and the release gate
          # reports a red build for a reason that is not the build. Every artifact
          # `release.yml` uploads already keeps thirty; this is its one input catching up.
          # [M4.16 cycle 2, M416-C2-REL-04]
          retention-days: 30
