name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. The real ones live in .env, which is not in the repository.
  PUBLIC_URL: http://127.0.0.1:8080
  SESSION_SECRET: ci-session-secret-not-a-real-one
  SECRETS_KEY: ci-secrets-key-not-a-real-one
  POSTGRES_USER: spielplan
  POSTGRES_PASSWORD: spielplan
  POSTGRES_DB: spielplan

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system -r backend/pyproject.toml --extra dev
      - run: ruff check .
      - run: ruff format --check . || true   # formatting is not enforced yet; the check is informational

  backend:
    # Everything that needs no database, plus the schema check against a real Postgres engine
    # compiled to wasm — so DDL errors surface even on a runner with no service container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: uv pip install --system -e "backend[dev]"
      - run: npm --prefix backend/tests/pglite ci || npm --prefix backend/tests/pglite install
      - name: pytest (no database)
        run: python -m pytest backend/tests -q

  integration:
    # The tests that only exist against a real server: COPY resolves its encoders from the
    # destination column types, so type mismatches cannot be caught anywhere else.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spielplan
          POSTGRES_PASSWORD: spielplan
          POSTGRES_DB: spielplan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spielplan -d spielplan_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system -e "backend[dev]"
      - name: pytest (real Postgres 16)
        env:
          TEST_DATABASE_URL: postgresql://spielplan:spielplan@127.0.0.1:5432/spielplan_test
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  e2e:
    # The whole stack, from `docker compose up` to a browser. This is the only job that proves
    # what actually ships: the real backend serving the real built PWA over Postgres 16.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: write the env the compose stack requires
        run: |
          cat > .env <<EOF
          PUBLIC_URL=$PUBLIC_URL
          SESSION_SECRET=$SESSION_SECRET
          SECRETS_KEY=$SECRETS_KEY
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
          BIND_ADDR=127.0.0.1
          PORT=8080
          TZ=Europe/Berlin
          EOF

      - name: build a bundle fixture into the import directory
        run: |
          python -m pip install --quiet -e "backend[dev]"
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'backend')
          from tests.fixtures import make_bundle as fx
          fx.make_bundle(pathlib.Path('data/import'))
          print('fixture bundle written')
          PY

      - run: docker compose -f docker-compose.yml -f ops/compose.dev.yml up -d --build
      - name: wait for the backend
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - run: npm --prefix e2e ci || npm --prefix e2e install
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: playwright (first boot, restart, then everything)
        run: node e2e/run.mjs

      - name: stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/.results
          retention-days: 7
