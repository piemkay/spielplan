what = "The hold-out pair for a given seat and answer count is the same pair and the same card token on every read of the round, and a token minted for that seat and count names that pair and no other; the arm fires at the 1-in-10 rate rather than on fixed slots, so a round ended by the escape at pair six still carries hold-outs."
