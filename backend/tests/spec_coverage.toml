[[requirement]]
id = "platform-account-writes-are-atomic"
spec = "§3.1 first-boot sequence; §4.2 setup_step"
milestone = "M4.6"
kind = "integration"
what = "A multi-write account route that fails part way leaves no row from its earlier statements — demonstrated on `POST /api/setup/admin` and on the three routes that replace one session with another (`POST /api/auth/login`, `POST /api/auth/passkey/login` and `POST /api/auth/switch`) with `create_session` raising, the last three leaving the device holding the session it arrived with — two concurrent first-boot admin creations with different names produce exactly one 201 and one 409 and one admin row against a warmed pool, and a duplicate name on any creation route answers 409 rather than 500."
why = "§3.1's first boot is the one flow a household runs exactly once, under an operator with no recovery instructions; today the route's own docstring calls it a privilege-escalation endpoint if it is ever reachable twice, and the check-then-insert is three autocommit statements with no lock."
