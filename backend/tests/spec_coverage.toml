[[requirement]]
id = "tonight-rank-tilt-centred-on-the-pool-mean"
spec = "§6.2 steps 4–5 (tilt observation) + §0 row 4 (the centring lever) + §4.2 session_participant.tilt"
milestone = "M4"
kind = "backend"
what = "Each separating answer yields a tilt observation of chosen-minus-rejected DNA taken relative to the mean DNA vector of that session's own candidate pool: the identical answer on the identical pair produces a different tilt when the surrounding pool differs, and a tilt computed with no centring — or centred on the library or corpus mean instead of the pool — is a distinguishable, failing result; the accumulated tilt is persisted on that participant's session_participant.tilt."
why = "§0 row 4 measured that centring on the candidate set matters more than the form of the question (3 shortlist-anchored answers ≈ +0.088 AUC while the stored 8-axis profile is worth 0.000), which is why the centring is the one piece of the deleted mood machinery the redesign kept."
tests = [
    "backend/tests/test_tonight_tilt.py::test_the_pool_frame_is_the_pools_own_mean_and_spread",
    "backend/tests/test_tonight_tilt.py::test_a_candidate_is_expressed_as_its_deviation_from_the_pool",
    "backend/tests/test_tonight_tilt.py::test_a_separating_answer_tilts_toward_the_chosen_title",
    "backend/tests/test_tonight_tilt.py::test_the_same_answer_on_the_same_pair_tilts_differently_in_a_different_pool",
    "backend/tests/test_tonight_tilt.py::test_centring_on_a_library_mean_instead_of_the_pool_is_a_different_answer",
    "backend/tests/test_tonight_tilt.py::test_either_lifts_the_pool_frame_toward_both_and_neither_away_from_both",
    "backend/tests/test_tonight_tilt.py::test_the_tilt_accumulates_across_answers",
    "backend/tests/test_tonight_tilt.py::test_the_tilt_raises_candidates_that_look_like_what_was_chosen",
    "backend/tests/test_tonight_tilt.py::test_the_tilt_round_trips_through_json",
    "backend/tests/test_tonight_integration.py::test_an_answer_moves_the_participants_tilt",
    "backend/tests/test_tonight_tilt.py::test_an_untagged_candidate_is_a_zero_rather_than_the_pools_anti_title",
    "backend/tests/test_tonight_tilt.py::test_a_term_the_rejected_title_does_not_carry_is_absent_rather_than_fabricated",
    "backend/tests/test_tonight_tilt.py::test_one_answer_reaches_the_tilt_the_same_way_whichever_caller_applies_it",
    "backend/tests/test_tonight_tilt.py::test_an_answer_naming_a_title_that_has_left_the_pool_moves_nothing",
    "backend/tests/test_tonight_tilt.py::test_an_answer_naming_one_title_twice_is_not_two_candidates",
    "backend/tests/test_tonight_tilt.py::test_the_frame_counts_an_absent_term_as_a_zero_and_centred_gives_it_no_coordinate",
    "backend/tests/test_tonight_integration.py::test_an_answer_naming_one_title_twice_is_not_a_comparison",
]
# M4.12 cycle 1. Two more, and they are the two halves decision 218 left facing each other.
# M412-SOLO-04: `applies` is spelled as membership, which one title named twice satisfies -- so
# solo counted such an answer into "tilted by your N answers" over a delta of exactly zero, while
# `round.replay`'s identically-spelled guard let the belief move most of a standard deviation on a
# comparison that compares nothing. D3-04: `frame` reads an absent term as a zero and `centred`
# now gives it no coordinate at all, which are answers to two different questions (the pool's
# distribution against one candidate's position) and were left as two unreconciled sentences four
# lines apart -- with nothing pinning the first, because the toy pool carries every term on every
# title, so applying `centred`'s rule to `frame` left this module green.
# M4.12 decision 218 and finding 27. "Taken relative to the mean DNA vector of that session's own
# candidate pool" was true of a tagged candidate and false of an untagged one: `centred` read an
# absent term as 0.0 and then centred it, so a title with no DNA -- 32% of the shipped library --
# became the pool's anti-title on every term, and they all became the SAME anti-title, so they
# rose or fell as a block by about 0.44 sd of the score spread. Every fixture in the file was
# symmetric, which cancels it exactly, and the toy pools read 0.0 while the corpus did not.
#
# The integration test is named above and is unchanged in name only: it asserted
# `isinstance(after, dict)`, which is true of the empty dict -- a registered test that passed on a
# tilt that had not moved. It is directional now (the chosen title outranks the rejected one under
# the resulting tilt, and the opposite answer is the exact negation). The last two tests are the
# one-helper repair from finding 37, which is the same claim on the other side: an answer §10 took
# out of the pool must not reach the tilt either, and three copies of the dispatch had already
# drifted about whether it did.


