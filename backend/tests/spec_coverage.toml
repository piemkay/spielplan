[[requirement]]
id = "data-rules-hyperparameters-are-read-not-invented"
spec = "§4.3 ledger_hyperparams.json; §5.2 (\"every constant comes from ledger_hyperparams.json\")"
milestone = "M4.13"
kind = "backend"
what = "A constant the bundle marks provisional or ships as null disables the rule that reads it rather than being replaced by a literal — a null σ-inflation rate produces no live inflation and a loud note. from_mapping refuses a boolean where a number is required — at every numeric gate, including sigma_inflation_cap and the two solver knobs (newton_tol, lr_min) that were in no check list at all. digest(12) equals digest(12.0). The fold-in grid, the evidence gate k and the warm threshold are Hyperparams fields with today's values as defaults, and the §6.0 gate_k is read from the same place the scoring stack reads it."
why = "The shipped file says rate_c_per_sqrt_month null, provisional true, 'no measurement behind the rate yet — tune before use'; the app read the flag, recorded it as deliberately unused, and ran the mechanism at its own 0.05. bool is an int subclass, so {\"steps\": true} became one step under source='bundle' with a legitimate-looking digest. Twelve constants fell to defaults while the fold-in, the gate and Tonight were unreachable from the bundle at all."
tests = [
    "backend/tests/test_ledger_hyperparams.py::test_a_null_sigma_inflation_rate_disables_the_inflation_and_notes_it",
    "backend/tests/test_ledger_hyperparams.py::test_a_provisional_constant_disables_its_rule_rather_than_falling_back",
    "backend/tests/test_ledger_hyperparams.py::test_from_mapping_refuses_a_boolean_where_a_number_is_required",
    "backend/tests/test_ledger_hyperparams.py::test_the_digest_is_the_same_for_twelve_and_twelve_point_zero",
    "backend/tests/test_ledger_hyperparams.py::test_the_foldin_grid_the_gate_k_and_the_warm_threshold_are_bundle_constants",
    "backend/tests/test_ledger_hyperparams.py::test_the_model_line_reads_the_gate_k_the_scoring_stack_reads",
]

