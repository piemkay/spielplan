# escaped-round half of the `what` is asserted there too, over the seats whose arm fires inside
# 54c's first five pairs: an integration test cannot choose a seat's draw, and 12% of seats draw
# nothing inside a whole round, so waiting for one would be a coin flip dressed as a measurement.
