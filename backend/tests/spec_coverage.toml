[[requirement]]
id = "library-rate-mix-alternates-blocks"
spec = "§6.1 (\"Mix (default — alternates sweep and battle); blocks of 15\")"
milestone = "M2"
kind = "integration"
what = "A fresh Rate session serves Mix; each observation (verdict, not-seen, skip, duel, tie) advances the block counter by one and flips the served card type between sweep and battle, so a run of duels still returns sweep cards — including across the block boundary; the counter runs 1..15 and rolls into a new block."
why = "Mix is the default mode and the block of 15 is the unit Undo's depth and the counter copy both hang off (decision 35)."
# The boundary clause is M4.10's. `card_type_for` was a pure function of the slot and returned sweep
# on odd slots, and `advance` rolls slot 15 to slot 1: fifteen is odd, so every block ended and the
# next began with a sweep — eight sweeps to seven battles and one consecutive-same pair per block,
# which over §6.1's 50-100-verdict target is three to seven fewer duels than the clause promises, in
# the arm §5.2 credits with within-liked resolution. Decision 200 derives the type from the monotone
# observation index over (block, slot) rather than amending §6.1, keeping slot 1 of the FIRST block a
# sweep; the test that asserted alternation from the slot could not see the boundary it stood on.
# [M4.10 finding 24, cs-64]
#
# The static pair is the register's half. Decision 200's own text named `rate_session.seq` — the
# journal's row count, which a correction advances and Undo does not rewind — so the binding record
# described an implementation `observation_index`'s docstring argues at length against. A later
# milestone citing the decision would have rewired the call site onto that column, and nothing in
# the list above distinguishes the two counters: they agree on every plain answer.
# [M4.10 review cycle 1: M410-D8-04, M410-REV1-D200-02]
tests = [
    "backend/tests/test_rate_session.py::test_mix_alternates_on_the_counter_and_not_on_the_last_card_served",
    "backend/tests/test_rate_session.py::test_a_run_of_duels_still_returns_sweep_cards",
    "backend/tests/test_rate_session.py::test_every_kind_of_observation_advances_the_counter_by_exactly_one",
    "backend/tests/test_rate_session.py::test_the_counter_runs_to_fifteen_and_rolls_into_a_new_block",
    "backend/tests/test_rate_session.py::test_the_card_type_is_a_pure_function_of_the_monotone_counter_and_the_block_rolls_at_fifteen",
    "backend/tests/test_rate_session.py::test_mix_keeps_alternating_across_the_block_roll",
    "backend/tests/test_static_contracts.py::test_decision_200_names_the_counter_the_card_type_is_derived_from",
    "backend/tests/test_static_contracts.py::test_the_decision_200_counter_guard_catches_each_way_it_was_said",
    "e2e/specs/11-rate.spec.js::a fresh session opens in Mix, at 1 / 15, on a sweep card that says why it is here",
    "e2e/specs/11-rate.spec.js::Mix alternates on the counter, so an answered duel is followed by a sweep card",
    "e2e/specs/11-rate.spec.js::the counter runs to 15 and rolls, and Undo then disables visibly at the boundary",
]

