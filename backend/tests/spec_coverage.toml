# --- M4.8: the instrument (decisions 183-186; docs/milestones/M4.8-plan.md) -------------
#
# Ten rows, none of them about a product surface. M4.8 repairs the things that measure this
# project — the bundle fixture, the pytest layer, the two §4.1 landmine guards, the browser
# harness, CI's trigger and installer, and the three milestone exit scripts — because each of
# them printed as covered while unable to fail. Every row below names the tests it is owed before
# those functions exist, and `current_milestone` is raised to M4.8 in the same change: rule 2's
# red list is therefore this milestone's test plan, and it names functions rather than rows. The
# names are binding on the stages that write them — a stage that ships the behaviour under a
# different name leaves this file red, which is the whole point of writing them down first.
# The tenth row is review cycle 1's and was not in the plan's contract, because the two defects
# it registers were committed by this milestone's own new code: the plan could not name a row for
# a parser it was about to write. It is here rather than folded into a neighbour because neither
# neighbour's `what` describes it, and a test registered under a `what` that does not cover it is
# the disease this milestone treats.

[[requirement]]
id = "platform-e2e-run-fails-when-no-bundle-loads"
spec = "§10 swap sequence"
milestone = "M4.8"
kind = "static"
what = "e2e/run.mjs's post-restart health loop has a failure branch: when the restarted backend never reports a loaded bundle the script exits non-zero and never prints 'phase 2', and every health fetch carries a request deadline so one unanswered connection cannot hold the loop for ever. The failure message names the attempt count and the ceiling those attempts actually buy, rather than a smaller number the loop cannot honour. The tag phase 2 inverts is the tag the first-boot file actually carries, so a tagged spec runs in exactly one of the two phases."
why = "§10's swap ends in 'restart backend + worker', so a bundle imported in phase one is not loaded until the services come back; nine spec files skip on !has_bundle, and a phase 2 of only skips exits 0. e2e/reset.mjs:94-95 is the same loop written correctly. A tag that selects a test into neither phase makes a registered test that has never run. Review cycle 2: the deadline that made the loop bounded is what made its own message wrong — an attempt is 5 s plus a 1 s sleep, so sixty of them is six minutes under a sentence that said sixty seconds, and an operator who reads that raises the attempt count because the run looks like a slow boot rather than like sixty consecutive stalls."
tests = ["backend/tests/test_harness_contracts.py::test_the_e2e_runner_exits_when_no_bundle_loads", "backend/tests/test_harness_contracts.py::test_every_health_fetch_in_the_runner_carries_a_deadline", "backend/tests/test_harness_contracts.py::test_phase_two_inverts_the_tag_the_first_boot_file_carries", "backend/tests/test_harness_contracts.py::test_the_runner_guard_sees_a_health_loop_with_no_failure_branch", "backend/tests/test_harness_contracts.py::test_the_tag_guard_sees_a_runner_and_a_spec_that_disagree", "backend/tests/test_harness_contracts.py::test_no_health_loop_claims_a_shorter_wait_than_it_can_spend", "backend/tests/test_harness_contracts.py::test_the_wait_message_guard_sees_a_budget_that_is_not_the_loops"]

