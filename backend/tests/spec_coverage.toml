[[requirement]]
id = "tonight-rank-no-route-raises-after-its-observation-commits"
spec = "§6.3 (\"the model refits — incremental immediately\") + §5.3 + §4.2"
milestone = "M4.10"
kind = "integration"
what = "With `refit.update_incrementally` monkeypatched to raise `RefitRefused`, `POST /api/rank/drop` and `POST /api/rank/queue/answer` return 200 carrying `ledger.applied == false` with a reason, and exactly one `tier_edit` / one `duel` exists after the call and after a retry; with two 300-character title names the answer route still returns 200 and the recorded rail line is at most `MAX_LINE`, and so does `POST /api/rate/verdict` with a 64-character member name and a 310-character title; and on a cache miss the request returns without an inline MAP fit, with `refit_requested_at` set for that `(user, kind)` and with the response saying the fit is owed rather than reporting a millisecond count for one that never ran — neither the model log nor §6.7's rail line quotes a refit; and `GET /api/rank` over that owed fit answers `fitting: true` with a why-line that does not count to zero, clearing to `false` and to the count once the fit is serviced the way `tier-set-refit` services it, while a board with nothing rated and nothing owed keeps proposal 80's unrated copy."
why = "Both Rank routes call the refit bare after the observation committed, while the Rate seam catches the same exceptions on purpose — so one surface loses the tap and the other does not, and each retry of the lost one writes another append-only row. A rail line built after the write can refuse a line whose write already happened, which is the failure `rank/tiers.py`'s `MAX_LABEL` comment already records for tier labels. And a request that declines to fit hands the window to the reader: §6.3's board renders `ledger_state`, so until the sweep lands it answers the first-sitting member exactly what it answers somebody who has never opened Rate."
# The retry clause is asserted at the answer route, where the seal makes a repeat idempotent and
# the replay is a 409 over one row. It deliberately is NOT asserted at the drop route: decision 202
# rules that a drop carries no seal and two identical drops a minute apart are two legitimate
# gestures, so there the property is the 200 itself — it removes the client's reason to repeat.
#
# Three raise sites and one rule: after the observation is durable, the route reports rather than
# raises. The cache-miss clause is finding 9's half of the same rule — a miss used to run the full
# MAP fit with a dense O((p+n)^3) inverse inside the request, which is both the §5.3 budget and the
# reason a refusal landed there at all — and it is claimed here rather than on
# `jellyfin-acquisition-eval-cpu-job-budgets`, once, as the plan requires. What the routes report is
# `ledger.applied == false` with a reason — a miss included, which is the plan's own letter for that
# branch ("so the caller reports `applied=False`"). The first build read `applied` as "nothing
# refused" and kept `refit: true` with a millisecond count, which is true of the flag and false of
# the two sentences the flag drives: `RateModelLog.svelte` renders `refit` and `ms`, and §6.7's rail
# quotes the same `ms`, so the commonest tap in the app — the first one per (user, kind) — printed
# "incremental refit 13 ms" over an empty `ledger_fit`. The reason names the queue instead, so what
# the person reads is the truth: the fit is owed, not lost. [M4.10 cycle 2,
# m410-c2-cache-miss-reports-a-refit-that-did-not-run]
# [M4.10 findings 8, 9: ml07-rank-drop-500-after-durable-observation,
# rrh-rank-post-commit-exceptions-duplicate-writes, perf-03-ledger-full-refit-on-the-tap-path]
#
# The rail clause names the Rate route as well as the two Rank ones, which the plan's own wording
# for this row did not: finding 8's three raise sites are all on Rank, so `verdict_line` shipped
# with neither of its two names elided while the exit criterion's clause 4 reads "no Rank OR RATE
# route raises after its observation commits". §6.7's commonest line is the Rate one, it is composed
# after the verdict has committed, and the retry a 500 forces is refused because the card token is
# already nulled — so the widened `what` is this row's claim made to cover its own exit criterion.
# No new row: decision 206 fixes the count at ten. [M4.10 cycle 1, M410-R1-01]
#
# The board clause is decision 209's, and it belongs here rather than on a row of its own for the
# reason this row's own comment already gives: "what the person reads is the truth: the fit is owed,
# not lost". That sentence was written about the model log; the surface §6.3 makes a promise about
# was reading the same owed fit as a ledger with nothing in it. Two tests, at the two layers that
# can each break it alone — the route, which is the only place the stamp and the counts are read
# together, and `emptyState()`, which is the only place the two empty boards are told apart in
# words. Decision 206's count of ten rows is untouched. [decision 209]
tests = [
