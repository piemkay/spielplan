milestone = "M4.12"
kind = "e2e"
what = "A room with one guest seat completes: the host answers, hands the phone for the guest's round, then hands it again for the guest's ballot, and the reveal appears once every seat has submitted. The incoming guest's approval selections start empty and none of the previous person's are visible."
why = "submitted_count counts guest seats, so a room with any guest could never reach the reveal — the ballot Submit was bound to the viewer's own seat and a guest seat carries user_id NULL. The backend already permitted the write; only the control was missing, and clearing the selections on hand-off is what keeps 54e blind on the one device the hand-off exists to protect."
# The Playwright test is the EXISTING guest hand-off case extended through to the reveal rather
# than a second file: the specs are filename-ordered and single-worker, and the room this claim
# needs is the room that test already opens. It is the only layer that can fail on the clause,
# because what was missing was a control -- the write it makes has been permitted since M4 and
# an API test of it passes on a build where no screen can reach it.
#
# The vitest ids are supporting evidence and never the whole of a row (decision 226): they hold
# the rules a browser can only observe through their consequences -- which seat is offered, when
# the ballot is finished, and that the ticks are dropped at the moment the phone changes hands.
# The last of those is the half the fix itself could have broken, since `approved` lives in the
