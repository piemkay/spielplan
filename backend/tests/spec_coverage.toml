# --- M4.11: seen states both ways, for a real household ----------------------------------------
#
# Seventeen rows written before the code with no `tests` key on any of them, so the red list the
# gate prints IS the test plan (docs/milestones/M4.11-plan.md) -- M4.10's opening, repeated
# because it worked. What they measure is one row this map already had: §12's M1 exit criterion,
# "seen states flow both ways for both users", closed against one member, one copy per title, no
# series and no second phone. Every row below is a clause of that criterion asserted against the
# household §3.3 describes instead -- two members, duplicated copies, a running series, two
# phones each. Decisions 210-212 record the three calls the plan left to the owner, and decision
# 211 is why the only schema this milestone takes is `0020_jellyfin_items.sql`'s copy set: the
# plan's fifth `prompt_state` is dropped rather than migrated for.
#
# Seven rows this map already had are amended in place ABOVE rather than duplicated here, because
# each of them is the same clause asserted against the easier household and a second row would
# have left the easy one standing as a claim about the app: the three §7.3 rows
# (`...-playback-arms-prompt-never-writes`, `...-seen-sync-no-echo-loop`,
# `...-seen-write-uses-per-user-token`), §7.1's `...-title-upsert-fill-never-clobber`, the
# `...-finish-prompt-banner-path` row decision 212 extends, §3.3's
# `platform-jellyfin-link-optional-one-to-one`, and M2's `library-rate-push-subscription-write`.
# Two registered names moved with them and are swapped in those rows in the same change, because
# `test_every_named_test_exists` fails on the gap: `test_declining_the_prompt_writes_nothing_and
# _closes_it` -> `..._writes_unseen_and_closes_it` (decision 211 makes the old name false) and
# `test_a_rewatch_on_the_same_device_asks_again` -> `test_a_rewatch_in_a_new_viewing_asks_again`
# (the dismissal guard is keyed on the viewing, which `0006_jellyfin.sql:29-37` says is the device).
#
# No vitest id is named by any of the seventeen, and that is a layer choice rather than a limit --
# `_vitest_ids()` has read them since M4.9. The two clauses a component test is the cheapest
# falsifier for, the second phone reading `off` and the series-unseen note, are asserted in the
# browser instead: the defect in both was a screen derived from the wrong source, and a stub that
# answers what the test told it to answer cannot say whether a real second phone reads off.
#
# CLOSED: all seventeen carry tests, no row carries a waiver, and `current_milestone` was never
# lowered. Fifteen of the seventeen reach more than one test file and three of those reach the
# browser as well, which is a property of the clauses rather than of the filing: "seen states flow
# both ways" is a sentence about a client, a sweep, a worker job and a screen agreeing, and a row
# that named only the cheapest of them would certify the half a household does not have. Where a
# crossing is not plain from the row's own `what`, the row argues it in a comment.

