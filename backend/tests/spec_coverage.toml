[[requirement]]
id = "tonight-a-split-slate-reads-in-slate-order"
spec = "§6.2 step 6 (\"one wildcard — a step outside your usual, honestly labelled\"); §6.4"
milestone = "M4.12"
kind = "backend"
what = "On a surfaced split the wildcard is drawn from the ranking the finalists were drawn from rather than from the group-score order the reservation overrode, and the persisted ranks order the three finalists ahead of the wildcard — in the rows `play.finish` stores, not only in the computed slate."
why = "The split branch rebuilt the finalists from the zeroed order but drew the wildcard and stamped every rank from the unzeroed one, so the second-highest-scoring title in the pool could be shown as the exploratory pick and sorted above two finalists on the ballot."
# THE `what` IS NARROWER THAN THE PLAN'S FINDING, DELIBERATELY. Finding 23 is written as "the
# candidate displaced by the reservation is never labelled 'a step outside your usual'", and
# drawing the wildcard from `adjusted_order` does not guarantee that: the displaced candidate is in
# `wildcard_from`'s candidate set under either ranking, and the choice is by DNA distance from the
# finalists' centre, not by rank. What the repair does guarantee is the property the defect was
# really about — one ranking decides the whole slate — so that is what the row claims and what the
# test measures. Asserting the stronger sentence would have needed a fixture engineered to make it
# true rather than one that distinguishes the two rankings.
#
# The first test's fixture is the only decidable shape: two tail candidates that are mirror images
# about the finalists' DNA centre tie bit-for-bit on distance, so the tie falls to whichever
# ranking `wildcard_from` was handed. Hand-seeded axes again, so the same limit applies as above —
# decision 173 keeps this branch off release data.
