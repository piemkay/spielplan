[[requirement]]
id = "tonight-the-selector-does-not-block-the-household"
spec = "§6 preamble (<1.5 s per battle, next card preloaded); §2 (4 vCPU reference box)"
milestone = "M4.12"
kind = "integration"
what = "An answer in flight does not delay an unrelated read: while one seat's POST /answer is being served, another cookie's GET /api/tonight/rooms returns promptly, and one answer performs one pool-snapshot read and one replay rather than two of each."
why = "The replay is pure CPU on the event loop and ran inside the answer transaction, so one participant's tap froze the other phone, the hub and the healthcheck for its whole duration and held the row lock for the search — and the route then paid for the whole round a second time to build the next card."
# Both halves are asserted through the routes, because both are claims about a request: the
# blocking one is only visible when a second cookie's read is in flight against the same process,
# and the double work is the HANDLER's, not the rule's -- `record_answer` and `state_for` are each
# correct on their own. The instrument is a patched replay rather than the real selector's duration
# (a fixture pool replays in microseconds and the shipped 696-title pool is the owner's under
# decision 183), and the two assertions are mechanisms rather than thresholds: a coroutine submitted
# to the loop from inside the search either runs or cannot run at all, and the decodes and replays
# are counted. `_the_combine_does_not_hold_the_loop_either` covers `finish`, which replays once per
# seat on the answer that ends the room; `_an_undo_during_the_search_leaves_the_seat_playing` covers
# the hazard the repair introduces, since moving the replay out of the transaction is what lets a
# second write for the seat commit before the ending its replay decided on;
# `_the_card_a_tap_hands_back_is_the_one_the_round_would_have_served` is the equivalence guard on
# having stopped re-reading -- it passes against the old code by construction, which is why the four
# above it are the ones that fail there. [M4.12 findings 2, 3]
#
# Threading MOVES a cost; the last test removes one. `finish` reads `played.beliefs` and nothing
# else, yet replayed with `select` at its default, so every seat that ended at 54c's escape paid
# for a full pair search whose result is discarded -- 95-101 ms per such seat at 696 candidates, on
# the answer that finishes the room. It runs the same combine twice, with the flag forced back on
# the second time, because an assertion that no search ran is worth nothing on a fixture that had
# no boundary left to search. [M4.12 cycle 1, M412-PLAY-2]
tests = [
  "backend/tests/test_tonight_integration.py::test_the_selector_does_not_block_the_household",
  "backend/tests/test_tonight_integration.py::test_one_tap_reads_the_frozen_pool_once_and_runs_the_round_once",
  "backend/tests/test_tonight_integration.py::test_the_combine_does_not_hold_the_loop_either",
  "backend/tests/test_tonight_integration.py::test_the_combine_does_not_search_for_a_pair_it_will_never_show",
  "backend/tests/test_tonight_integration.py::test_an_undo_during_the_search_leaves_the_seat_playing",
  "backend/tests/test_tonight_integration.py::test_the_card_a_tap_hands_back_is_the_one_the_round_would_have_served",
]

[[requirement]]
id = "tonight-the-channel-is-behind-the-dependency-graph"
spec = "§3.1 (first-login lock); §3.2 (every route behind a session); §6.2 step 2 (the live lobby); decision 225"
milestone = "M4.12"
kind = "integration"
what = "The session WebSocket's gate is declared rather than written out: its dependant tree resolves `deps.active_user_ws`, so a sweep over the graph can see that §3.1 applies here, and resolves no `deps.db`, so a phone watching the lobby all evening holds none of the pool's ten connections. On the wire the refusals are what they already were and stay asserted as the regression guard they now are: an anonymous socket and a socket whose account is locked to a password change are both closed with 1008, and an ordinary member is served. The gate's own acquire is bounded, so a handshake against an exhausted pool is closed with 1011 and a log line naming size and idle rather than left pending with nothing sent."
why = "The route opened the cookie itself and closed the locked caller by hand (decision 179), so §3.1's lock was real but undeclared: `test_api_gating.py`'s sweep - what is behind `active_user`, subtracted from what is behind `current_user` - could see neither side of it, and the route inventory classified the socket as anonymous. And it awaited its first two sends inside an acquired connection, so ten stalled sockets pinned the whole ten-connection pool and the entire backend stopped answering."
# Five tests; four of them split two clauses deliberately: the two live ones assert what a caller
# receives, and the two static ones assert that the gate is where a sweep can find it. That second
# half is the requirement's real content — decision 179 already wrote the `must_change_password`
# check out by hand inside the route, so the locked socket was refused for a milestone while being
# invisible to `test_api_gating.py`'s subtraction and classified as anonymous by the route
# inventory. Hence the gating test keeps the refusals (it gained the anonymous half, since a
# dependency that asked only about the lock would serve a caller with no cookie) and the dependant
# walk carries the declaration, including the negative half decision 225 turns on: the route must
# NOT resolve `deps.db`, because a yield dependency on a socket is held for the whole evening.
# The pool is measured as the pool and as what a household notices, one test, two readings.
#
# The fifth holds this row's own prose, and it is here because the row got that history wrong on
# the way in: the `why` said the lock had never been enforced, ten lines above the comment that
# says decision 179 enforced it. Read alone the row then credited M4.12 with a refusal M4.6
# shipped, and invited a later reader to drop the dependant walk as duplicated by the gating test
# - taking decision 225's only assertion with it while the row stayed green. The map settles the
# question against itself: M0's `platform-forced-first-login-change` has named the same gating
# test as ITS evidence since before this socket had a second gate to argue about.
# [M4.12 review cycle 1: M412-API-03]
#
# The sixth is what the self-acquire cost: `deps.db` bounds its acquire at `_ACQUIRE_TIMEOUT_S` and
# spends a docstring on why, and the socket gate decision 225 added was the one acquire in that file
# that did not. It resolves before `websocket.accept()`, so a saturated pool left the handshake
# pending with no frame, no close, no log line and no bound while every HTTP surface answered 503 in
# ten seconds -- and the client schedules its reconnect from `onclose` alone, so the backoff can
# never fire for a handshake that never resolves. [M4.12 cycle 2, M412-API2-01]
tests = [
    "backend/tests/test_tonight_channel.py::test_the_channel_is_behind_the_dependency_graph_and_never_behind_deps_db",
    "backend/tests/test_tonight_channel.py::test_a_handshake_on_an_exhausted_pool_is_closed_rather_than_left_hanging",
    "backend/tests/test_tonight_channel.py::test_phones_watching_the_lobby_hold_none_of_the_pools_connections",
    "backend/tests/test_api_gating.py::test_the_tonight_channel_refuses_a_locked_account",
    "backend/tests/test_api_gating.py::test_the_forced_change_gate_covers_every_authenticated_route_but_four",
    "backend/tests/test_static_contracts.py::test_no_row_calls_decision_179s_socket_refusal_m4_12s_own_defect",
]

[[requirement]]
id = "tonight-solo-does-not-run-a-round-nobody-asked-for"
spec = "§6.2 step 8 (rewritten, 54f: \"the fastest path to a film must not be slower than browsing Home\")"
milestone = "M4.12"
kind = "integration"
what = "The solo door and the reshuffle control return three picks and a wildcard with no next pair and without running the pair selection; only an explicit sharpen returns a pair. Reshuffle walks the ranking on a four-title pool — two consecutive presses do not return the same three titles — and every title in a seven-title pool is reachable as a pick. On the surface the same control is a browse gesture wherever it is pressed: from inside the sharpen round it lands back on the picks with the sharpen control still offered rather than reporting a round that is out of questions, its walk never asks the route for an offset the route refuses, and a refused press does not move it; and the line decision 222 renders when the walk comes back round is shown to a household in a browser."
why = "picks() replayed and selected unconditionally, so a screen that never draws the pair paid for the whole search on every tap and every reshuffle. And the walk's modulus was the pool size minus one, so a four-title pool returned the identical picks for ever while reporting that it had wrapped."
# TWO CLAIMS, MEASURED TWO WAYS, because they fail differently. The cost is a CALL COUNT and not
# a clock: the fixture pool is six films and is fast under either implementation, so a timing
# threshold here would measure the machine rather than the rule -- the plan's own numbers (0.677 s
# at 200 candidates) come from a pool no integration fixture is going to build. The walk is
# arithmetic over the whole range `SoloBody.offset` admits, on the two pool sizes that expose the
# modulus: four, where every offset returned the same three titles, and seven, where the
# last-ranked title was unreachable by any number of presses.
#
# The fourth test is the precision the flag invites someone to get wrong: `sharpen` skips the
# SELECTION and never the replay, because 54f's "re-ranks in place" is the whole of the sharpen
# control and the re-ranking is the posterior. The route test is here rather than only the rule
# tests because `sharpen` is a field on the wire and `solo.picks` cannot see whether it arrived.
tests = [
    "backend/tests/test_tonight_integration.py::test_the_solo_door_lands_on_picks_without_running_the_pair_search",
    "backend/tests/test_tonight_integration.py::test_reshuffle_does_not_run_the_pair_search_either",
    "backend/tests/test_tonight_integration.py::test_only_an_explicit_sharpen_draws_a_pair",
    "backend/tests/test_tonight_integration.py::test_the_replay_still_runs_when_the_door_does_not_select",
    "backend/tests/test_tonight_integration.py::test_reshuffle_moves_the_picks_on_a_four_title_pool",
    "backend/tests/test_tonight_integration.py::test_every_title_in_a_seven_title_pool_is_reachable_as_a_pick",
    "backend/tests/test_tonight_routes.py::test_the_solo_door_draws_no_pair_and_an_explicit_sharpen_does",
    "backend/tests/test_static_contracts.py::test_the_reshuffle_wrapped_line_is_rendered_where_decision_222_says_it_is",
    "e2e/specs/14-tonight.spec.js::sharpen runs the round in place and says so in the provenance line",
    "e2e/specs/14-tonight.spec.js::reshuffle walks the ranking and asks nothing",
    "frontend/src/routes/tonight/tonight-page.test.js::comes back to the picks rather than reporting a round that is out of questions",
    "frontend/src/lib/tonight.svelte.test.js::does not advance the walk when the reshuffle it asked for was refused",
    "frontend/src/lib/tonight.svelte.test.js::never asks for a walk further down the ranking than the route will serve",
]
# M4.12 cycle 1, M412-FE-2 and M412-SOLO-02. `wrapped` reported the modulus alone, and the walk
# comes back round to the top of the ranking two ways -- the modulus, and the wrap-fill that
# splices the top back in whenever `start + PICKS` passes the end, which on any pool whose length
# is not a multiple of three fires one press EARLIER. So the press that first shows two titles the
# household was looking at a second ago said nothing, which is the confusion decision 222 exists to
# remove; `any(out["wrapped"] for out in presses[1:])` was satisfied by the press after it and
# could not see it. The four-title test now asserts the flag per press. And the rendered half had
# no assertion at any layer -- three greps in the whole tree, all of them the copy itself -- so the
# static guard is what says the line is still wired to the flag at all. The browser holds the rest:
# the walk is three titles wide and the e2e bundle owns six films, so the reshuffle spec presses
# until the line appears -- the second press there -- rather than a counted number of times, which
# would assert the size of the fixture pool rather than the rule. [M412-SOLO-03]
#
# Two more of the same control, on the surface rather than in the flag. Reshuffle posts
# `sharpen: false`, so the server draws no pair; pressed from inside the round the screen read that
# as convergence -- printing "nothing left to ask" over a round with pairs still in it and hiding
# the only control that could ask for one, leaving Back, which discards the evening's sharpen
# answers. And the walk's counter was raised before the POST and never lowered, so a refused press
# moved it by a step nobody saw and press 65 ran past `SoloBody.offset`'s own `le=64`: a 422, and so
# was every press after it. [M4.12 review cycle 1: M412-SOLO-01, M412-SOLO-06]

