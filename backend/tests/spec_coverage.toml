[[requirement]]
id = "jellyfin-acquisition-eval-finish-prompt-banner-path"
spec = "§7.3 (with §12 M1, decision 212 — which supersedes proposal 150)"
milestone = "M1"
kind = "e2e"
what = "With push undeliverable, an armed finish prompt queues and appears as an in-app card on the user's next app open, naming exactly one title (\"Did you finish X?\"); its first tap writes `seen` for that user, and the card does not reappear on subsequent opens. After that tap the card offers the route into §6.1's queue with that title at its head and the Home shelves it just changed are re-read; a decline writes `unseen` as an explicit action rather than nothing."
why = "§7.3 names the banner path as the whole M1 behaviour (push waits for M4), and proposal 150 separates this one-title, `seen`-writing prompt from Home's pending-verdicts banner; only a browser can prove the queued prompt surfaces on next open."
# The last two clauses are M4.11's. Decision 212 delivers proposal 150's own promise rather than
# adopting the proposal: §7.3 says the tap "offers the verdict flow" and `FinishPrompt.svelte`
# offered nothing, and the card was mounted with no props at all -- so the banner the answer just
# emptied kept the title until the next full load, while the identical write from the title card
# calls `loadShelves()` and says why. Inline verdict chips were refused: a second observation
# writer on Home would have no rate session, no card token and no §6.1 block counter. Decision 211
# makes the other tap a fact -- a "no" wrote nothing, `user_title` stayed empty, and the next sweep
# adopted Jellyfin's Played flag over the person's answer within fifteen minutes -- which is why
# `test_declining_the_prompt_writes_nothing_and_closes_it` is renamed to
# `test_declining_the_prompt_writes_unseen_and_closes_it` and replaced in `tests` by the stage that
# renames it. [M4.11, decisions 211 and 212]
tests = ["e2e/specs/08-jellyfin.spec.js::finishing a title arms a prompt that surfaces on the next app open", "e2e/specs/08-jellyfin.spec.js::the first tap writes seen, and the card does not come back", "backend/tests/test_state_routes.py::test_an_armed_prompt_surfaces_and_its_first_tap_writes_seen", "backend/tests/test_state_routes.py::test_declining_the_prompt_writes_unseen_and_closes_it", "backend/tests/test_state_routes.py::test_answering_a_prompt_twice_is_a_404", "backend/tests/test_playback_prompt.py::test_the_queue_surfaces_the_prompt_and_marks_it_shown", "backend/tests/test_playback_prompt.py::test_an_answered_prompt_does_not_come_back", "e2e/specs/08-jellyfin.spec.js::a declined viewing stays declined, and only a new viewing asks again"]
# The renamed entry and the new e2e case are M4.11's, and no e2e title was added for decision
# 212: the queue link and the banner re-read are asserted inside `the first tap writes seen, and
# the card does not come back`, whose body was extended rather than replaced, because the clause
# is what happens AFTER that tap and a second spec would have had to arm a second prompt to see
# it. The decline case is the other tap, which decision 211 turned from an absence into a fact;
# it reads the state route's timestamp rather than the state alone, since §4.2's absent-row
# default is also `unseen` and would have passed without a row. [M4.11, decisions 211 and 212]

[[requirement]]
id = "library-rate-undo-block-depth"
spec = "decision 35 + §6.1 (blocks of 15)"
milestone = "M2"
kind = "integration"
what = "Undo reaches back only to the start of the current block of 15: repeated Undo stops at the block's first observation and the response reports undo as unavailable rather than silently no-opping, and the previous block stays reachable until the first observation of the new block lands — so the fifteenth tap is undoable and the sixteenth commits the block it ended."
why = "Decision 35: the depth matches the counter the user is already reading (\"7 / 15 this block\"), the boundary is refused explicitly rather than silently, and starting a new block commits the previous one."
# The commit point moved in M4.10 under decision 199, which is decision 174's ruling applied: a block
# is committed when the FIRST observation of the next block lands, "which is literally what decision
# 35 says". `advance` rolls the block on the fifteenth observation, so the chip disabled on the same
# round trip that answered card 15 — 6.7% of every observation a household makes, on the last tap of
# a run where fatigue mis-taps live, and in explicit Battle mode a duel, which has no supersede path.
# `advance` and the journal's stored block and slot are unchanged; only undo's reach moved.
# [M4.10 finding 25, rrh-fifteenth-tap-is-permanent]
#
# The static pair is cycle 2's, and it is about the artefacts rather than the rule. Decision 199's
# Cost paragraph listed three statements of the commit point that change with it; the diff amended
# those three and left a fourth, `test_the_counter_runs_to_fifteen_and_rolls_into_a_new_block`'s
# docstring, still calling the roll "decision 35's commit" — in the same file as the test that holds
# the rule the code has, 870 lines above it, so the next reader of the block machine found two
# in-repo answers and no way to tell which was current. A sentence is not amended by the diff that
# contradicts it, so the agreement of the four statements is a rule now, with a self-test because
# the true wordings and the false ones are built from the same words.
# [M4.10 cycle 2, M410-C2-D19-04]
