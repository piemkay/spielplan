[[requirement]]
id = "tonight-the-host-can-end-a-started-room"
spec = "§6.2 step 2 (open-rooms list visible to every household device); §14 risk 6"
milestone = "M4.12"
kind = "integration"
what = "The host — and only the host — can end a started room; the room leaves every member's open-rooms list, its state is 'abandoned' with ended_at set, and every session_answer row survives. A member's seat in that room no longer answers a round."
why = "The abandon clause took rooms in state 'open' only and no route, sweep or timeout could end a started one, so every other lifecycle defect became permanent and recovery meant SQL against the session table. §14 risk 6 wants the votes kept, so it is not a delete."
# Through the routes with two real cookie jars, because every clause of the `what` is about what a
# household RECEIVES rather than about what a rule returns: the host check is the route's (the same
# one `start` makes of the same column), the list is §6.2 step 2's every-household-device list read
# with each cookie in turn, and "no longer answers a round" was a 200 carrying a pair and a fresh
# card token on a room the host had just closed -- which is why that test takes its card BEFORE the
# end and then posts it.
#
# The fourth test covers finding 8 as well as this row's last sentence, and they are the same
# statement at two layers: `play._participant` selected the session's state and never its
# `ended_at`, so one refusal in the read that `state_for`, `record_answer`, `retract` and `escape`
# all share covers the round, the answer and the undo at once.
#
# The fifth is the guard the control needs rather than a clause of the requirement, and it is in
# this row because it is what keeps the row's own promise honest: `end_session` takes the live
# session row `FOR UPDATE` before `set_state`, so a second tap on End -- or an End from a lobby
# whose room has since reached its reveal -- is refused instead of rewriting `state` over
# `resolved` and leaving §14 risk 6's outcome row hanging off an evening recorded as abandoned.
# No migration: 0013's `session_ended_states` CHECK already ties `ended_at` to `abandoned`.
# [decision 169; findings 7 and 8]
#
# The sixth is the other ordering, which that row lock does not reach: `play.finish` moved the room
# on with a bare `set_state(..., 'ballot')`, and `set_state` writes `ended_at = NULL` for every
# state that is not an ended one -- the only write in the backend that can take a session from an
# ended state back to a live one. It contends with `end_session` on nothing (an advisory lock
# against a row lock), and the window is the whole combine, so an End committing inside it was
# silently undone and this row's own `what` -- "'abandoned' with ended_at set" -- became false on
# the one control a stuck room has. [M4.12 cycle 1, M412-PLAY-1]
tests = [
    "backend/tests/test_tonight_integration.py::test_the_host_can_end_a_started_room_and_a_member_cannot",
    "backend/tests/test_tonight_integration.py::test_the_room_the_host_ended_leaves_every_households_open_rooms_list",
    "backend/tests/test_tonight_integration.py::test_the_votes_survive_the_room_the_host_ended",
    "backend/tests/test_tonight_integration.py::test_a_seat_in_an_ended_room_is_refused_rather_than_served_a_round",
    "backend/tests/test_tonight_integration.py::test_ending_a_room_the_household_already_resolved_is_refused",
    "backend/tests/test_tonight_integration.py::test_a_combine_landing_after_the_host_ended_the_room_does_not_revive_it",
]

[[requirement]]
id = "tonight-answer-and-undo-serialise-on-the-seat"
spec = "§6.2 (54c/54e: a mis-tap is otherwise permanent); §6 preamble (\"undo everywhere\"); §13 (single-use seal)"
milestone = "M4.12"
kind = "integration"
what = "Two answers gathered on one card token yield exactly one 200 and one 409 stale_pair, one session_answer row and answered_count 1 — never a bare constraint violation. An undo gathered with an answer leaves max(seq) and the live rows consistent, and the seat keeps playing afterwards."
why = "The seq guard was read outside the transaction that inserts, so both racers passed and the loser hit 0014's partial unique index — which app.py's _conflict answers 409 'conflict: session_answer_seq', a status the client re-reads on but carrying the name of a database object where the round's contract defines a reason, over a card that no longer exists and a seq that has been reused. retract recomputed answered_count from the rows surviving its own tombstone, so an interleaved answer left the counter behind the highest live seq and every later tap collided with it for ever, on a round no re-read can advance."
# Two real connections, the snapshot read slowed, and the proof of the race is the MECHANISM: one
# of the two writers' `FOR UPDATE OF p` reads is held for the whole of the other's transaction,
# which an assertion on the outcome alone could not tell from the two calls having run in
# sequence. Running in sequence is how all three of these defects stayed green for a milestone.
#
# The last two rows are the repair's own parts rather than the defect's. The seq minting is what
# stops `answered_count` and the row's identity being one number, so the undo's replacement answer
# takes a fresh seq above the tombstone §14 risk 6 keeps; and `_set_answered`'s guard is the
# statement-level refusal that keeps the counter from claiming answers that have no rows — the
# disagreement the wedge was made of — rather than trusting two callers to, which is `_end`'s
# argument applied to the other column.
tests = [
    "backend/tests/test_tonight_integration.py::test_two_answers_on_one_card_are_one_200_and_one_409",
    "backend/tests/test_tonight_integration.py::test_an_undo_gathered_with_an_answer_leaves_the_seat_playing",
    "backend/tests/test_tonight_integration.py::test_a_replacement_answer_takes_a_fresh_seq_rather_than_the_tombstones",
    "backend/tests/test_tonight_integration.py::test_the_counter_cannot_be_moved_past_the_rows_it_counts",
    "backend/tests/test_static_contracts.py::test_the_uniqueness_seam_the_tonight_comments_point_at_answers_409",
    "backend/tests/test_static_contracts.py::test_no_tonight_paragraph_answers_a_lost_uniqueness_race_with_a_500",
    "backend/tests/test_static_contracts.py::test_the_lost_race_guard_catches_each_way_it_was_said",
    "backend/tests/test_static_contracts.py::test_no_backend_comment_cites_the_tonight_client_by_line_number",
    "backend/tests/test_static_contracts.py::test_every_tonight_client_function_the_backend_cites_exists",
]
# M4.12 cycle 1. The repairs above are unchanged; what the last five hold is the RECORD of them,
# which this codebase makes load-bearing. M412-CONC-02: nine comments and this row's own `why`
# said the loser of these races got a 500, and M4.7's `_conflict` has answered 409 with the
# constraint's name since it shipped -- with a test whose docstring says it exists so M4.10 and
# M4.12 can point at it. The guard reads the seam off `app.py` first, so it cannot outlive its own
# premise, and its self-test carries the three wordings that shipped plus the two sentences that
# must stay sayable. M412-CONC-03: the same paragraphs cited the client by line number, taken from
# the plan and stale by two commits before the diff that rewrote that module from 490 lines to 774
# -- all four pointed at a brace or a comment fragment. A function name is checkable, so the
