[[requirement]]
id = "platform-pin-profile-switch"
spec = "§3.2 shared devices"
milestone = "M1"
kind = "integration"
what = "Switching the active member from the account chip requires that member's 4-digit PIN: the switch is refused and the session identity is unchanged on a wrong PIN, commits on a correct one, and a member with no PIN set must supply their password instead. The lockout escalation is bounded and never raises — `pin_failed_count` at 41, 42 and 200 each answer the refusal with `pin_locked_until` at about now()+1h — and the session a PIN switch produces cannot itself set a PIN."
why = "§3.2 makes the PIN gate normative for shared/TV devices; an ungated switch hands one member's Ledger and admin reach to whoever holds the device. (Corrected from e2e: the gate is a server-side identity decision, and the menu/landing-surface details rest only on unsettled proposal 3.)"
