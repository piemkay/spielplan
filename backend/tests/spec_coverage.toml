[[requirement]]
id = "data-rules-a-feature-block-that-never-hits-is-not-present"
spec = "§4.3 feature_contract.json + §5.3 (thin-title badge)"
milestone = "M4.5"
kind = "backend"
what = "A content block whose database keys match none of the columns the contract declares is reported as degraded rather than present: the miss count is persisted with the placement, is_thin sees it, and the title is badged and parked like any other thin title. A block that is present and populated, one that is legitimately absent, and one whose keys all miss are three distinguishable states."
why = "§5.3 makes thinness a badged, parked condition. The credit block missed on every key in every placement ever computed and was still marked present, because features.py counted the misses into `unmapped` and reconcile.py's upsert never persisted them — so a block contributing nothing was indistinguishable from one contributing everything."
tests = []

[[requirement]]
id = "data-rules-credit-block-keyed-as-the-contract-names-it"
spec = "§4.3 feature_contract.json + §8 stage 9"
milestone = "M4.5"
kind = "backend"
what = "The credit block is keyed by the column names the shipped contract declares — `p:<role>:<name>` — and a title's director, composer and cast land in those columns. Against the shipped contract's 244 credit columns, a title whose crew the contract names produces a non-zero credit block."
why = "§4.3 calls feature_contract.json 'the exhaustive definition of the tower's input' and §8 stage 9 builds vectors 'from this file and nothing else'. The builder emitted person_id::text, so all 244 columns were zero in every coordinate the app has ever computed."
tests = []

[[requirement]]
id = "data-rules-corrections-ledger-parsed-at-its-real-header"
spec = "§4.3 corrections_v1.tsv + §8 stage 3"
milestone = "M4.5"
kind = "backend"
what = "corrections_v1.tsv is parsed at the header the corpus actually ships (kind, title_id, value, evidence, note), and a file whose header the parser does not recognise fails the import report naming the missing column — never raises, and never silently loads zero corrections."
why = "§8 stage 3 re-applies this ledger at every derive and §14.5 is the scar for what happens when it is not applied. dna.py read r['field'], a column the shipped file does not have, so the real ledger raised KeyError instead of producing a validation failure."
tests = []

[[requirement]]
id = "data-rules-seed-registry-and-onboarding-list-are-distinct"
spec = "§4.3 seed_list.json + §10 manifest"
milestone = "M4.5"
kind = "integration"
what = "The corpus's seed_list — a list registry (id, slug, name, source, kind, category, weight, item_count, fetched_at, notes) — and Spielplan's 100-title decade-stratified onboarding list are distinct tables with distinct names; importing a bundle carrying the registry writes no row into the onboarding list, and the onboarding list is populated only from seed_list.json."
why = "§4.3's seed_list.json is the onboarding list; §10's manifest also ships 'seed_list tables' meaning the registry. Two different artifacts share one name, and load.py mapped the registry onto the onboarding table — which COPYs 238 all-NULL rows into a NOT NULL primary key."
tests = []

[[requirement]]
id = "platform-app-minted-ids-are-partitioned-from-the-corpus"
spec = "§4.1 (canonical key) + §8 stage 1 + §10"
milestone = "M4.5"
kind = "integration"
what = "Spielplan mints title and person ids from a range disjoint from the corpus's, and the importer refuses any bundle whose title or person ids — or whose backbone.npz, review_text_emb.npz, seed_list.json or corrections_v1.tsv title ids — fall inside Spielplan's minted range, naming the offending id. The sequence is positioned by the seed import rather than by the migration, so a fresh install that has not seeded cannot mint an id the corpus already used."
why = "The corpus's own sqlite_sequence reads title=21442, so its next minted id is 21443 — exactly where 'mint above the imported maximum' would start Spielplan. Two minters in one namespace, and the model bundle still carries content ids, so a single newly crawled film would make a later bundle assert things about a title the household acquired. Nothing would trip: the only check is that ids ascend."
tests = []

[[requirement]]
id = "platform-model-bundle-identity-is-checked-not-trusted"
spec = "§10 + §4.3 backbone.npz"
milestone = "M4.5"
kind = "integration"
what = "The model bundle carries an identity column (imdb_id, or tmdb_id plus kind) row-aligned to backbone.npz's title_id; the importer checks it against the title rows those ids name and fails the bundle when an id's identity disagrees, naming the title. An identity vector that is absent is itself a validation failure rather than a skipped check."
why = "Range partitioning stops two minters colliding; it cannot detect the corpus *merging* two titles, which changes what an existing id means without changing the id. backbone.py:31 already records that a wrong index 'produces plausible numbers for the wrong films', and the ascending-ids check cannot see it."
tests = []

[[requirement]]
id = "platform-content-seeds-once-models-reimport"
spec = "§10 (swap sequence) + §12"
milestone = "M4.5"
kind = "integration"
what = "A models-only bundle imports and hot-swaps without content present, running §10's rebuild set; a content seed is accepted exactly once and a second content import is refused with that reason rather than upserting; and the two are distinguishable in artifact_bundle so the admin board can say which kind of import produced a version."
why = "The owner's direction: the corpus supplies trained models, movie data is seeded once, every later title is acquired by Spielplan. The importer requires content.sqlite (bundle.py:190) and would reject a models-only bundle outright, while §10's rebuild set — the reason bundle_version is stamped on placements, priors and scores — is exactly what a model update still needs."
tests = []

[[requirement]]
id = "platform-movie-data-backup-and-restore"
spec = "§2 Backups + §10 (owner decision 2026-09-01)"
milestone = "M4.5"
kind = "integration"
what = "An admin-triggered movie-data backup writes a restorable archive of the content spine, the DNA layer and the review store, and of nothing user-specific: no verdict, duel, tier_edit, ledger, session, passkey, push subscription or connector secret appears in it. Restoring it into an empty install reproduces the same title, person and DNA rows; carries the title and person sequence positions forward, so the first acquisition after a restore mints an id that collides with nothing; and preserves title.origin, so §10's rebuild set still names the app-acquired titles."
why = "Owner decision 2026-09-01: the corpus supplies trained models and the movie data is Spielplan's to keep. Two failure modes make this testable rather than obvious. The id sequence is positioned by the seed import, an event that by definition never runs again, so a restore that does not carry setval mints id 1 and the app cannot acquire a single title. And title.origin defaults to 'bundle' (0008_placement.sql:47), so a restore that drops the column silently re-labels every acquired title and reconcile.py stops re-placing them."
tests = []

[[requirement]]
id = "platform-backup-restore-ordering-is-explicit"
spec = "§10 swap sequence + §2 Backups"
milestone = "M4.5"
kind = "integration"
what = "Restoring movie data and loading a model bundle have one correct order, and the wrong one is refused with its reason rather than half-applied: a model bundle loaded into an install with no content is refused before it writes anything, and the refusal names content as the missing prerequisite. After a correct restore-then-load, every owned title has a coordinate — §12's M2 exit criterion reads the same number it read before the backup."
why = "§12's M2 criterion is a count of owned titles with no coordinate, which reads zero both when everything is placed and when there is nothing to place. A restore that silently produced an empty catalog would satisfy it for the wrong reason, so the ordering has to fail loudly instead of arriving at a number that looks right."
tests = []

[[requirement]]
id = "data-rules-importer-maps-the-shipped-content-schema"
spec = "§10 (the bundle) + §4.1"
milestone = "M4.5"
kind = "integration"
what = "Every column the importer's table mapping names exists in the schema the corpus ships, and the mapping reads the shipped names (title.primary_title, title.original_title, credit.billing_order, title_alias.source, dna_projected.n_sources, platform_rating.metric/value, rating_source.scale_lo/scale_hi) rather than names the corpus does not export. A mapping that names a column the bundle lacks fails the import with that table and column named, instead of loading a column of NULLs."
why = "The mapping was written as identity pairs against an imagined schema — 'name': 'name' where the corpus ships primary_title — so essentially every table would load empty or fail. A missing source column currently produces NULLs rather than a report line, which is the same silence that hid three unloaded tables."
tests = []

[[requirement]]
id = "library-rate-title-card-text-and-art-resolve-from-title-meta"
spec = "§4.1 (title_meta) + §6.0 (title detail card)"
milestone = "M4.5"
kind = "integration"
what = "The title card's overview, tagline, poster, backdrop and trailer key resolve from title_meta and title_video by a stated per-source precedence, not from columns on `title`: a title with meta rows from two sources renders one coherent card, dropping the preferred source falls back to the next whole block rather than mixing fields across sources, and a title with no meta row at all renders the card without them rather than erroring."
