[[requirement]]
id = "platform-vocabulary-change-is-refused-not-degraded"
spec = "§14 risk 7 + §10 (decision 163)"
milestone = "M4.5"
kind = "integration"
what = "A bundle whose vocabulary version differs from the active one is refused at validation with a reason naming the missing migration, and nothing is staged, flipped or written; the active vocabulary, both DNA tiers and every title's DNA card are exactly as they were before the attempt. A bundle carrying the same vocabulary version imports normally, so the refusal is specific to the change rather than to the check."
why = "Decision 163 defers vocabulary migration as a data problem in its own right. Under decision 162 a re-import carries models and not content, so a bundle shipping a new vocabulary would leave dna_tag and dna_projected at the old version while the feature builder filters on the active one -- both DNA blocks empty for every title, and empty is not an error anywhere in the read path. A refusal an operator can read is what keeps the deferral honest; a swap that silently empties the naming layer would surface as 'why is every DNA card blank' months later."
tests = [
    "backend/tests/test_bundle_lifecycle.py::test_a_vocabulary_change_is_refused_and_nothing_moves",
    "backend/tests/test_bundle_lifecycle.py::test_the_refusal_is_specific_to_the_change_not_to_the_check",
]

# --- M4.6: users, roles and the account surface ------------------------------------------
#
# §12 gained the M4.6 row this week, with the amendments decisions 164 and 166 forced: §6.6
# is the only place accounts are made, and there are two roles. Every row below is written
# before its code, which is what `current_milestone = "M4.6"` turns into a red list.
# See docs/milestones/M4.6-plan.md.

[[requirement]]
id = "platform-account-lifecycle-routes"
spec = "§6.6 Users (decision 166); §3.1 one-time password"
milestone = "M4.6"
kind = "integration"
what = "Every §6.6 account duty exists as an admin route and writes what it claims: create issues a one-time password and locks the account to a first-login change; reset-password issues a fresh one, re-arms the lock and deletes that user's sessions while the old password stops answering; reset-pin clears the PIN and its lockout counters; rename and re-role persist; the passkey list hands the admin the credential ids the revoke takes, scoped to the account it names and carrying no public key; disable deletes that user's sessions and makes both the session cookie and a passkey assertion answer 401; delete removes the row; and no route accepts an admin-chosen password."
why = "Decision 166 gives the admin full user management, and §3.1 says an admin never sees, sets or types a member's password. Today `is_active` is read in six places and written in none, and the only cure for a forgotten password is `psql` with a hand-made argon2 hash."
tests = ["backend/tests/test_admin_users.py::test_creating_an_account_issues_a_one_time_password_and_locks_it", "backend/tests/test_admin_users.py::test_the_one_time_password_is_shown_once_and_read_back_nowhere", "backend/tests/test_admin_users.py::test_the_create_route_accepts_no_admin_chosen_password", "backend/tests/test_admin_users.py::test_a_rename_and_a_re_role_persist_to_the_roster", "backend/tests/test_admin_users.py::test_a_password_reset_reissues_re_arms_the_lock_and_ends_the_sessions", "backend/tests/test_admin_users.py::test_a_password_reset_clears_a_standing_lockout", "backend/tests/test_admin_users.py::test_a_pin_reset_clears_the_pin_and_the_lockout_that_locked_it", "backend/tests/test_admin_users.py::test_an_admin_reads_the_credential_ids_the_revoke_route_needs", "backend/tests/test_admin_users.py::test_the_credential_list_is_scoped_to_the_account_it_names", "backend/tests/test_admin_users.py::test_an_admin_revokes_one_passkey_on_another_account", "backend/tests/test_admin_users.py::test_revoking_a_passkey_that_belongs_to_another_account_is_a_404", "backend/tests/test_admin_users.py::test_disabling_an_account_ends_its_sessions_and_refuses_the_cookie_and_a_login", "backend/tests/test_admin_users.py::test_a_disabled_account_cannot_answer_a_passkey_assertion", "backend/tests/test_admin_users.py::test_deleting_an_account_removes_the_row", "backend/tests/test_admin_users.py::test_every_row_editor_route_answers_404_for_an_account_that_is_not_there"]

[[requirement]]
id = "platform-last-active-admin-floor"
spec = "§3.1 (decision 166); §6.6 Users; §14.4"
milestone = "M4.6"
kind = "integration"
what = "The last active `admin` can be neither demoted nor disabled nor deleted: each attempt is refused with a message naming the floor and leaves the row unchanged; with two active admins each of the three succeeds on either; an admin cannot disable or reset their own account from the Users tab; and two admins acting at the same moment — one demoting the household's other admin while that admin disables them — cannot both succeed, so the install never reaches zero active admins."
why = "Decision 166 makes the floor normative, and it is a security requirement rather than polish: `POST /api/setup/admin` takes no auth dependency and is gated only on there being no admin, so an install that reaches zero admins lets an anonymous caller mint one."
tests = ["backend/tests/test_admin_users.py::test_the_last_active_admin_cannot_be_demoted", "backend/tests/test_admin_users.py::test_the_last_active_admin_cannot_be_disabled", "backend/tests/test_admin_users.py::test_the_last_active_admin_cannot_be_deleted", "backend/tests/test_admin_users.py::test_a_disabled_admin_does_not_hold_the_floor", "backend/tests/test_admin_users.py::test_with_two_active_admins_each_of_the_three_succeeds", "backend/tests/test_admin_users.py::test_an_admin_cannot_reset_or_disable_their_own_account_from_this_tab", "backend/tests/test_admin_users.py::test_two_admins_removing_each_other_at_once_cannot_empty_the_floor"]

[[requirement]]
id = "platform-two-roles-and-no-others"
spec = "§3.1 (decision 166); §4.2 app_user"
milestone = "M4.6"
kind = "integration"
what = "`role='guest'` is refused with 422 at every account-creating route, the `app_user` CHECK admits only `admin` and `member`, and account creation exists at exactly one path — a walk of the app's routes finds no other route that inserts into `app_user`, and firing every mounted route at a running app with §6.6's creation body leaves exactly one path that made a row."
why = "Decision 166 deletes the guest account; a guest is a Tonight seat with `user_id NULL` (§4.2). Today `MemberInit` admits `guest` and issues it a one-time password, and the resulting account reads the household roster and can PIN-switch."
