[[requirement]]
id = "platform-secrets-unreadable-degrades-never-500s"
spec = "§2 Configuration; §3.1; §3.3"
milestone = "M4.7"
kind = "integration"
what = "An unreadable DEK — a restored dump under a changed or absent SECRETS_KEY — raises one typed error, and every member-facing write still commits: seen-state, verdict, not-seen and finish-prompt return 200 with synced false and a reason naming SECRETS_KEY, the admin connector GET reports secrets_unreadable, and both routes that write a typed-in credential — the Connectors PUT and the setup wizard's connector POST — succeed by sealing under a fresh DEK, whether or not that connector already held a ciphertext. No route 500s and the container still boots when a DEK row exists without a VAPID row, or when an env seed variable names a connector the database has no row for: the seed is skipped with one ERROR naming SECRETS_KEY, never raised. A save that keeps the origin leaves the unreadable ciphertext where it is, and one that changes the origin drops it — §14.3 binds those credentials to the server that issued them, so the correct .env returning must never hand the old server's key to the newly typed host — and a Jellyfin user re-mapping answers 409 while the per-user tokens cannot be enumerated, because the drop that keeps a token with the identity that issued it cannot see the token it would have to remove."
why = "§3.3 makes the app-side write independent of Jellyfin, and §3.1 makes a half-configured boot legal; today InvalidTag from core/secrets._unwrap is caught nowhere and closes the only route that could repair custody."
