[[requirement]]
id = "platform-landmine-guards-catch-the-shapes-a-regression-would-take"
spec = "§4.1 rules 1 and 2"
milestone = "M4.8"
kind = "static"
what = "The rule 1 guard reports any statement naming both dna_tag and dna_projected outside the sanctioned dna_tagged view — join, CTE cross-join, comment-separated UNION, Python-side concatenation, a merge written across an f-string interpolation, and a merge whose table names are interpolated and whose tier names arrive as call arguments — and recognises CREATE OR REPLACE VIEW; the rule 2 guard reports =, !=, <>, IN, BETWEEN, named parameters, HAVING aggregates, Python-side comparisons and a bare `where`-list predicate whose right-hand side is an interpolation, on the weight columns, still reports a real predicate adjacent to a CHECK constraint, and still passes the legitimate usages."
why = "Rule 1's guard caught 1 of 5 merge shapes and rule 2's caught 3 of 12; rule 2's 80-character `check (` lookback is a bypass in migration files full of CHECK constraints. Both carry shipped M0 coverage rows, so the only mechanical enforcement of two rules the spec calls non-negotiable would miss the natural spelling of a future violation while printing as covered. Review cycle 3 found both widenings had left a hole where this package's own idiom is: rule 1's new per-literal split walked an f-string at every interpolation, so a merge whose two tier names sit either side of one arrived as two half-statements and went unreported where the whole-file scan it replaced HAD reported it -- api/library.py:146-176 builds DNA SQL exactly that way, and 64 of the package's 508 f-strings carry a SQL verb; and rule 2 required both a leading WHERE/AND/OR/HAVING and a right-hand side opening with a digit, dot, $ or paren, while db/library.py:64-131 and scoring/serve.py:238-275 -- the two §6.0/§6.3 filter surfaces -- append every predicate as a bare `where.append(f\"col op {arg(value)}\")`, so a confidence cut added to the file whose own comment names that temptation was invisible to both arms. Both repairs measured at 0 offenders across the package and the migrations. Review cycle 4 found the same widening had sold a shape it did not buy back: with the table name interpolated and the tier names passed to the helper as arguments -- api/library.py:146-179 as it stands, one f-string over {table} called once per tier -- neither .py arm names a tier, while the whole-file scan they replaced reported that mutation. The keyword scan is kept underneath them as a floor, measured green over every source the guard reads: nine package modules name both tiers, two carry a UNION ... SELECT, and the two sets do not meet."
tests = ["backend/tests/test_landmine_guards.py::test_the_union_guard_catches_every_merge_shape", "backend/tests/test_landmine_guards.py::test_the_union_guard_recognises_a_replaced_sanctioned_view", "backend/tests/test_landmine_guards.py::test_the_weight_guard_catches_a_predicate_beside_a_check_constraint", "backend/tests/test_landmine_guards.py::test_no_weight_column_is_compared_in_python", "backend/tests/test_landmine_guards.py::test_the_python_weight_guard_catches_a_synthetic_violation", "backend/tests/test_landmine_guards.py::test_weight_filter_guard_catches_a_real_violation"]
# The same five names are listed on the two M0 rows as well as here, and that duplication is
# deliberate: data-rules-dna-tiers-never-merged and data-rules-weights-never-filters are the rows
# §4.1's two rules are actually enforced by, so leaving the widened self-tests off them would let
# rule 1 keep calling them covered by a guard that no longer catches what they claim. ADD, never
# rename — tonight-rank-board-filters (M3) names test_no_weight_column_is_used_as_a_filter too.

[[requirement]]
id = "platform-exit-scripts-can-report-their-own-failure"
spec = "§12 M2/M3/M4 exit criteria; §13"
milestone = "M4.8"
kind = "static"
what = "No milestone exit script contains a check whose predicate is a constant; the M4 script computes its verdict before it dereferences the winner, so an unresolved evening prints a diagnosis and exits non-zero instead of raising; the M3 script returns non-zero when a checkable precondition fails and names a section it could not measure instead of dropping it; a refused write while seeding stops the run and names the precondition it broke rather than counting the refusal as a verdict, and a refused read counts the same way -- the M3 script checks the pair draw as well as the answer, so a queue that refuses is reported rather than read as an exhausted one; the M4.5 script's staging tree is removed rather than left open on disk, nothing that can fail runs between the creation of its scratch database and the block whose finally drops it, and an exception inside the block that measures is reported as a failed check with its traceback rather than propagating as a bare one that loses the sections below it and the tally; and every string a milestone script prints encodes in the OEM code page, including the strings it did not author -- the importer's finding messages in the M4.5 script and the corpus-written winner name in the M4 script; and the M4.12 script's small-pool check reads the state its seat reads left behind, with no read of a settling route after them; and a figure a script's docstring publishes as measured is one the script's own constants give, so the M4.13 script's clamp control is recomputed from DROPS, K_FITTED and K_GROWN and held against both that docstring and the paragraph docs/TESTING.md publishes it in."
why = "ops/m45_exit_criterion.py passes `placed == 0 or True` for §12's M2 criterion and a literal True for the count-encoded blocks, and both counted toward the published 18/18; ops/m3_exit_criterion.py ends in an unconditional `return 0`; ops/m4_exit_criterion.py prints result['winner']['name'] before computing ok, so its single detectable failure is a TypeError. CLAUDE.md requires ASCII console output and four printed sites, including the coverage report's own header, break under cp850. Review cycle 1 found the same shape one layer down, where reading the scripts as source could not reach it: the staged tree's removal is a silent no-op on Windows while two NpzFile handles into it are open, check() printed the importer's own em-dashed finding messages -- 51 such literals, most inside the 150-character slice -- straight at the console, and the M4 script's rate() returned its full target after 24 refused writes and printed that number as verdicts written. Review cycle 2 found the class three more times, twice in code this milestone had just repaired: sharpen() read the answer's status and not the draw's, so a refused queue printed as an exhausted one over comparisons never made; the M4 script's RESOLVED line printed title.name -- the corpus's text, of which 104 of v20260828's 19,071 names leave the OEM code page -- through a `!r` that leaves the codepoint raw; and the M4.5 script compared max(id) to the id floor, which is None the moment an import lands no rows, three lines after the check that reported it. Review cycle 3 found the repair of that last one guarded only halfway: the reader searched every handler of the measurement block for a `check(False, ...)` and never read what the handler catches, so narrowing `except Exception` to a type the documented failure does not raise -- `asyncpg.PostgresError` for an async DB harness, `ValueError` for a parse -- left the guard green while the run reverted to the bare traceback that loses the sections below and the passed/total tally. The sibling guard on this same row, _unguarded_seeding, already reads handler.type. Review cycle 3 found the one clause of this `what` with nothing behind it, in the milestone whose thesis is that a claim nothing can falsify is the defect: sixteen tests covered the constant predicates, the verdict ordering, the terminal return, both console arms, the staging tree, the scratch window, the measurement block and both seeding halves, and none of them reached the `else` that prints `1. PERSONAL: NOT MEASURED`. Measured: with that branch deleted -- restoring a report numbered 2, 3, 4 that reads like a complete run -- every one of the sixteen stayed green. The new guard is stated over all three scripts rather than over the branch that was wrong, because the M4 script's `1. UNRESOLVED` is the same shape and is the rule being held. Review cycle 4 found that guard reading 15 of the 19 numbered headings its three subjects print: the heading class required an uppercase ASCII letter after the number, and the four it excluded are the section-sign headings (m3:249, m4:268, m4:273, m4:276) -- the §13/§14 instrument readings, whose data is optional at runtime and which are therefore the sections most likely to acquire the `if` with no `else` this guard exists to report. The letter never was the discriminator: `\\d+\\.\\s+` already excludes a decimal. M4.12 review cycle 2 found the same family one layer in, in a check rather than in a verdict: check 8 of the M4.12 script grades decision 215's clause -- a pool of two or three candidates reaches the ballot rather than waiting silently -- and on such a pool only the round read can end a seat, because there is no pair to answer and the escape is refused below pair six. It issued one more GET of the session AFTER its loop of seat reads, and every read of the session, the ballot and the result calls `play.settle`: so the trailing GET moved the room itself, the verdict came back 'ballot' whichever way the round read behaved, and the detail line the check prints -- that 'voting' is the silent wait this milestone closed -- named the one thing it could not see. No client produces that order either, which is M412-PLAY-4's defect read from the other end: `refresh()` GETs the session and only then calls `loadRound`. M4.13 review cycle 2 found the same class in a docstring rather than in a predicate: check 5 of `ops/m413_exit_criterion.py` said \"Measured that way the clamp reports 20/60 (33%)\", and the clamp is the one quantity in that check nothing computes -- the run measures the rescale. The stream the check builds, `round(i * (k_to - 1) / (DROPS - 1))` over `range(DROPS)`, puts 19 of 60 drops out of a 7-level history's reach, not 20; the published pair is what a probe over `range(1, DROPS + 1)` gives. It changed no verdict -- both sit inside the plan's 30-60% band -- but decision 246 makes `docs/TESTING.md`'s M4.13 paragraph the record of what the script measured, and the one figure in it nobody could reproduce was the one never re-derived from the code that shipped."
tests = ["backend/tests/test_static_contracts.py::test_no_milestone_exit_check_has_a_constant_predicate", "backend/tests/test_static_contracts.py::test_the_m4_script_computes_its_verdict_before_it_dereferences_the_winner", "backend/tests/test_static_contracts.py::test_the_m3_script_returns_a_verdict_rather_than_a_constant", "backend/tests/test_static_contracts.py::test_no_console_output_leaves_the_oem_code_page", "backend/tests/test_static_contracts.py::test_the_constant_predicate_guard_catches_a_real_violation", "backend/tests/test_static_contracts.py::test_the_console_encoding_guard_catches_a_non_ascii_print", "backend/tests/test_static_contracts.py::test_the_m45_script_removes_a_staging_tree_it_still_holds_open", "backend/tests/test_static_contracts.py::test_the_m45_script_prints_a_finding_message_the_console_cannot_encode", "backend/tests/test_static_contracts.py::test_the_m4_script_stops_seeding_when_a_write_is_refused", "backend/tests/test_static_contracts.py::test_nothing_that_can_fail_runs_between_creating_the_scratch_database_and_dropping_it", "backend/tests/test_static_contracts.py::test_the_scratch_window_guard_sees_a_statement_left_outside_the_block", "backend/tests/test_static_contracts.py::test_the_seeding_scripts_name_the_precondition_a_refused_write_broke", "backend/tests/test_static_contracts.py::test_the_seeding_guard_sees_an_unguarded_call", "backend/tests/test_static_contracts.py::test_the_m4_script_escapes_the_winner_name_it_did_not_author", "backend/tests/test_static_contracts.py::test_the_m3_script_counts_a_refused_draw_as_well_as_a_refused_answer", "backend/tests/test_static_contracts.py::test_the_m45_script_reports_a_failure_inside_its_measurement_block", "backend/tests/test_static_contracts.py::test_the_m3_script_names_the_section_it_could_not_measure", "backend/tests/test_static_contracts.py::test_the_small_pool_check_grades_the_state_the_seat_reads_left", "backend/tests/test_static_contracts.py::test_the_settling_read_guard_catches_a_trailing_session_get", "backend/tests/test_static_contracts.py::test_the_m413_scripts_clamp_control_is_the_number_its_own_constants_give", "backend/tests/test_static_contracts.py::test_the_clamp_control_arithmetic_moves_when_the_simulation_does"]
