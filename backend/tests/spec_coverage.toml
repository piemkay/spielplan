# The e2e case is named for one assertion inside it: the fake's write log holds no entry for the
# series after a decline wrote `unseen`, read through the real HTTP stack rather than a patched
# client. Decision 210(a) makes the refusal a thing the surface says as well as a thing the code
# does, and a recursive `MarkUnplayed` is not recoverable, so the negative wants asserting where
# a real request can send it. [M4.11, decision 210]
#
# The re-adoption test is named beside `..._is_app_only_and_is_not_re_owed` rather than folded
# into it because the two need OPPOSITE fixtures and only one of them is the household's: the
# app-only test never puts the series in the fake's played set, so Jellyfin agrees with the
# unseen and the un-marking guard answers it, while a household that finished the show in
# Jellyfin and then marked it not-seen in the app leaves the folder played for ever by design.
# A single test cannot be in both states. [review cycle 1: M411-R1-01; decision 213]
#
# The two static guards are the register's half of the same rule. This row cites decision 210 in
# its `spec` key and 210 went on stating 172(4)'s adopt clause unnarrowed for the whole milestone
