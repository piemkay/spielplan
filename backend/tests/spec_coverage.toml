# The last five are M4.11's. "Stores exactly one row for that (user, endpoint)" never asked what
# an endpoint is allowed to be, and the sender posts the stored string verbatim with the VAPID
# JWT attached -- so any member could turn this table into an internal reachability probe
# against the household's own Jellyfin or this app (§14.3). The prune test is the other end of
# the row's own lifetime claim: §4.2 prunes on 404/410 at send time and by age otherwise, and
# the age filter required a `last_seen_ok` the silent subscriptions it exists for never have.
# [M4.11, §4.2]
#
# The sixth is review cycle 1's, and it is a composition test rather than a sixth property: the
# route's reset and the prune's COALESCE were each defensible alone and together deleted a live
# phone on the night its owner opened /account. It drives the shipped route and the shipped job
# in one test because a unit test of either would have stayed green.
# [review cycle 1: m411-rev1-push-prune-deletes-a-live-device-that-just-re-registered]
#
# And the seventh is the other half of that composition, which neither of the two above could
# see: the first re-posts a row whose `last_seen_ok` is a day old, and the four SQL rows never
# re-post at all. In between sits the household that has never sent a push -- no Jellyfin link
# arms no prompt, and the invitation never goes to the host -- whose row is judged by
# `created_at` for ever, which a re-post did not move either.
# [review cycle 2: m411-c2-push-01]

