[[requirement]]
id = "tonight-rank-pool-filters-owned-kind-budget-rewatch"
spec = "§6.2 steps 1 and 3 (session controls; candidate pool) + §4.1 rule 5"
milestone = "M4"
kind = "integration"
what = "The candidate pool is exactly the owned titles of the session's kind that pass the runtime budget and the rewatch setting: an unowned title and a series in a film session never appear in the pool, in any pair served, or among the finalists; the budget is soft — a title is admitted up to budget + 40 min and none past it — and an admitted title over the budget carries 'runs N min over' with N its runtime minus the budget in whole minutes; with the rewatch toggle in its default position a title every seated member has seen is excluded and a title one of two members has not seen is kept."
why = "§4.1 rule 5 binds every ranking surface and Tonight ends in Play on Jellyfin, so an unowned or wrong-kind title is an evening the household cannot watch; the '+40 with a label' grace and the *every*-participant quantifier are the two places a plausible implementation silently gets it wrong in the direction nobody notices."
