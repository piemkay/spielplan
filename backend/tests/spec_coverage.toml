[[requirement]]
id = "data-rules-import-reports-every-shipped-table"
spec = "§10 (migration report) + §6.6 Data"
milestone = "M4.5"
kind = "integration"
what = "The import report accounts for every table the bundle ships: each one is either loaded with a row count, or named as skipped with a reason. A table present in the bundle and absent from the importer's mapping produces a report line, never silence — asserted by importing a bundle carrying a table the mapping does not know."
why = "§10 requires 'counts per table'. ImportReport only tracked unmapped columns *within* mapped tables, so three shipped tables — title_meta (46,318 rows), title_list_membership (35,295) and imdb_ratings (14,858) — were dropped with no line anywhere, and nothing in the app could notice."
tests = []

[[requirement]]
id = "data-rules-title-meta-multi-source-rows-kept"
spec = "§4.1 (title_meta) + §10"
milestone = "M4.5"
kind = "integration"
what = "title_meta is loaded, with its per-source rows kept rather than collapsed — a title carrying meta rows from two sources keeps both after import — and it is readable through the content spine. 'One block = one droppable source' survives the round trip."
why = "§4.1 names title_meta in the content spine with that exact rule. It has a table (0003_content.sql:72) and 46,318 rows in the bundle, and appeared in no file under backend/spielplan/ — created, shipped, and never loaded or read."
