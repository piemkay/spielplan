spec = "§3.1 first-boot sequence; §12 M0 'bundle imports clean'"
milestone = "M4.8"
kind = "static"
what = "The first-boot spec's serial group runs with retries disabled, so a failure after the admin has been created cannot be retried into a group that skips everything and be scored 'flaky'; the beforeAll skip that protects an ad-hoc run against a used database survives, and no bundle-dependent spec is given a has_bundle guard to make the failure disappear. The header comment that teaches the has_bundle convention states it over named files rather than over the whole spec directory and names 08-jellyfin.spec.js as the exception, so the file a maintainer opens first to learn the harness contract does not recommend the edit that guard refuses."
why = "01-first-boot's side effects persist across a retry, so a retry can only skip, and at the resolved Playwright a [failed, skipped] test scores flaky and exits 0. run.mjs reads that 0 as success and enters phase 2, where 62 of ~125 tests skip. The failure that must not be silenceable is §12's M0 exit criterion itself. Review cycle 3 found two spellings the guard could not see, both of them the ordinary way the rule is taken away. The nested-configure reader matched a literal digit, so `retries: process.env.CI ? 1 : 0` -- playwright.config.js:33 verbatim, three files away -- matched nothing at all while the file-level line kept the existential check satisfied; measured against the installed 1.62.1, that turns a failed first boot from `1 failed`/exit 1 into `1 flaky`/exit 0. And the configure was read out of the raw file, so a line commented out rather than deleted still supplied both bodies -- the taking-away gesture the beforeAll half of the same rule was already defended against, by the sibling reader one function below. Review cycle 3 then found the recommendation itself, in text this milestone's own step 5b had just written: playwright.config.js:16 closed with `every other spec guards itself on config.has_bundle instead`, and measured, 8 of the 17 non-first-boot specs carry no such guard while two of those skip on browserName, which is a different axis. The guard refuses the edit; the config is where a reader is told to make it, and it was the one place in the milestone stating a universal -- run.mjs:68 and the guard's own docstring both say `Nine spec files`. [M4.8 review cycle 3: m48-c3-e2e-03]"
tests = ["backend/tests/test_harness_contracts.py::test_the_first_boot_group_runs_with_retries_disabled", "backend/tests/test_harness_contracts.py::test_the_first_boot_beforeall_skip_survives", "backend/tests/test_harness_contracts.py::test_the_jellyfin_spec_is_not_given_a_has_bundle_guard", "backend/tests/test_harness_contracts.py::test_the_retries_guard_sees_a_group_that_can_retry_into_a_skip", "backend/tests/test_harness_contracts.py::test_the_config_does_not_teach_the_guard_08_jellyfin_must_not_have", "backend/tests/test_harness_contracts.py::test_the_has_bundle_claim_guard_sees_a_universal_the_directory_contradicts"]
# Decision 185: `test.describe.configure({ mode: 'serial', retries: 0 })` on this one file, not
# `failOnFlakyTests`. The key first appears in Playwright 1.52.0 and 1.62.1 accepts an unknown
# config key silently, so at the shipped ^1.49.0 floor a config-based adoption is a no-op that
# reads as a fix — and turning flaky into failure globally would make 14/15/16's real
# intermittents red rather than measured.

[[requirement]]
id = "platform-ci-runs-on-every-branch-and-installs-into-a-venv"
spec = "§12 milestone exit gates; §1 CPU-only wheels"
milestone = "M4.8"
kind = "static"
what = "A guard over .github/workflows/ci.yml asserts push runs are not restricted to a single branch, that a run already in flight on the default branch is not cancellable by a later push, and that no job installs the backend with `python -m pip` into the runner's interpreter rather than into a uv venv. A fourth reads every file in .github/workflows/ and asserts that no job on a runner GitHub does not own sits in a workflow a push creates runs of under a workflow-level concurrency group, because such a job's queue time is charged to that group; and two guards over the sentences written about the workflows hold them to what they do: the pending case is GitHub's default for a group carrying no `queue:` key and is claimed nowhere, and the self-hosted job nobody can claim yet is described as cancelled after 24 h, in a weekly run of its own, rather than as waiting for free."
why = "Every milestone branch merged with zero Linux runs: 11 runs, all `push main`, none for m3/m4/m45/m5, while docs/TESTING.md claimed CI ran on every push. The M4 merge run was cancelled 71 s in by cancel-in-progress. The e2e job — the only proof of the shipped image — installs into an externally managed interpreter and survives only on the runner image's /etc/pip.conf, and resolves CUDA torch where §1 requires CPU wheels. Review cycle 3: the trigger guard read `branches`, `branches-ignore` and the two paths filters but short-circuited every GitHub-hosted job past the job-level `if:` it already parses, so the fourth member of that set went unread. Measured against the real workflow with all five hosted jobs carrying `if: github.ref == 'refs/heads/main'`, a milestone branch's push runs literally nothing and all three guards report CLEAN -- finding 10's own symptom restored under the key an author reaches for first when the e2e job costs minutes. Review cycle 3 also found the two sentences this milestone wrote about the workflow claiming more than the workflow has, in the two places a reader goes to decide something: `cancel-in-progress` governs a run that is RUNNING, and GitHub's default for a ref-keyed group with no `queue:` key cancels a run left PENDING behind it, so the ledger's unqualified 'no longer cancellable by the next push' is false for the third push in one run's window -- the M4 merge symptom reached one push later, on a commit a §12 gate is read off. And an unclaimed self-hosted job does not simply queue: GitHub cancels it after 24 h, the weekly `schedule` is workflow-level and the hosted jobs answer it on the default branch, so main's Monday run reports non-green a day later until the runner is registered. Neither guard compares a string with a copy of itself: each reads the property out of ci.yml first and holds the prose to it, and each lifts if the workflow earns the wider claim. Review cycle 4: the corpus job this milestone added put that 24 h inside main's own concurrency group. `concurrency:` is workflow-level, so the group is held until the run's last job ends; the weekly tick created one run on the default branch containing five hosted jobs and one that queues for a day; and GitHub's default for a group with no `queue:` key cancels a run left pending behind it. So one day a week the first of any two pushes to main ended cancelled with no completed run -- finding 10's own symptom, on the branch the milestone ledger quotes gate results from, reintroduced by the job written to close finding 12. The guard written about the same 24 h asked what `needs:` the corpus job, found nothing, and never read the group: `needs:` is not what a workflow-level group blocks. The fix is a run of its own -- .github/workflows/real-bundle.yml, same two triggers, same label, decision 183 unchanged -- and the new guard reads the directory rather than one file, because a rule about an arrangement of files goes quiet on the third file somebody adds."
tests = ["backend/tests/test_harness_contracts.py::test_ci_runs_on_every_branch_push", "backend/tests/test_harness_contracts.py::test_a_run_on_the_default_branch_is_not_cancelled_by_the_next_push", "backend/tests/test_harness_contracts.py::test_no_ci_job_pip_installs_into_the_runner_interpreter", "backend/tests/test_harness_contracts.py::test_the_ci_guards_see_a_workflow_that_regressed", "backend/tests/test_harness_contracts.py::test_no_self_hosted_job_queues_inside_the_group_a_push_to_main_waits_in", "backend/tests/test_harness_contracts.py::test_the_group_guard_sees_the_arrangement_that_shipped", "backend/tests/test_harness_contracts.py::test_the_weekly_tick_says_what_an_unclaimed_self_hosted_job_does_to_the_run", "backend/tests/test_harness_contracts.py::test_the_default_branch_claim_is_bounded_to_the_run_in_flight"]
# Decision 183 keeps the real-bundle job out of the TRIGGER guard's reach: it runs on a
# self-hosted runner, on `workflow_dispatch` plus a weekly `schedule` and nothing else, so it
# gates no branch and no rule here may demand that a push reach it. The corpus is 1.15 GB and
# exists only on the household's disk; a URL in a repository secret would be the leak, not the
# fix. What decision 183 does not license is charging that runner's queue time to the group
# main's pushes wait in, which is why the fourth guard reads its runner: not to ask where the
# job runs, but to ask whether the run it holds is one anybody else is waiting for.

[[requirement]]
id = "platform-fixture-carries-the-corpus-awkward-shapes"
spec = "§4.1 (credits dedupe at read time, the two DNA tiers); §10; decision 162"
milestone = "M4.8"
kind = "backend"
what = "make_bundle emits the shapes the real export ships and the old fixture could not: one (title, person, job) credit recorded under two department spellings; dna_tag and dna_projected rows whose shipped facet column carries the corpus's long extraction labels while the term prefix carries the short vocabulary facet id; and an opt-in scale mode producing a pool of at least 700 owned movie titles without widening the feature contract or changing any block's column grammar."
why = "The fixture was written from the same reading as the importer, so it could not falsify either real defect: 29,188 of 31,540 dna_tag rows carry a facet that joins nothing, and 1,216 real titles carry a duplicate (person, job) pair that throws inside the render. At eight titles nothing in the suite can seed a pool the Tonight selector's cost on a 696-title owned pool is visible over: the two budget guards that landed at e87deed time `select` against a synthesized belief dict, which no fixture produces and which stops short of a seeded round. A fixture that cannot produce the shape is a statement about the fixture. Review cycle 3: the facet test asserted only that some row's facet differs from its term prefix and some agrees, never WHICH label, and shipped_facet -- the helper this milestone wrote for exactly this rule -- was applied to the generated pool rows only, never to the authored EXTRACTED/PROJECTED literals the default bundle ships. Both regressions the plan's bolded prohibition names were green: one row moved back to its prefix ships one facet under two extraction labels in a single export, a shape no export produces, and `visual.neon` filed under `visual_style` invents the fourth label M4.9's repair would then have been written against."
tests = ["backend/tests/test_bundle_shapes.py::test_the_fixture_ships_a_credit_recorded_under_two_departments", "backend/tests/test_bundle_shapes.py::test_the_fixture_ships_both_facet_namings", "backend/tests/test_bundle_shapes.py::test_the_scale_mode_grows_the_pool_without_widening_the_contract"]
# This row buys the shape, not the repair. importer/dna.py's facet copying and db/library.py's
# credit dedupe are M4.9's, and the 700-title pool exists for the half of M4.12 no belief board
# can stand in for: `ops/m412_exit_criterion.py`, not yet written, measures `GET
# /seats/{id}/round` over titles that were actually seeded. The pair search itself is already
# guarded without a bundle -- tonight-rank-selection-is-affordable-at-real-pool-size registers
# the two guards e87deed landed on `_random_board`, and they pass and can fail today.

[[requirement]]
id = "platform-the-suite-says-whether-the-integration-layer-ran"
spec = "§12 (a green suite is the evidence a milestone closes on)"
milestone = "M4.8"
kind = "backend"
what = "Every pytest run prints one ASCII line, at default verbosity and at -q, naming whether the integration layer is armed, against which host and database, and where the URL came from; `--no-db` disarms it and the db/app/pg_url tests skip rather than creating a database. Both the header hook and the session-start hook emit it. The ledger that publishes the flag to operators says what an unarmed run actually prints, measured against pytest rather than asserted, and the milestone counts in its `Current state` block are the counts this gate prints rather than a number pasted by hand."
why = "conftest auto-loads an untracked .env.test, so `pytest backend/tests` silently becomes an integration run that creates and drops databases and shells out to docker on whatever host that file names. The inverse is equally silent: 544 passed / 680 skipped reads exactly like 1,222 passed / 2 skipped. pytest hides the report header under -q, the verbosity CLAUDE.md and ci.yml both use. Review cycle 3: the disarm clause had nothing behind it. The arming line reads the option and pg_url reads the URL, two independent readings that meet only in pytest_configure's two lines, and the three tests here held the string and the two hooks. With the hook renamed away and pytest_addoption untouched -- so `--no-db` still parses -- the run prints UNARMED and creates <base>_p<pid>, runs the integration layer and shells out to `docker exec` from test_backup.py, and every registered test stayed green. Review cycle 3 found two claims about this instrument that nothing measured. The paragraph arguing why the line has to exist said `-q` prints skips as dots: it prints them as `s` and counts them in the summary, so the sentence told the maintainer CLAUDE.md sends to that file that a skipped run is typographically indistinguishable from a green one and there is nothing to look for -- while the argument that IS true, that nobody weighs the count, needed no false clause to make it. And the guard added in cycle 2 to hold the ledger's published counts to the ones this gate prints was the one test this milestone left registered on no row, so rule 2 -- the project's only mechanical protection against a guard disappearing -- could not see it deleted or renamed, and decision 184's refusal to invent a number in that ledger would have gone back to resting on nothing. Review cycle 4 found the third clause of this sentence -- where the URL came from -- held only at the rendering: all three arming-line tests handed the source in as a string literal, and _URL_SOURCE's derivation is read nowhere else in the tree, so the tidy-up conftest.py:21-26 spends six lines anticipating (compute the source once, when the URL is settled) left arming_line's body byte-identical, every test green, and every run on the household machine printing `(source: env)` over a URL nobody exported -- which is the half of the line an operator acts on, since `env` asserts a deliberate export and the untracked file is what silently turns `pytest backend/tests` into an integration run."
tests = ["backend/tests/test_harness_fixtures.py::test_the_arming_line_names_the_database_and_where_the_url_came_from", "backend/tests/test_harness_fixtures.py::test_the_unarmed_line_says_why_it_is_unarmed", "backend/tests/test_harness_fixtures.py::test_the_arming_line_learns_the_source_before_the_loader_erases_it", "backend/tests/test_harness_fixtures.py::test_both_report_hooks_emit_the_arming_line", "backend/tests/test_harness_fixtures.py::test_the_no_db_flag_disarms_the_layer_the_line_says_it_disarmed", "backend/tests/test_harness_fixtures.py::test_the_ledger_describes_the_skip_pytest_actually_prints", "backend/tests/test_spec_coverage.py::test_the_testing_ledger_publishes_the_counts_the_gate_prints", "backend/tests/test_spec_coverage.py::test_the_testing_ledger_counts_the_ids_the_map_actually_holds", "backend/tests/test_spec_coverage.py::test_the_testing_ledger_does_not_claim_a_skip_this_milestone_did_not_take"]
# The ledger guard is registered here rather than given an eleventh row, and the row it lands on
# is the one about the suite reporting truthfully on itself: `docs/TESTING.md` is where a green
# run is published, so a count no run produced is the same defect as a silent skip, one document
# further out. An eleventh row would also flip the published block to 11/11 and make that guard
# fail on its own registration until the block was re-pasted. [M4.8 review cycle 3: m48-c3-cov-01]
#
# The third lands here for the same two reasons, and it is that same silent skip taken literally:
# M4.12's paragraph published "it takes the last `pytest.skip` out of a registered test" over a
# tree in which four registered tests still skip, none of them Tonight's. All four are argued and
# belong to M4.7 and M4.8, so the repair is the sentence, not the rule -- and the guard reads the
# qualifier out of the prose, so a maintainer who widens the wording gets the wider rule with it.
# [M4.12 review cycle 2: M412-C2-LEDGER-01]
#
# `..._counts_the_ids_the_map_actually_holds` joins it for the same reason, one sentence further
# out: the fenced block was mechanical and the prose beside it was not, so the ledger published
# "84 ids across twelve pytest files" for a map holding 99 -- five of them registered by a review
# cycle after the paragraph was written, and nothing compared the two. Decision 184 refuses to
# invent a count no run produced; this refuses to leave one standing that the map has overtaken,
# which is the same rule read from the other end. [M4.11 review cycle 2: m411-c2-ledger-02]

[[requirement]]
id = "platform-orphaned-per-process-test-databases-are-reaped"
spec = "§12 (the integration layer is the evidence); §2 Backups (the dump/restore tests need free space)"
milestone = "M4.8"
kind = "integration"
what = "Before creating its own database a session drops every `<base>_p<pid>` whose named pid is no longer alive, leaves a concurrently running session's database untouched, ignores suffixes that carry no pid, keeps the pid intact in a name too long to store whole, and never fails the session when the reap itself fails -- reporting a failed reap where a console can see it rather than into pytest's captured output."
why = "pg_url drops its database only in the fixture's finally, which does not run on a terminate; its own docstring asserts the opposite. Measured in this worktree: 34 such databases, 4,151 MB, in the same cluster as the household's data. Reaping on connection count instead of liveness would reproduce the cross-process destruction the docstring records, because the db fixture closes its connection between tests. Review cycle 3: the four tests above hold the helper and not the mechanism. Each drives _reap_orphaned_databases itself with a report of its own, and has to -- the cluster fixture takes pg_url, so the session's own sweep has already run before any of them makes an orphan -- so deleting pg_url's one call left all four green while a session that is not one of the reap tests left two dead-pid orphans standing, and swapping the reporting lambda for a no-op left the failed-sweep warning unreachable under a test that supplies its own callable."
tests = ["backend/tests/test_harness_fixtures.py::test_a_dead_sessions_database_is_reaped", "backend/tests/test_harness_fixtures.py::test_a_live_sessions_database_and_a_pidless_name_survive", "backend/tests/test_harness_fixtures.py::test_a_reap_that_fails_does_not_fail_the_session", "backend/tests/test_harness_fixtures.py::test_a_long_base_name_does_not_shear_the_pid_the_reaper_parses", "backend/tests/test_harness_fixtures.py::test_the_session_fixture_is_what_runs_the_sweep"]
# Liveness on Windows is `OpenProcess(0x1000, ...)` and a `CloseHandle`, never `os.kill(pid, 0)`
# — the POSIX no-op signal terminates the process there.

[[requirement]]
id = "platform-app-fixture-is-isolated-from-the-operators-env"
spec = "§2 (env vars seed connector config on first boot); §7.3"
milestone = "M4.8"
kind = "integration"
