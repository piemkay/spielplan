    "backend/tests/test_tonight_round.py::test_the_pair_served_comes_from_the_straddling_set",
    "backend/tests/test_tonight_round.py::test_the_pair_served_is_the_one_that_resolves_the_most_straddlers",
    "backend/tests/test_tonight_round.py::test_a_tie_on_information_breaks_toward_the_widest_dna_axis",
    "backend/tests/test_tonight_round.py::test_selection_never_serves_a_pair_the_participant_has_already_answered",
    "backend/tests/test_tonight_round.py::test_a_pair_never_names_one_title_twice",
    "backend/tests/test_tonight_round.py::test_the_selection_weighting_is_a_distribution_over_the_four_answers",
    "backend/tests/test_tonight_round.py::test_a_foregone_pair_is_passed_over_for_one_the_round_is_unsure_about",
]

