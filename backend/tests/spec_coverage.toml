[[requirement]]
id = "tonight-rank-split-reserves-third-slot"
spec = "§6.2 step 5 (rewritten, 54d)"
milestone = "M4"
kind = "backend"
what = "When answers diverge on the leading candidates or D ≥ 0.20, the contested facet is zeroed rather than averaged in scoring, and the third finalist slot holds the highest-scoring title on the opposite pole of that facet — replacing the third-ranked title, not appended alongside it — and that finalist is labelled as the reserved one, on the stored row and on the reveal. When neither free finalist carries the reference pole, slot two is reserved for the best title on that pole as well, so the slate holds one of each rather than two neutral cards and one."
why = "Zeroing removes an influence and cannot by itself produce an alternative; the prototype printed 'one of each' over a plain top-3 that could land wholly on one pole."
# M4.12 AMENDED THE `what` TWICE, AND BOTH CLAUSES WERE ALREADY 54d's. "**labelled as such**" is in
# the spec sentence this row quotes and nothing carried it: `combine` gave the reserved title
# `SLOT_FINALIST` like the other two and no string `reserved` or `opposite` existed between the rule
# and the screen, so a household told "here's one of each" could not see which card was the other
# side. It ships as `session_result.reserved` (migration 0021, decision 220) rather than as a fourth
# `slot` value, because a slot would turn every `slot IN ('finalist','wildcard')` filter into a
# place to forget a finalist. The second clause is decision 221: with the reference pole repaired
# (finding 21), 219 of 1,971 random pools still produced [neutral, neutral, one pole], and §6.2
# fixes the "one of each" copy verbatim, so the slate is made true instead of the sentence reworded.
# Still exactly three finalists either way.
tests = [
    "backend/tests/test_tonight_combine.py::test_a_surfaced_split_reserves_the_third_slot_for_the_opposite_pole",
