[[requirement]]
id = "jellyfin-sync-a-failed-played-write-is-counted-not-swallowed"
spec = "§7.3 + §6.6 (admin sync card)"
milestone = "M4.11"
kind = "integration"
what = "A non-401 failure of the Played write -- 404, 500, timeout -- increments `push_failed`, appears in the admin sync report beside pushed/adopted/unchanged, and makes that user's sweep report incomplete; it does not mark the link as needing a re-link. A member whose own `/Items` read fails while the household's succeeds is named in `failed_users` rather than swallowed, and the admin card refuses to call that sweep healthy. A concurrent tap that holds the per-(user, title) lock is owed, not failed: nothing reached the media server, so the counter does not move and the member stays in `completed`. Both lines an operator reads are state changes rather than streams -- the ERROR repeats only when the set of refusals changes, and a version probe blocked while the library read succeeds reports no outage at all, while a real outage is still one WARNING and one recovery INFO however long it lasts."
why = "§7.3 ties the re-link prompt to a 401 specifically; a missing route or a dead proxy is not a credential problem, and a sweep that reports zero pushes and zero failures is indistinguishable from a healthy one. The per-member read is the same sentence one layer up: the keyless library read and the per-user reads fail independently, so a deleted Jellyfin account left `users` full, every counter zero and the card green for a sweep that reconciled nobody."
tests = [
    "backend/tests/test_seen_sync.py::test_a_failed_played_write_is_counted_and_the_sweep_says_it_is_incomplete",
    "backend/tests/test_seen_sync.py::test_a_server_below_the_pin_counts_a_failed_push_and_never_a_re_link",
    "backend/tests/test_seen_sync.py::test_a_member_whose_own_reads_fail_is_named_rather_than_swallowed",
    "backend/tests/test_worker_jobs.py::test_a_sweep_whose_played_writes_all_failed_is_an_error_in_the_log",
    "backend/tests/test_worker_jobs.py::test_a_quiet_healthy_sweep_still_says_nothing",
    "backend/tests/test_worker_jobs.py::test_the_same_failed_played_write_is_an_error_once_and_not_ninety_six_times_a_day",
    "backend/tests/test_seen_sync.py::test_a_tap_holding_the_title_lock_is_owed_and_not_a_failed_played_write",
    "backend/tests/test_seen_sync.py::test_a_blocked_version_probe_is_not_an_unreachable_jellyfin",
    "backend/tests/test_static_contracts.py::test_the_sync_health_verdict_refuses_a_sweep_that_reconciled_nobody",
]
# The quiet-sweep test is the negative control and is named on purpose: §5.3 fires this job 96
# times a day, so a log line per sweep buries the one that matters, and a widened condition with
# no test for what it must still ignore is how that happens. [M4.11]
#
# The per-member read failure keeps `push_failed` at zero deliberately, and the test asserts that
# negative: a read that never happened is not a failed Played write, and collapsing the two would
# make §6.6's card print "N Played write(s) failed" for a sweep that attempted none. The card's
# half is asserted in the vitest beside `+page.svelte`, which is where the rule that read the
# report lives -- the same layer choice the row above makes for the empty-`users` case.
# [review cycle 1: seen-02]
#
# And named, in cycle 2, at the layer this map can hold: this row published "the admin card
# refuses to call that sweep healthy" and every id under it was a backend one, so renaming the
# vitest broke no build and the clause read as covered. The vitest cannot be the name -- the
# plan's risks section forbids a `frontend/src/...` path in a `tests` list and decision 206
# refused to register one even after M4.9 made them resolve -- so the static guard carries it,
# pinning the ternary that IS the verdict: the report has no health field, and all three sweeps
# the rule separates (quiet, unreachable, member lost) arrive with every counter at zero.
# [review cycle 2: m411-c2-cov-01]
#
# Cycle 2 added the three that keep this counter and its log honest in the other direction. A tap
# holding the per-(user, title) lock is owed and not failed, or a 100 ms race lands in the counter
# cs-05 built for a permanently broken write direction. The ERROR is a state change, because the
# condition it reports is permanent by construction -- a refused write stays owed and is
# re-counted every fifteen minutes -- and the figures still reach the INFO summary every sweep.
# And the sweep's own ops-15 pair had no test at all: the version probe and the library read are
# different routes, so a blocked probe set and cleared the outage memo inside one sweep and
# reported a server that was never down.
# [review cycle 2: m411-rev2-seen-03, m411-c2-worker-03, m411-rev2-seen-02]

