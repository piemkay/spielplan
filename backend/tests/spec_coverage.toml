[[requirement]]
id = "jellyfin-acquisition-eval-reimport-rebuild-set"
spec = "§10 rebuild set (with decision-doc proposals 141, 111)"
milestone = "M2"
kind = "integration"
what = "A re-import against a different Backbone recomputes exactly four things and nothing else: user fold-in vectors, per-label-count blend weights, a full Ledger MAP refit, and Cold Tower re-placement of every app-acquired title using feature vectors rebuilt from the staged bundle's contract (whose column set may differ). Every `verdict`, `duel` and `tier_edit` row survives the re-import unchanged. The rebuild is computed in the STAGED bundle's basis and stamped with the staged version, so every fitted (user, kind) carries it and `load_cache` returns a `FitCache` after the flip rather than refusing the fit the rebuild just made."
why = "Ledger observations reference `title.id` and vocabulary-independent facts so they survive, while anything expressed in the old basis does not; the v1 Map is a deterministic axis scatter with no rebuild step, so its presence in the recompute set is a bug."
tests = [
    "backend/tests/test_placement.py::test_a_reimport_runs_exactly_the_four_rebuild_steps_and_no_map_rebuild",
    "backend/tests/test_placement.py::test_a_reimport_rebuilds_vectors_from_the_staged_contract",
    "backend/tests/test_placement.py::test_verdicts_duels_and_tier_edits_survive_a_reimport_unchanged",
    "backend/tests/test_placement.py::test_the_rebuild_refuses_a_bundle_that_was_never_staged",
    "backend/tests/test_import_integration.py::test_the_import_recomputes_the_rebuild_set_before_it_flips",
    "backend/tests/test_model_basis.py::test_every_fitted_pair_carries_the_version_its_basis_came_from_after_a_models_only_reimport",
    "backend/tests/test_model_basis.py::test_the_rebuild_fits_against_the_staged_bundle_and_stamps_the_staged_version",
]
# The staged-basis sentence is M4.13's. §10 step 3 ran before the flip and built its coordinates
# with no version threaded, so `placement_embeddings` took its `b.state = 'active'` branch -- the
# OUTGOING bundle -- and `_write_fit` stamped the outgoing version from `active_bundle_version`.
# Measured ||v_step3 - v_correct|| = 0.397 against ||v_correct|| = 0.782. After the flip
# `load_cache` refused both rows, so the first tap per (user, kind) refitted on the request path
# against the old in-process Backbone and stamped THAT as the new version. This row already
# asserted the rebuild happens; what it did not assert is the basis it happens in.
# [M4.13, data-01]
#
# The basis and the stamp are two INDEPENDENT arguments -- `_rebuild_ledger_refit` passes the
# staged version to `standard_embeddings` for the coordinates and to `refit_all` for the stamp --
# so the two ids above that end at a stamp or at `load_cache` cannot fail on a basis regression:
# dropping the version from the embeddings call alone leaves both of them green (probed).
# `test_the_rebuild_fits_against_the_staged_bundle_and_stamps_the_staged_version` is therefore
# listed too, and it is the id that carries the first half of this row's staged-basis sentence.
# [M4.13 cycle 1, m413-rev1-cov-01]

