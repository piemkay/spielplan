[[requirement]]
id = "platform-secrets-key-rotation-has-an-executor"
spec = "§2 Configuration; §14.3"
milestone = "M4.7"
kind = "integration"
what = "`spielplan-secrets rewrap` re-wraps the single active DEK row under a new key inside one transaction, leaves every ciphertext byte and key_id unchanged, refuses when more than one un-retired row exists, and refuses a --new-key the app would refuse to boot with — the same floor and the same message core/config's validator holds, applied before the UPDATE, while a short --old-key stays legal because that is the install being rescued. `spielplan-secrets reset` asks the same question §6.6's System card asks — every key_id a sealed row names, retired or not, so the Connectors card's own repair cannot make it a no-op — retires the rows it can, clears the connector ciphertexts that named them, removes the web-push keypair rather than half of it, and reports what was lost; after which the System card reports custody intact and the next boot mints the replacement keypair the command promises. The order that executor forces is written where the operator meets it and not only in a test: on the one install the floor strands — a hand-typed SECRETS_KEY under 32 characters, which stops booting on upgrade — the new value goes into .env BEFORE the command, because the CLI constructs the same Settings the app refuses to boot with one statement before it opens a connection, and .env.example's rotation block gives that case its own reversed recipe."
why = "§2: \"rotating SECRETS_KEY is an explicit admin action that re-wraps the one DEK row\" — promised by the spec, by .env.example and by a green coverage row, with rewrap_dek's only caller a unit test. And the block that promised it gave the steps in the one order that install cannot run: `docker compose exec backend` has no container to attach to, and `docker compose run` dies in pydantic on the value still sitting in .env, with a message that reads as a complaint about the key just typed on the command line."
tests = [
    "backend/tests/test_secrets_custody.py::test_rewrap_moves_the_wrapping_and_leaves_every_ciphertext_untouched",
    "backend/tests/test_secrets_custody.py::test_rewrap_refuses_when_more_than_one_row_is_un_retired",
