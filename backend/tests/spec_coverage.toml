[[requirement]]
id = "data-rules-ledger-hyperparams-from-bundle"
spec = "§4.3 ledger_hyperparams.json"
milestone = "M2"
kind = "backend"
what = "Refitting the Ledger against a ledger_hyperparams.json with altered constants (ridge λ, λ_bt, step count, learning rate, margin-weight form, tie prior δ₀, b_i prior τ, σ-inflation rate and cap) changes the fit for every one of them, and bundle validation accepts a bundle that ships no per-user cutpoints and no per-arm sensitivities. A constant the bundle ships null, or marks provisional, disables the rule that reads it rather than falling back to a literal the app chose for itself."
why = "§4.3 ships those constants for offline re-tuning and deliberately withholds the per-user quantities, which are fitted in-app."
tests = ["backend/tests/test_ledger_hyperparams.py::test_a_bundle_constant_replaces_the_default", "backend/tests/test_ledger_hyperparams.py::test_per_user_keys_are_ignored_and_reported", "backend/tests/test_ledger_hyperparams.py::test_the_fixture_ships_no_per_user_constants", "backend/tests/test_ledger_hyperparams.py::test_a_bundle_that_omits_everything_still_fits", "backend/tests/test_ledger_hyperparams.py::test_a_nonsensical_constant_is_refused_at_the_boundary", "backend/tests/test_ledger_hyperparams.py::test_the_digest_changes_with_any_constant_that_changes_a_fit", "backend/tests/test_ledger_model.py::test_every_shipped_constant_changes_the_fit", "backend/tests/test_ledger_model.py::test_the_solver_constants_reach_the_work_not_the_answer", "backend/tests/test_ledger_model.py::test_turning_margin_weighting_off_flattens_the_toggle", "backend/tests/test_ledger_model.py::test_sigma_inflates_with_the_square_root_of_neglect_and_stops_at_the_prior", "backend/tests/test_ledger_hyperparams.py::test_a_null_sigma_inflation_rate_disables_the_inflation_and_notes_it", "backend/tests/test_ledger_hyperparams.py::test_a_provisional_constant_disables_its_rule_rather_than_falling_back"]
# The second sentence is M4.13's. This row asserted that a constant the bundle CHANGES reaches
# the fit, and the shipped bundle's awkward case is the opposite one: `rate_c_per_sqrt_month` is
# null with `provisional: true` and the note "no measurement behind the rate yet -- tune before
# use", and the app recorded the flag as deliberately unused and then ran sigma-inflation at its
# own 0.05. A default is a number somebody measured somewhere; a null is the bundle saying nobody
# has. [M4.13, decision 239's sibling finding set]

