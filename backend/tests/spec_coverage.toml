[[requirement]]
id = "jellyfin-acquisition-eval-new-title-trigger-one-job-per-title"
spec = "§7.2"
milestone = "M5"
kind = "integration"
what = "Both trigger paths enqueue exactly one acquisition job per newly added title: a burst of `ItemAdded` webhook events for many episodes of one series inside the 10-minute debounce window yields one job for the show, not one per episode; and with the webhook plugin absent the 15-minute `DateCreated > last_sync` delta poll enqueues the same set once and does not re-enqueue titles from a previous poll. A title present in the DB but absent from the current Jellyfin mirror flips `is_owned = false`, and flips back when re-added."
why = "Owner requirement: every Jellyfin add triggers acquisition. Library scans add seasons in bursts; the corpus connector is full-mirror only, so the delta path is new code, and `is_owned` is re-derived because a stale flag is wrong the moment the library changes."
tests = []

[[requirement]]
id = "jellyfin-acquisition-eval-derive-applies-both-ledgers-corrections-last"
spec = "§8 stage 3 (with §14 risk 5)"
milestone = "M5"
kind = "integration"
what = "A re-derive of an already-derived title regenerates its rows and then applies `adjudications_v1.tsv` (DNA verdicts) and `corrections_v1.tsv` (credit facts), with corrections applied last; a curated credit fix present before the re-derive is still present after it, and the two ledgers are applied at their own points rather than merged into one pass."
why = "A derive that regenerates rows without re-applying both ledgers silently reverts curated fixes — the 787-rows-reverted-twice scar named in §14.5."
tests = []

[[requirement]]
id = "jellyfin-acquisition-eval-stage-park-retry-idempotent"
spec = "§8 stage 4 (with §14 risk 5)"
milestone = "M5"
kind = "integration"
what = "A title whose pack has a plot but fewer than two review sources or under 50 words parks at `reviews gate` with that reason and a 30-day retry window rather than advancing to `dna pack`; the admin retry resumes from the parked stage, re-uses the content-addressed raw store instead of re-fetching, and produces no duplicated derived rows."
why = "New releases accrue reviews over weeks; the raw/derived split and idempotent re-ingest are the corpus invariants that must be ported or the per-title derive inherits the bugs they were built to kill."
tests = []

[[requirement]]
id = "jellyfin-acquisition-eval-spend-cap-meters-billed-tokens"
spec = "§8 stage 6 + §9 (with decision-doc proposals 107, 109)"
milestone = "M5"
kind = "integration"
what = "The spend meter charges billed output tokens including a provider's reasoning/thinking tokens, not the visible JSON alone; once the running month is at the configured cap, stage 6 parks with the reason `over spend cap` without issuing any paid call, and a manual retry of a parked stage-6 job that would breach the cap is refused with that reason rather than queued."
why = "Gemini bills thinking tokens as output — counting visible JSON understates cost ~5× — and §8 forbids paid stages auto-retrying past the cap; a cap computed from the wrong number is not a cap."
tests = []

[[requirement]]
id = "jellyfin-acquisition-eval-extraction-verify-trust-boundary"
spec = "§8 stage 7"
milestone = "M5"
kind = "backend"
what = "The verifier drops, never repairs, any extracted tag whose term is not in vocabulary v1 after alias repair and adjudication rename, whose quote is not a substring of the pack under `norm()`, or whose salience is outside {1,2,3}; every tag it passes carries its evidence quote, and a fabricated tag inside an otherwise well-formed provider response is absent from the verifier's output."
why = "The ported trust boundary caught 100% of fabricated tags in the corpus pilot, and §4.1 rule 1 requires that an extracted tag without its quote is unfalsifiable and must not exist."
tests = []

[[requirement]]
id = "jellyfin-acquisition-eval-flywheel-enqueues-naming-failures"
spec = "§8.4 (with decision-doc proposals 135, 104)"
milestone = "M5"
kind = "integration"
what = "A naming failure — a bound-vocabulary query returning zero owned titles, a frontier with no vocabulary coverage, a thin-facet title — appends a flywheel row carrying its reason at the moment it happens and is readable from the admin queue immediately, not after a nightly job; the batch an admin launches from that queue targets exactly the selected rows and no others."
why = "DNA breadth is the measured binding constraint (zero owned titles carry `themes.robots`); §8.4 and proposal 135 make the queue a live instrument with per-batch approve/launch controls."
tests = []

[[requirement]]
id = "jellyfin-acquisition-eval-llm-validator-two-attempt"
spec = "§9"
milestone = "M5"
kind = "backend"
what = "A provider response that satisfies the request schema but violates the extraction contract (an out-of-vocabulary term, an unquotable evidence string) is rejected by the validator and retried exactly once with the specific violation named in the retry prompt; a second violation fails the stage and writes nothing. The behaviour is identical across the Gemini, Anthropic and OpenAI adapters despite their different structured-output mechanisms."
why = "\"The schema is a cost-saving device, not the guarantee — the guarantee is the validator\"; the three adapters solve structured output in three different ways (forced tool-use, strict-schema stripping, responseSchema) and must not diverge in enforcement."
tests = []

[[requirement]]
id = "map-taste-admin-kind-partition-ranked-lists-only"
spec = "§4.1 rule 5 + §6.4 + §6.5 (decision 18)"
milestone = "M6"
kind = "backend"
what = "Compositional-search survivors, the explore-frontier list, Divisive and Shared sweet spot return kind-partitioned results — with both Films and Series toggles on, two headed sections rather than one ordering over two per-kind CDF populations — while the map canvas and the facet silhouette return unpartitioned, and the match-for-you lens carries one colour ramp per kind rather than a single ramp over a mixed field."
why = "Rule 5 binds ranking surfaces only; the CDF is computed per kind, so a series at .9 and a film at .9 are percentiles of different populations. Decision 18 mandates headed sections wherever a surface ranks."
tests = []

[[requirement]]
id = "map-taste-admin-map-deterministic-across-reimport"
spec = "§6.4 (determinism)"
milestone = "M6"
kind = "integration"
what = "Re-importing a bundle built on a different backbone leaves every map coordinate identical, given unchanged axis TSVs and DNA rows — no rebuild step runs and no coordinate shifts."
why = "§6.4: deterministic axis scatter — no nightly rebuild, no Procrustes anchoring, no map shift on bundle re-import."
tests = []

[[requirement]]
id = "map-taste-admin-map-touch-controls"
spec = "§6.4 (zoom/pan) + §6 preamble (phone-first)"
milestone = "M6"
kind = "e2e"
what = "On a mobile viewport the map zooms by pinch, pans by drag past the threshold without selecting a node, has a touch reset, and renders all four pole labels plus the facet legend with its isolate behaviour."
why = "§6.4's 'zoom/pan' is unqualified by form factor and §6 calls the phone primary, yet wheel zoom is bound on the wide canvas only and no touch gesture exists anywhere."
tests = []

[[requirement]]
id = "map-taste-admin-axis-value-not-rank"
spec = "§6.4 Placement (decision 84)"
milestone = "M6"
kind = "backend"
what = "A title's coordinate on a facet axis is the salience-weighted mean of its terms' axis weights (weights from the facet's axis TSV, salience joined at read time from dna_tag/dna_projected), scaled to the axis's observed distribution and not to a rank percentile: two titles with identical term sets get identical coordinates, and a library that genuinely clusters on an axis plots clustered rather than spread edge to edge with hash tie-breaks."
why = "Decision 84 chose the value plot: a named pole must mean the pole, not 'median in this library'."
tests = []

[[requirement]]
id = "map-taste-admin-axis-no-coverage-gutter"
spec = "§6.4 Placement (decision 84, adopted consequence)"
milestone = "M6"
kind = "backend"
what = "A title carrying no term on the selected axis is returned with an explicit no-coverage marker and placed in a gutter outside the plotted field — never 0.0, never at a pole, never at the origin — and is emitted as a §8.4 flywheel candidate."
why = "The field's edge is a named pole, so a title with no evidence must not be made to assert the strongest possible claim on that axis."
tests = []

[[requirement]]
id = "map-taste-admin-search-two-distinct-failures"
spec = "§6.4 compositional search + §8.4"
milestone = "M6"
kind = "integration"
what = "A query that binds vocabulary terms but yields no owned title writes exactly one flywheel row carrying its reason ('no owned title carries robots + gladiatorial'); a query that binds no term writes zero flywheel rows and its response does not report a queue write."
why = "§6.4 enqueues on empty predicates only; a UI that reports a queue write which did not happen is worse than one reporting nothing."
tests = []

[[requirement]]
id = "map-taste-admin-search-two-tier-split"
spec = "§6.4 two-tier rule + §4.1 rule 1"
milestone = "M6"
kind = "integration"
what = "Compositional-search survivors return as two separately ordered groups — extracted tier first, projected tier second under the label 'PROJECTED TIER — INFERRED, NOT QUOTE-VERIFIED' — and a (title,term) pair present in both tables stays distinguishable per tier rather than being unioned into one list."
why = "§4.1 rule 1: dna_tag and dna_projected are never merged or unioned; 14,181 pairs exist in both tiers."
tests = []

[[requirement]]
id = "map-taste-admin-wander-edges-named"
spec = "§6.4 wander"
milestone = "M6"
kind = "backend"
what = "Every neighbour edge returned for a selected title carries at least one shared vocabulary term as its label; an edge whose shared-term set is empty is not returned at all."
why = "§6.4: every connection is nameable — edges are DNA terms, never opaque similarity."
tests = []

[[requirement]]
id = "map-taste-admin-divisive-beats-crowd-baseline"
spec = "§6.5 Divisive-title list"
milestone = "M6"
kind = "backend"
what = "The divisive list ranks by contestedness measured against the crowd baseline, not a bare |Δ CDF| sort — a title the two users split on that the crowd also splits ranks below one whose split is specific to these two — and each row exposes both figures (Δ and crowd Δ)."
why = "§6.5 requires the list reflect these two people rather than films that divide audiences in general; the shipped footer asserts exactly that over a bare Δ sort."
tests = []

[[requirement]]
id = "map-taste-admin-facet-affinity-centred"
spec = "§6.5 Facet silhouette + §4.1 rule 2"
milestone = "M6"
kind = "backend"
what = "Facet affinity is the salience-weighted mean of the user's Ledger CDF over titles carrying that facet's terms, centred on that user's own mean CDF: a uniformly generous rater's silhouette sits flat near zero rather than uniformly high, and two users with identical relative pull but different offsets produce identical silhouettes."
why = "The generosity/mean-affinity offset is the same confound (r = −0.80) that holds the eighth axis back; uncentred, the chart measures how generous a rater is."
tests = []

[[requirement]]
id = "map-taste-admin-sweet-spot-plain-average"
spec = "§6.5 Shared sweet spot + §6.2 step 3"
milestone = "M6"
kind = "backend"
what = "Shared sweet spot is ordered by the plain average of the two users' Ledger scores, matching the §6.2 candidate-pool order for the same two members: a pair where min(A,B) favours title X but the mean favours Y ranks Y first."
why = "No aggregation rule dominates plain averaging; dominance rules such as max-min cost −0.012 against a 0.003–0.008 noise floor, and the sweet spot is the Tonight prior."
tests = []

[[requirement]]
id = "map-taste-admin-seven-axes-plotted-from-ledger"
spec = "§6.5 seven axes"
milestone = "M6"
kind = "backend"
what = "The taste-axes response carries exactly the seven shipped axes with Small-and-observed↔Big-and-staged absent, and each user's position on an axis is a deterministic function of that user's Ledger-weighted DNA profile — identical Ledgers give identical positions, a changed verdict moves the dot — never a function of the user id or a hash."
why = "§6.5 ships 7 not 8 (the eighth carries the r = −0.80 generosity confound) and plots both users per axis; the prototype placed both dots by hash noise, making the panel decorative."
tests = []

[[requirement]]
id = "jellyfin-acquisition-eval-home-assistant-is-additive-only"
spec = "§11"
milestone = "M7"
kind = "static"
what = "No module outside the three declared Home Assistant seams — the token-authed `POST /events/playback` handler, the optional presence-hint input to session lobbies, and the session-launch webhook — imports or references Home Assistant code, and no core flow reads Home Assistant configuration."
why = "§11 guarantees the app is fully standalone with HA integration additive; a guard that reads the source is the cheapest way to keep that from eroding as M7 lands."
tests = []

[[requirement]]
id = "platform-passkey-registration-prompted-after-first-change"
spec = "§3.1; §3.2"
milestone = "M1"
kind = "e2e"
what = "After the forced first-login password change, an account with no passkey and a browser that supports WebAuthn lands on the account page with a prompt to add one; the prompt is one-time (it does not reappear once a passkey exists) and it never replaces the password, which stays available."
why = "§3.1's sequence ends \"and passkey registration is prompted afterwards\" — a control that exists but is never offered is not a prompt, and §3.2 makes passkeys primary rather than compulsory, so a standing nag would be wrong too."
tests = ["e2e/specs/09-passkeys.spec.js::a new member is prompted to add a passkey right after the forced change", "e2e/specs/09-passkeys.spec.js::the password fallback is never hidden behind the passkey button"]
