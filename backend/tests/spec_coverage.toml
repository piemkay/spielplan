[[requirement]]
id = "tonight-rank-escape-from-pair-six"
spec = "§6.2 step 4 (rewritten, 54c; schema 54g)"
milestone = "M4"
kind = "backend"
what = "The round state reports the 'just pick for us' escape as unavailable through pair 5 and available from pair 6 onward; invoking it before pair 6 is rejected, and invoking it from pair 6 ends that participant's round immediately on what is known, still yielding a shortlist, with session_participant.ended_by='escape'. Once the seat has ended - by convergence, by the cap or by the escape itself - the state reports the escape as unavailable rather than offering a control the route refuses."
why = "Neither cap nor escape is a failure state, but the escape must not be reachable before the round has learned anything, and §14 risk 6 wants the rate at which it fires."
# The last sentence of the `what` was added when this milestone opened and nothing held it: the flag
# was `answered_count` alone, so a seat that had converged, hit the cap or taken the escape itself
# still advertised a control the route answers with `round_over`. The test list is unchanged because
# the test that owes it is the one already named -- `test_the_state_reports_when_the_escape_becomes_
# available` asserted both of its halves under `if answered >= ESCAPE_FROM_PAIR - 1`, which a round
# that ended before pair five satisfied by never evaluating them. Strengthened in place: the pool is
# widened so pair five is genuinely reached, the count is asserted rather than hoped for, and the
# seat is then escaped and the flag read again beside `round.escape_available(answered)`, which still
# says yes -- so the assertion is about `ended_by` rather than about the count. [M4.12 finding 9]
tests = [
    "backend/tests/test_tonight_round.py::test_the_escape_is_unavailable_through_pair_five_and_available_from_pair_six",
    "backend/tests/test_tonight_round.py::test_an_early_escape_is_refused_rather_than_quietly_ignored",
    "backend/tests/test_tonight_integration.py::test_the_escape_is_refused_before_pair_six_and_ends_the_round_after",
    "backend/tests/test_tonight_integration.py::test_the_state_reports_when_the_escape_becomes_available",
]

