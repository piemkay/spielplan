[[requirement]]
id = "jellyfin-acquisition-eval-playback-arms-prompt-never-writes"
spec = "§7.3"
milestone = "M1"
kind = "integration"
what = "A Jellyfin session reaching ≥90% playback of a title arms a per-user finish prompt and leaves `user_title.state` untouched; only the user's explicit tap writes `seen`, and while that prompt is open the 15-minute sweep adopts nothing for that (user, title) — so no sync can close it as answered. Repeated polls of `/Sessions` over the same session arm the prompt exactly once, not once per poll."
why = "\"Jellyfin playback is a suggestion, never a silent write\" — inferred state must never outrank the person, and rating capture is measured against finished playbacks (§13)."
# The third clause is M4.11's, under decision 211 -- which decision 172(2) had already ruled. The
# sentence "only the user's explicit tap writes `seen`" was false in the one window where it
# matters: the sweep's adopt branch writes `seen` from Jellyfin's own Played flag and `pending()`
# then closes the open prompt as `answered`, measured at one sweep -- so a linked member watching
# in Jellyfin is never asked, §7.3's "offers the verdict flow" never fires, and `arm` refuses the
# title on every later viewing because it is already seen. The repair is that the sweep does not
# ADOPT for a title whose prompt is open, not a fifth `prompt_state` naming the closure: that
# option was costed and refused, because §13's denominator is `playback_event WHERE finished` and
# `prompt_state` has no reader outside `sync/playback.py`, so it would have bought a migration for
# nothing and left the silent write standing. [M4.11, decision 211]
tests = ["backend/tests/test_playback_prompt.py::test_a_session_past_the_threshold_arms_a_prompt", "backend/tests/test_playback_prompt.py::test_arming_writes_no_seen_state", "backend/tests/test_playback_prompt.py::test_a_session_below_the_threshold_arms_nothing", "backend/tests/test_playback_prompt.py::test_jellyfins_own_played_flag_arms_below_the_threshold", "backend/tests/test_playback_prompt.py::test_repeated_polls_of_one_viewing_arm_it_once", "backend/tests/test_playback_prompt.py::test_a_second_viewing_while_the_first_is_unanswered_adds_no_card", "backend/tests/test_playback_prompt.py::test_the_poll_reads_sessions_and_arms", "e2e/specs/08-jellyfin.spec.js::the prompt marks nothing until it is tapped", "e2e/specs/08-jellyfin.spec.js::repeated polls of one viewing do not re-arm it", "backend/tests/test_playback_prompt.py::test_the_threshold_is_the_one_the_spec_names", "backend/tests/test_playback_prompt.py::test_the_boundary_is_inclusive", "backend/tests/test_playback_prompt.py::test_a_rewatch_in_a_new_viewing_asks_again", "backend/tests/test_playback_prompt.py::test_a_title_already_seen_arms_nothing", "backend/tests/test_playback_prompt.py::test_an_open_prompt_closes_when_the_state_arrives_another_way", "backend/tests/test_seen_sync.py::test_the_sweep_does_not_adopt_while_a_finish_prompt_is_open", "backend/tests/test_playback_prompt.py::test_an_episode_session_arms_the_prompt_for_its_series", "backend/tests/test_playback_prompt.py::test_a_session_on_a_copy_the_sweep_recorded_resolves_through_the_copy_map", "backend/tests/test_playback_prompt.py::test_a_dismissed_viewing_is_not_re_armed_and_sends_no_second_push", "backend/tests/test_playback_prompt.py::test_the_state_write_lands_before_the_prompt_is_consumed"]
# Five added in M4.11, one per clause the milestone found unasserted. The sweep test is the
# third clause above and the only one that could not live in `test_playback_prompt.py`: the
# window is a sweep's adopt branch, not a poll. `test_an_open_prompt_closes_when_the_state
# _arrives_another_way` keeps its name and its place -- its body was rewritten, because under
# decision 211 the sweep is no longer one of the ways the state can arrive, so the other way it
# now simulates is an explicit `seen.set_state`. The rewatch entry above was renamed in the
# same change, for the reason decision 211's SQL gives: the guard is keyed on the viewing.
# [M4.11, decisions 210 and 211]

[[requirement]]
id = "jellyfin-acquisition-eval-seen-sync-no-echo-loop"
spec = "§7.3"
milestone = "M1"
kind = "integration"
what = "When the app's explicit `seen`/`unseen` action and Jellyfin's Played flag disagree, the app's action wins; the write stamps `jf_synced_at`, and the next 15-minute sync reading back the value the app just wrote produces no further write and no state change. A Jellyfin-side change made after `jf_synced_at` is accepted."
why = "Two-way sync is new relative to the corpus project's read-only stance; last-writer-wins with app-explicit precedence plus `jf_synced_at` is the stated loop guard."
tests = ["backend/tests/test_seen_sync.py::test_reading_back_our_own_write_changes_nothing", "backend/tests/test_seen_sync.py::test_a_jellyfin_side_change_after_the_sync_is_accepted", "backend/tests/test_seen_sync.py::test_an_action_taken_while_jellyfin_was_down_is_pushed_by_the_next_sync", "backend/tests/test_seen_sync.py::test_the_first_sync_after_linking_never_erases_jellyfin_history", "backend/tests/test_seen_sync.py::test_the_app_side_write_never_depends_on_jellyfin", "backend/tests/test_seen_sync.py::test_sync_all_runs_every_linked_user_and_reports", "e2e/specs/08-jellyfin.spec.js::a flag set in jellyfin arrives in the app", "e2e/specs/08-jellyfin.spec.js::a second sync reads back our own write and changes nothing", "backend/tests/test_seen_sync.py::test_each_linked_user_syncs_their_own_state", "backend/tests/test_seen_sync.py::test_one_users_action_is_pushed_under_their_own_token", "backend/tests/test_seen_sync.py::test_a_duplicate_copy_cannot_erase_an_explicit_seen", "backend/tests/test_seen_sync.py::test_a_duplicate_copy_marked_in_jellyfin_is_adopted", "backend/tests/test_seen_sync.py::test_an_action_taken_during_the_sweep_is_pushed_not_adopted", "backend/tests/test_seen_sync.py::test_an_owed_write_for_a_vanished_title_is_reported", "backend/tests/test_seen_sync.py::test_unseen_clears_every_copy_and_two_sweeps_leave_it_unseen", "backend/tests/test_seen_sync.py::test_the_representative_pointer_survives_six_sweeps_of_two_users_on_two_copies", "backend/tests/test_seen_sync.py::test_a_series_stays_seen_when_a_new_episode_recomputes_the_folder_flag"]
# The last three are M4.11's, and each is the echo loop this row forbids arriving by a route it
# did not consider. A second copy of the title keeps Jellyfin's Played flag after `unseen`, so
# the next sweep adopts it back and the person is reverted within fifteen minutes; the
# representative pointer followed whichever copy was Played, so it flipped every sweep with two
# users watching; and a Series folder's computed flag goes false the day a new episode lands,
# which un-marks a show nobody touched. All three are "reading back our own write changes
# nothing" -- asserted against one copy and no series, they were not. [M4.11, decision 210]

[[requirement]]
id = "jellyfin-acquisition-eval-seen-write-uses-per-user-token"
spec = "§7.3"
milestone = "M1"
kind = "backend"
what = "Setting `seen` in the app issues `POST /UserPlayedItems/{itemId}?userId=` and `unseen` issues `DELETE`, both authenticated with that linked user's own access token and never the admin API key; a 401 on the write marks that link as needing re-link and neither retries with the admin key nor silently drops the write."
why = "Jellyfin API keys are unscoped and admin-equivalent — there is no read-only variant — so write restraint is enforced by this app's code alone (§14 risk 3); a per-user token can only set its own state."
tests = ["backend/tests/test_jellyfin_client.py::test_a_played_write_uses_the_users_own_token", "backend/tests/test_jellyfin_client.py::test_the_admin_key_is_refused_on_a_played_write", "backend/tests/test_jellyfin_client.py::test_a_write_with_no_token_never_reaches_the_network", "backend/tests/test_jellyfin_client.py::test_one_users_token_cannot_write_another_users_state", "backend/tests/test_seen_sync.py::test_marking_seen_writes_played_with_the_users_own_token", "backend/tests/test_seen_sync.py::test_marking_unseen_issues_the_delete", "backend/tests/test_seen_sync.py::test_a_link_with_no_token_refuses_the_write_and_asks_for_a_re_link", "backend/tests/test_seen_sync.py::test_a_rejected_token_marks_the_link_and_keeps_the_write_owed", "e2e/specs/08-jellyfin.spec.js::a tap in the app arrives in jellyfin, under the per-user token", "backend/tests/test_seen_sync.py::test_a_link_with_no_token_is_not_promoted_to_linked", "backend/tests/test_seen_sync.py::test_an_unreachable_jellyfin_does_not_promote_a_broken_link", "backend/tests/test_seen_sync.py::test_a_tokenless_link_adopts_the_whole_library_and_never_stops_at_an_owed_row", "backend/tests/test_jellyfin_client.py::test_a_server_below_the_pin_refuses_the_played_write_by_name"]
# The last two are M4.11's. "Never retries with the admin key nor silently drops the write" had
# a third outcome nobody asserted: the sweep abandoned the rest of that member's reconciliation
# at the first owed row, so a link made without credentials adopted nothing for the life of the
