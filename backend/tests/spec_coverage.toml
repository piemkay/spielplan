id = "jellyfin-acquisition-eval-finish-prompt-banner-path"
spec = "§7.3 (with §12 M1, decision-doc proposal 150)"
milestone = "M1"
kind = "e2e"
what = "With push undeliverable, an armed finish prompt queues and appears as an in-app card on the user's next app open, naming exactly one title (\"Did you finish X?\"); its first tap writes `seen` for that user, and the card does not reappear on subsequent opens."
