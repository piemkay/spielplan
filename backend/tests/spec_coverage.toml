[[requirement]]
id = "library-rate-title-card-text-and-art-resolve-from-title-meta"
spec = "§4.1 (title_meta) + §6.0 (title detail card)"
milestone = "M4.5"
kind = "integration"
what = "The title card's overview, tagline, poster, backdrop and trailer key resolve from title_meta and title_video **per field**, by the priority order the corpus itself uses, treating NULL, empty string and zero as absent: a title whose preferred source carries no tagline takes the next source's tagline while keeping the preferred source's plot, and a title with no meta row renders the card without those fields rather than erroring. The order travels with the bundle rather than being hard-coded in the app."
why = "The corpus already resolves per field: mdc/export.py:34-45 walks SOURCE_PRIORITY (tmdb, omdb, trakt, tvmaze, wikipedia, jellyfin, wikidata, letterboxd, rottentomatoes, metacritic, mpst) with mpst last on purpose because its synopses give the ending away. Per field rather than per block because the sources are complementary, not ranked: tmdb carries tagline and poster and plot, omdb carries poster and no tagline, and wikipedia is the only source carrying plot_short — so a whole-block rule blanks fields another source has. §4.1's 'one block = one droppable source' is a storage invariant, not a rendering rule. Spielplan read flattened columns the bundle does not export, so all five fields have been NULL for every real title."
tests = [
