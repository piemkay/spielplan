[[requirement]]
id = "data-rules-empty-artifact-store-legal"
spec = "§4.3, §3.1"
milestone = "M0"
kind = "integration"
what = "Booting with no active artifact_bundle row — or with an active row whose directory is absent — leaves the app serving setup, auth and Library, and artifact-dependent endpoints return their documented no-bundle state rather than raising. Those two are not one state: no row at all is an EMPTY store and legal, while an active row whose directory is absent is a BROKEN install, so the boot and the no-bundle surfaces still happen while the model jobs refuse that bundle on a flag of its own and the admin bundle state names the missing path."
why = "§4.3/§3.1: an empty store is legal and a bundle-less app is a defined state, not an error path."
tests = ["e2e/specs/01-first-boot.spec.js::a bundle-less app boots, serves the wizard, and says so", "e2e/specs/01-first-boot.spec.js::Home renders the no-bundle state rather than an error", "backend/tests/test_artifact_store.py::test_empty_store_is_legal_and_says_so", "backend/tests/test_artifact_store.py::test_empty_store_refuses_to_hand_out_paths", "backend/tests/test_artifact_store.py::test_assert_matches_refuses_scoring_with_no_bundle_at_all", "backend/tests/test_model_basis.py::test_a_broken_store_carries_the_active_version_and_still_refuses_on_its_own_flag", "backend/tests/test_model_basis.py::test_the_admin_bundle_state_reports_broken_and_names_the_missing_path"]
# The added sentence splits a state this row had been carrying as one. `load_active` logged "a
# broken install, not an empty one" for an active row whose directory is gone and then returned
# `empty()`, which the worker mapped to None and fitted every board from `zero_embeddings` under
# DEFAULTS -- stamped with the active version, so `load_cache` then trusted the zero basis. The
# broken flag is a SECOND guard rather than a version comparison: once `load_active` carries the
# row's own version, `store.version == active_version` and the §10 invariant passes for a broken
# install, which is exactly why the refusal cannot rest on it. [M4.13, data-03]

