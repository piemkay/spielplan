what = "A guest seat cannot be opened for answering until the initiator's round has ended, and a second guest's round is refused while the first guest's is unfinished — the turns are sequential on the one device. When the phone passes, the incoming round renders none of the previous participant's pairs, answers or progress, and no control on that screen, browser back and in-round history entries included, reaches them. The same hand-off carries the BALLOT: once the initiator has submitted, the guest's approval ballot opens on that phone with none of the previous person's selections showing, and the reveal appears only after every seat has submitted."
