]

[[requirement]]
id = "tonight-rank-no-within-evening-reranking"
spec = "§6.2 step 6 (\"Votes *choose*\") + §0 row 4 (\"within-evening re-ranking is worth 0.000\")"
milestone = "M4"
kind = "backend"
what = "Nothing inside a running session re-ranks candidates by predicted enjoyment: a session's answers trigger no Ledger refit, incremental or full, and no recomputation of the step-3 pool ordering, which is computed once at session open and is identical at the reveal. Every movement between the first pair and the result traces to the participants' own answers — the tallies, the tilt and the split's facet zeroing — and to nothing else."
why = "Within-evening re-ranking by predicted enjoyment was measured at exactly 0.000, so it is CPU spent inside the one flow that has to feel instant, bought for nothing — and a refit mid-session would also let the evening's answers move the Ledger the evening is being scored against."
tests = [
    "backend/tests/test_tonight_combine.py::test_the_tonight_package_never_reaches_the_ledger_refit_or_the_serving_stack",
    "backend/tests/test_tonight_integration.py::test_starting_a_room_freezes_the_pool_it_was_built_from",
    "backend/tests/test_tonight_integration.py::test_the_slate_is_persisted_rather_than_recomputed_on_read",
]

