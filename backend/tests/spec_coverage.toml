]

[[requirement]]
id = "tonight-rank-cutpoints-learned-not-percentile"
spec = "§6.3 tiers + §5.2 arm 3"
milestone = "M3"
kind = "backend"
what = "The tier a title displays comes from the user's fitted cutpoints and not from percentile cuts of the current board: at K = 7 with no observations the implied level shares are §6.3's measured shape (F 3 / D 7 / C 15 / B 25 / A 25 / A+ 17 / S 8 %), and after observations that pile the population into two tiers the boundaries stay where the fit put them instead of being re-derived so the shares match the measured shape again."
why = "§6.3: \"learned cutpoints, not percentile cuts — initialised from DNA_MODEL §4.5's measured quantile shape …, then learned.\" The shape is an initialisation and a prior mean; a board that re-derives it on every render is a percentile cut wearing the spec's words, and the difference is only visible once a real board is lopsided."
tests = [
    "backend/tests/test_rank_board.py::test_an_unrated_tier_set_starts_at_the_measured_quantile_shape",
    "backend/tests/test_rank_board.py::test_the_tier_a_title_shows_comes_from_the_cutpoints_it_was_given",
    "backend/tests/test_rank_board.py::test_a_lopsided_board_keeps_its_learned_boundaries",
    "backend/tests/test_rank_board.py::test_the_board_renders_best_first_and_keeps_empty_tiers",
    "backend/tests/test_ledger_model.py::test_the_initial_cutpoints_carry_the_measured_tier_shape",
    "backend/tests/test_ledger_model.py::test_the_fitted_cutpoints_are_the_displayed_boundaries",
    "backend/tests/test_rank_board.py::test_a_tier_edit_above_the_new_tier_set_renders_instead_of_crashing",
]

[[requirement]]
id = "tonight-rank-queue-answer-sharpens"
spec = "§6.3 comparison queue + §12 M3 contents"
milestone = "M3"
kind = "e2e"
what = "The Rank board offers \"sharpen my ranking\"; opening it serves a pair, answering the pair writes exactly one duel with context='tier_queue' carrying its selection arm, and the board the person returns to has re-rendered from the updated Ledger."
why = "§12's M3 row lists the comparison queue among M3's contents and §6.3 names the control by that phrase. The selection policy and the stored arm each have a row; nothing asserted that a person can reach the queue and that answering it moves the board — which is what §12's exit criterion, a tier list both users endorse, is made of."
tests = [
    "e2e/specs/13-rank.spec.js::sharpen my ranking serves a pair, and answering it moves the board",
    "e2e/specs/13-rank.spec.js::the queue answer never lets the client name its own selection arm",
    "e2e/specs/13-rank.spec.js::the board carries its tiers, a why-line and the standing footnote",
]

# Added by M3's adversarial review. Both are requirements the map did not name and the code did
# not meet: three independent lenses reproduced the first as a 500 that the shipped e2e spec
# walks straight into, and the security lens found the second by comparing this surface's seal
# against §6.1's `card_token`, which it claimed to be equivalent to and was not.

[[requirement]]
id = "tonight-rank-board-survives-a-tier-set-change"
spec = "§6.3 board + decision 11"
milestone = "M3"
kind = "integration"
what = "After a tier set shrinks, every title whose last tier_edit names a level that no longer exists still renders — clamped to the top of the set the person now has, the same clamp the fit applies — and the board, its badges and its tension all read without raising."
why = "Decision 11 keeps tier_edit rows across a change in K, so a level outside 0..K-1 is a state the board is guaranteed to meet. `ledger.observations` clamps it for the fit and logs that it did; the board indexed the cutpoint array directly and 500ed for that person until they re-dropped every affected title."
tests = [
    "backend/tests/test_rank_board.py::test_a_tier_edit_above_the_new_tier_set_renders_instead_of_crashing",
    "backend/tests/test_rank_board.py::test_no_out_of_range_assignment_can_take_the_board_down",
    "backend/tests/test_rank_integration.py::test_a_shrunk_tier_set_still_fits_and_the_old_edits_still_count",
    "e2e/specs/13-rank.spec.js::the tier set is a per-user preference on the account page",
]

[[requirement]]
id = "tonight-rank-queue-pair-is-single-use"
spec = "§13 stream (a) + §6.1 card_token"
milestone = "M3"
kind = "integration"
what = "A comparison-queue pair can be answered exactly once: the sealed pair carries the number of comparisons the person had answered when it was drawn, a second answer under the same seal is refused with §6.1's 409 and writes no duel, and one person's seal is refused for another account."
why = "§13's agreement figure counts rows, so replaying one uniform-random pair weights a single judgement N-fold in the only data admitted to evaluate the tier model — and §4.2's tables are append-only, so a duplicate comparison cannot be taken back. §6.1 reaches the same property through `rate_session.card_token`; this surface claimed the equivalence without having it."
tests = [
    "backend/tests/test_rank_routes.py::test_a_pair_can_only_be_answered_once",
    "backend/tests/test_rank_routes.py::test_a_drop_does_not_invalidate_a_pair_on_the_table",
    "backend/tests/test_rank_routes.py::test_one_persons_sealed_pair_cannot_be_answered_by_another",
    "backend/tests/test_rank_routes.py::test_the_whole_rank_surface_is_behind_a_session",
    "e2e/specs/13-rank.spec.js::sharpen my ranking serves a pair, and answering it moves the board",
]

