[[requirement]]
id = "jellyfin-acquisition-eval-title-upsert-fill-never-clobber"
spec = "§7.1 (with §4.1 rules 6)"
milestone = "M1"
kind = "integration"
what = "A Jellyfin item whose ProviderIds carry imdb/tmdb/tvdb resolves to a `title` row by `title.id` and fills only NULL identity columns: an existing non-null `imdb_id`/`tmdb_id` is never overwritten, `jellyfin_id` is attached, and an item with no ProviderIds at all still upserts without error and without creating a duplicate title. Two owned titles sharing a `tmdb_id` both survive the upsert (no UNIQUE constraint on `tmdb_id`/`trakt_id`/slug)."
why = "`imdb_id` is NULL on 21% of titles so it can never be the join key, and 315 duplicate `tmdb_id` values exist legitimately (mostly movie/series pairs) — hence fill-never-clobber and §4.1 rule 6's ban on those UNIQUE constraints."
tests = ["backend/tests/test_jellyfin_resolve.py::test_imdb_id_resolves_across_kinds", "backend/tests/test_jellyfin_resolve.py::test_a_tmdb_match_is_qualified_by_kind", "backend/tests/test_jellyfin_resolve.py::test_an_item_with_no_provider_ids_falls_back_to_name_and_year", "backend/tests/test_jellyfin_resolve.py::test_a_null_identity_column_is_filled", "backend/tests/test_jellyfin_resolve.py::test_an_existing_identity_column_is_never_overwritten", "backend/tests/test_jellyfin_resolve.py::test_two_titles_sharing_a_tmdb_id_both_survive_the_upsert", "backend/tests/test_jellyfin_resolve.py::test_an_unresolvable_item_is_reported_and_creates_nothing", "backend/tests/test_jellyfin_resolve.py::test_reimporting_the_same_library_is_idempotent", "backend/tests/test_jellyfin_resolve.py::test_ownership_is_re_derived_not_trusted_stale", "backend/tests/test_seen_sync.py::test_an_unresolvable_jellyfin_item_is_reported_not_invented", "backend/tests/test_jellyfin_resolve.py::test_an_unchanged_row_is_not_rewritten", "backend/tests/test_jellyfin_resolve.py::test_a_changed_row_is_still_rewritten", "backend/tests/test_jellyfin_client.py::test_items_are_requested_recursively", "backend/tests/test_jellyfin_client.py::test_items_are_narrowed_to_movies_and_series", "backend/tests/test_jellyfin_client.py::test_the_field_set_is_actually_requested"]

[[requirement]]
id = "jellyfin-acquisition-eval-playback-arms-prompt-never-writes"
spec = "§7.3"
milestone = "M1"
kind = "integration"
what = "A Jellyfin session reaching ≥90% playback of a title arms a per-user finish prompt and leaves `user_title.state` untouched; only the user's explicit tap writes `seen`. Repeated polls of `/Sessions` over the same session arm the prompt exactly once, not once per poll."
why = "\"Jellyfin playback is a suggestion, never a silent write\" — inferred state must never outrank the person, and rating capture is measured against finished playbacks (§13)."
