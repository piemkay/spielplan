[[requirement]]
id = "platform-http-error-seam"
spec = "§4.1; §2"
milestone = "M4.7"
kind = "integration"
what = "The application-level handler renders a unique violation as 409 naming the constraint, a database connection failure as 503 JSON — refused, unresolvable, timed out, unroutable (EHOSTUNREACH/ENETUNREACH/ENETDOWN/EHOSTDOWN/ENETRESET) or refused by TLS — and any other PostgresError as 500, never a bare traceback; a filesystem OSError is not relabelled a database failure in the answer or in the log."
why = "The only handler was for PostgresError, so a refused connection at first boot escaped as a traceback; registered on the whole OSError family instead, it called an unwritable /data/artifacts a dead database. Narrowed back to exception classes it lost the other half: Python names a ConnectionError subclass only where the peer answered, so a host or network that cannot be reached at all, and a certificate that stopped verifying, escaped as 500 tracebacks again. The seam has to key on what the failure is, not on which of its shapes happens to have a class name. Later milestones need one place where a uniqueness conflict becomes a conflict status."
tests = [
    "backend/tests/test_http_seam.py::test_a_unique_violation_becomes_a_409_naming_the_constraint",
    "backend/tests/test_http_seam.py::test_the_unique_handler_wins_over_the_general_one",
    "backend/tests/test_http_seam.py::test_a_refused_connection_becomes_a_503_rather_than_a_traceback",
    "backend/tests/test_http_seam.py::test_every_shape_of_unreachable_becomes_a_503_not_only_the_three_with_class_names",
    "backend/tests/test_http_seam.py::test_a_filesystem_failure_is_not_reported_as_a_database_failure",
    "backend/tests/test_http_seam.py::test_both_new_handlers_carry_the_slid_session_cookie",
]

