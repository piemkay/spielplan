[[requirement]]
id = "platform-health-is-honest-under-a-dead-or-hung-database"
spec = "§1; §3.1"
milestone = "M4.7"
kind = "integration"
what = "/api/health answers 503 when Postgres is unreachable and within its own bound when Postgres hangs, and concurrent health probes cannot exhaust the pool: a request to another route is still answered while ten health probes are in flight against a blocked database, and a request that meets an already-exhausted pool is answered at the acquire bound rather than held — in words the acquire can stand behind, and with a WARNING naming the pool census, because the timeout cannot tell a saturated pool from a peer that has stopped answering. A health probe holds its pooled connection for two of its own bounds and not one."
why = "The container HEALTHCHECK, CI's wait loop and e2e/run.mjs all key on the status code, and an unbounded acquire converts \"slow database\" into \"every phone hangs\"."
# Two clauses from cycle 3. The acquire branch answered "database busy" and logged nothing at
# all, so an install on §2's supported external Postgres losing its route to it told both phones
# the database was busy — measured, `pool size 0 idle 0`, ten seconds spent inside asyncpg's
# connect — while the same peer *refusing* one second earlier reaches app.py's handler and logs
# "database unreachable" with its traceback. And the release is a third step nothing measured:
# asyncpg defaults `Pool.release`'s timeout to the acquire's and spends a whole one waiting for
# the out-of-band cancel, which is the 2x the constant's comment denied. [cycle 3 findings 7, 8]
tests = [
