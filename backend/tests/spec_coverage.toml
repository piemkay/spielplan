[[requirement]]
id = "platform-e2e-scaffolding-cannot-manufacture-a-verdict"
spec = "§10 (the swap sequence and the reset that precedes it); §12 (the browser suite is the evidence)"
milestone = "M4.8"
kind = "static"
what = "e2e/reset.mjs reads a `.env` value the way `docker compose` reads it — the trailing ` #` comment cut first, then one matching pair of quotes stripped — and the LAST assignment of a key winning, as it does for compose's dotenv and for python-dotenv — so every line of that file compose accepts reaches the PUBLIC_URL guard as the value the stack booted on, quoted or exported or commented or assigned twice or all four; and no browser spec leaves a wait whose REJECTION is the expected outcome unattached across an await, where the wait timing out before its handler arrives is an unhandled rejection rather than a passing assertion; and the shared seeding helper says of itself only what the tree gives it -- the 60 s fold-in tick is cited to the module that registers it rather than to a §5.3 table whose fold-in row reads nightly, and every spec still declaring a private copy of the createMember/signInAsMember pair is named there rather than covered by a claim that a repair made in the helper is a repair everywhere; and neither the project matrix's own reasoning nor the allowance that holds it names a spec file `e2e/specs` does not have."
why = "Review cycle 1 found both in this milestone's own new code, and both invert what the harness reports. The parser tested the whole right-hand side for quoting before cutting the comment, so `PUBLIC_URL=\"http://localhost:8080\" # dev` matched neither arm and the value arrived with its quotes still on: measured, the prefix guard one line above a `DROP DATABASE` then refused a development stack as not one, blaming the operator's value rather than the reader, and the e2e gate could not be run at all. 14-tonight's stray-write watcher created its `waitForRequest` and attached `.rejects` only after the Undo click it was racing, so a click slower than the 2 s window rejects with nothing listening and Playwright's worker fails whichever test is running with `Timeout 2000ms exceeded` against no assertion — on a run in which nothing was written to the host's seat. Review cycle 2 found the same reader returning at the FIRST line that mentions a key while every reader in compose's chain builds a map in file order: a `.env` with a second PUBLIC_URL appended under the first — the shape appending produces — boots the stack on the second and cleared the prefix guard on the first, deciding \"development stack\" one statement above `DROP DATABASE` from a line the stack is not running on. Review cycle 3: the wait guard was anchored on the literal receiver `page.`, so the rule this row states for every browser spec was enforced on sixteen of the eighteen -- 15-tonight-group.spec.js:31-33 binds its two pages as `a` and `b` and already carries the read-side twin of 14-tonight's negative at :177, and 18-system.spec.js:46,52 binds `admin` and already calls `admin.waitForResponse(`. The widened receiver reports nothing across all eighteen shipped specs; a computed receiver is still missed and no spec writes one. Review cycle 3 found the same shape twice more in this milestone's own new text, in the file five specs seed through. waitForPool's rewritten timeout message printed `§5.3 folds in every 60 s`, and §5.3's jobs table gives the fold-in a nightly cadence: worker.py:384-388 says so over the registration in as many words and registers fold-in-user-vectors at every=86400 two lines above the tick, so the message named the wrong one of two registered jobs whose cadences differ by a factor of 1440, and sent the reader of a 120 s timeout to a table against which its arithmetic cannot be checked -- the ceiling with no derivation behind it that the rewrite existed to remove. And signInAsMember's new comment claimed decision 186 had left one seeding path and that a repair made there is a repair everywhere, while 11-rate.spec.js:209-230 still declares a copy of the pair that decision 186's own Cost paragraph keeps deliberately -- and this milestone's `reuse` is the standing counterexample, having landed in the helper without reaching 11-rate, which still mints a member per run. [M4.8 review cycle 3: m48-c3-foldin-citation, m48-c3-one-path-overclaim]"
tests = ["backend/tests/test_harness_contracts.py::test_the_reset_parser_reads_the_values_compose_reads", "backend/tests/test_harness_contracts.py::test_the_reset_parser_harness_sees_the_order_that_shipped", "backend/tests/test_harness_contracts.py::test_the_reset_parser_resolves_a_key_the_way_the_stack_that_booted_did", "backend/tests/test_harness_contracts.py::test_no_wait_whose_rejection_is_expected_is_attached_after_an_await", "backend/tests/test_harness_contracts.py::test_the_unattached_rejection_guard_sees_a_wait_that_can_out_run_its_handler", "backend/tests/test_harness_contracts.py::test_no_fold_in_cadence_is_attributed_to_a_section_that_does_not_give_it", "backend/tests/test_harness_contracts.py::test_the_fold_in_citation_guard_sees_a_cadence_the_section_does_not_give", "backend/tests/test_harness_contracts.py::test_the_shared_seeding_helper_names_every_private_copy_of_its_pair", "backend/tests/test_harness_contracts.py::test_the_seeding_reach_guard_sees_a_claim_the_spec_directory_contradicts", "backend/tests/test_harness_contracts.py::test_the_harness_names_no_spec_file_that_does_not_exist", "backend/tests/test_harness_contracts.py::test_the_spec_name_guard_sees_a_comment_that_outlived_its_file"]
# Review cycle 1 of M4.12 found the same class in the prose that funds the project matrix. Decision
# 165 retires the TV client, so its route, its spec and its coverage row went in one change -- and
# `playwright.config.js:77` went on giving "16-tonight-tv is a television" as one of the two reasons
# the phone project's `testMatch` is shaped the way it is. That comment is what a maintainer reads
# when deciding whether a new Tonight spec belongs on the phone, and the exit criterion's own grep
