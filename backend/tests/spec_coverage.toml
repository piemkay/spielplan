# contents and no row had one, §6.3's neighbourhood badge and its "learned cutpoints, not
# percentile cuts" had no row either, and nothing asserted that a person can reach the
# comparison queue at all. Same routine that added M1's tenth row and M2's two.

[[requirement]]
id = "tonight-rank-board-filters"
spec = "§6.3 Filters (with §4.1 rules 1, 2, 5)"
milestone = "M3"
kind = "integration"
what = "The Rank board filters on genre, decade, runtime and seen-state, and on a DNA predicate written either bare (`cosy`) or facet-qualified (`mood.cosy`); the predicate matches rows of both DNA tiers and every survivor still reports which tier matched it; no filter applies a threshold to salience, confidence or n_sources; each filter narrows on its own, combining them intersects, and none of them suspends the kind partition."
why = "§12's M3 row names \"filters\" as M3 contents and §6.3 names six dimensions, two of which (runtime, DNA facet/term) the M0 catalog filter does not have. `dna_tag` stores the bare term, so the qualified form is built at query time; §4.1 rule 2 forbids the confidence cut the obvious implementation reaches for, and rule 1 forbids answering the predicate from a union that has lost the tier."
tests = []

[[requirement]]
id = "tonight-rank-neighbourhood-badge"
spec = "§6.3 badges"
milestone = "M3"
