[[requirement]]
id = "platform-required-config-refuses-boot"
spec = "§2 Configuration"
milestone = "M0"
kind = "backend"
what = "Startup config validation rejects a missing or empty PUBLIC_URL, and secret-dependent connectors refuse to initialise when SECRETS_KEY is absent — never falling back to SESSION_SECRET or a derived key. The template states the URL-safety the one database password now requires, because docker-compose.yml interpolates it into DATABASE_URL — and the .env the e2e job writes is the one .env.example produces, so that interpolation is evaluated by a real stack on every run rather than first on a household's box at first boot. And the suite that asserts all of this runs with the refusals armed rather than under the one flag that lifts them — a flag the shipped stack forwards by no route, so it cannot be switched on by editing .env, and whose off-by-default is read off the field rather than off the value the suite pins into the environment."
why = "§2: PUBLIC_URL is required because WebAuthn binds credentials to the origin; §2 explicitly forbids the SESSION_SECRET fallback for connector secrets."
# The last clause is ops-12's other half. Declaring the password once made docker-compose.yml the
# thing that builds the DSN out of it, so a character with a URL meaning now produces a Postgres
# that holds the password beside a backend that cannot send it — the same first-boot failure the
# two-field version produced, through the field the fix made authoritative. Compose cannot encode
# it and a second field is what step 8 removed, so the note is the mitigation and the guard is
# what keeps it attached to the value it is about. [M4.7 ops-12]
#
# The last clause of the `what` is this row's own instrument. Decision 181 gave §2's refusals one
# global off-switch and README's "Developing" paragraph hands it to the developer beside the
# statement that a hand-run backend reads `.env` from its working directory — which is where
# pytest runs from. With `SPIELPLAN_INSECURE_DEV` set there or exported, eight of the `test_config`
# tests below cannot fail, and neither can `test_http_seam.py`'s anonymous-schema assertion four
# files away. `conftest.py` now sets it to "0" at import (the environment outranks `.env`, so a
# `pop` would not have reached the `.env` route), and the last test named here is what says so.
#
# Cycle 3 found the two ends of that same flag unasserted. README tells the operator compose
# "deliberately does not forward it, so it cannot be switched on in the shipped stack by editing
# `.env`" — the strongest security claim this milestone makes about that file, and the only compose
# claim in README with nothing reading compose: the variable appears in eight files here and none
# of them opened `docker-compose.yml`, so adding it to the env anchor broke the sentence and no
# test. Measured: with the anchor forwarding it, `test_static_contracts.py` is 93 passed and the
# one failure is the new guard. And `test_the_flag_is_off_unless_it_is_set` asserted the flag's
# default against `conftest.py`'s pinned "0" rather than against `Settings` — flipping the field
# to `default=True` left the whole file green, which is a §2 refusal turned off in every container
# with nothing red. It now deletes both sources (the environment and `env_file=".env"`) and reads
# the field. [cycle 3 findings 6, 14]
tests = ["backend/tests/test_static_contracts.py::test_the_stack_refuses_to_start_without_its_required_config",
    "backend/tests/test_static_contracts.py::test_env_example_says_the_password_it_asks_for_is_interpolated_into_a_url",
    "backend/tests/test_static_contracts.py::test_the_password_note_guard_sees_the_note_go_missing",
    # ops-12's other half again, one level up: declaring the password once only helps if the URL
    # compose builds out of it is ever built. CI wrote its own DATABASE_URL into the .env it
    # generates, which short-circuits `${DATABASE_URL:-...}` in every e2e run, so the expression a
    # household runs on had never been evaluated anywhere in this repository.
    "backend/tests/test_operator_runbook.py::test_the_e2e_job_runs_on_the_database_url_the_compose_file_builds",
    "backend/tests/test_operator_runbook.py::test_the_generated_env_guard_sees_the_pinned_url_come_back",
    "backend/tests/test_secrets.py::test_secrets_key_never_falls_back_to_session_secret", "backend/tests/test_config.py::test_an_empty_public_url_is_refused_by_name", "backend/tests/test_config.py::test_a_bare_hostname_is_refused_because_it_is_not_an_origin", "backend/tests/test_config.py::test_a_non_http_scheme_is_refused", "backend/tests/test_config.py::test_a_real_public_url_still_yields_its_rp_id", "backend/tests/test_config.py::test_a_short_session_secret_is_refused_and_names_the_generator", "backend/tests/test_config.py::test_an_empty_session_secret_is_refused", "backend/tests/test_config.py::test_a_short_secrets_key_is_refused", "backend/tests/test_config.py::test_an_absent_secrets_key_stays_legal", "backend/tests/test_config.py::test_every_problem_is_reported_at_once", "backend/tests/test_config.py::test_the_dev_flag_lifts_the_refusals_and_says_so_loudly", "backend/tests/test_config.py::test_the_flag_is_off_unless_it_is_set", "backend/tests/test_static_contracts.py::test_the_suite_itself_runs_with_the_config_refusals_armed",
    "backend/tests/test_config.py::test_the_default_guard_sees_a_flag_that_defaults_to_on",
    "backend/tests/test_static_contracts.py::test_the_shipped_stack_withholds_the_switch_that_turns_the_refusals_off",
    "backend/tests/test_static_contracts.py::test_the_dev_flag_guard_sees_each_way_the_variable_could_arrive"]

