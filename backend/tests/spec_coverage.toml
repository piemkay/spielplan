# --- M4.10: the verdict path and the tier board (decisions 199-208; M4.10-plan.md) ----------
#
# One milestone because one shape, at four seams: `rate/session.py` and `api/rank.py` are the two
# surfaces that write the Personal Ledger, and each guards its write with a read, then some work,
# then a write, on a connection that autocommits every statement — the Rank queue seal, the Rate
# card token, the skip journal append, and the tier-set PUT racing the worker's refit. The project
# already owns the idiom that fixes all four (`tonight/play.py`'s two-int `pg_advisory_xact_lock`)
# and uses it in exactly one place. The second half is the same story from the other end: the Rate
# seam catches a refusing refit on purpose and the two Rank routes call it bare, after the
# observation is durable, so one surface loses the tap and each retry writes another append-only
# row. One agent applying one idiom at four seams writes one diff; four agents write four
# incompatible transaction shapes into the same handler.
#
# The rows below land BEFORE the code, with no `tests` key, so the gate's red list is the milestone's
# test plan and says which rows are still owed rather than which test names were guessed at. Each
# stage fills in its own row's `tests` as the tests land. The list is closed by writing them — never
# by a waiver, never by lowering `current_milestone`. `docs/TESTING.md`'s ledger block is re-pasted
# whenever this report changes, which is what `test_the_testing_ledger_publishes_the_counts_the_gate_prints`
# is for.
#
# Nine earlier rows are amended in place above rather than duplicated here: the concurrency clause on
# `tonight-rank-queue-pair-is-single-use`, the adjacency and nearer-cut clauses on
# `tonight-rank-straddle-equals-eligible`, the chip clause on `tonight-rank-neighbourhood-badge`, the
# whole-pool exploration anchor on `tonight-rank-queue-selection-mix`, the no-duel and filtered-board
# clauses on `tonight-rank-drop-writes-observations` and `tonight-rank-tap-to-tier-and-cancel`, the
# kind filter and the dead `mode` parameter on `library-rate-pending-verdicts-banner`, the block
# boundary on `library-rate-mix-alternates-blocks`, and undo's commit point on
# `library-rate-undo-block-depth`. A defect under a row that already states the requirement is that
# row's to assert; a new row is for a requirement the map was missing.
# `jellyfin-acquisition-eval-cpu-job-budgets` is deliberately NOT amended: the inline-MAP-fit clause
# is claimed once, by `tonight-rank-no-route-raises-after-its-observation-commits` below.
#
# Findings 27 and 28 (Rank carrying film filters onto the Series board; the long-press duel bound to
# an outcome rather than to a card) get real vitest tests and no row, under decision 206: both are
# defects under existing rows, and the exit criterion fixes this milestone's count at ten.
#
# CLOSED: all ten carry tests, no row carries a waiver, and `current_milestone` was never lowered.
# Two rows cross a file the reader would not guess from the id, and each says so in its own comment:
# the hyperparams row is asserted in `test_ledger_hyperparams.py` and `test_rank_routes.py` because
# its `what` names a route in each router, and the no-raise row reaches `test_home.py` because the
# rail-line half of it was repaired in `home/rail.py`.

# Three findings, one repair: the card is claimed under a row lock as the first statement inside the
# transaction the write already opens, and the refusal leaves through §6.1's own 409. One correction
# to the plan's text, measured rather than inherited: since M4.7 `app.py` renders an
# `asyncpg.UniqueViolationError` as a 409 naming the constraint, so the loser's answer was no longer
# the blanket `500 {"detail": "database error"}` finding 2 describes — it was `409 "conflict:
# rate_observation_seq"`, a reason in no stale set the client knows, logged as "unique violation
# reached the application handler". The repair still stands on the other half of the finding, which
# that handler cannot reach: the loser's Jellyfin Played write has already gone out by the time the
# constraint fires, because the push was inside the transaction (finding 11).
# [M4.10 findings 2, 3, 4, 7: dd08-rate-tap-race-answers-500-instead-of-409,
# ml12-double-tap-500-not-409, rrh-lifecycle-07-skip-append-not-transactional-wedges-session,
# rrh-lifecycle-09-ensure-card-not-idempotent-under-concurrent-gets,
# ti-11-no-double-submit-coverage-anywhere]

[[requirement]]
