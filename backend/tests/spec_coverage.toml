[[requirement]]
id = "tonight-rank-holdout-one-in-ten"
spec = "§6.2 step 4 (rewritten, 54b)"
milestone = "M4"
kind = "backend"
what = "A pair a participant is served is drawn uniformly at random from the candidate pool at a rate of one in ten - a rate, not a fixed slot schedule, so a round ended by the escape still carries hold-outs - and stored with selection='uniform_holdout'. The draw is sealed: the pair and its card token are identical on every read of that seat's round at that answer count, and a token minted for that seat and count names that pair and no other. Replaying the round with the hold-out answers removed produces the identical shortlist and the identical stopping point."
why = "§13's uniform-random guard is non-negotiable — adaptive pairs inflate reliability, and a stopping rule that shares data with its own evaluation looks confident whether or not it is right."
tests = [
    "backend/tests/test_tonight_round.py::test_one_pair_in_ten_is_the_uniform_hold_out_and_it_is_a_rate_not_a_slot",
    "backend/tests/test_tonight_round.py::test_the_hold_out_pair_is_drawn_uniformly_from_the_whole_pool",
    "backend/tests/test_tonight_round.py::test_the_hold_out_arm_never_receives_a_fallback",
    "backend/tests/test_tonight_round.py::test_the_round_replays_identically_with_the_hold_out_answers_removed",
    "backend/tests/test_tonight_integration.py::test_a_held_out_answer_is_stored_as_held_out_and_moves_no_tilt",
    "backend/tests/test_tonight_integration.py::test_the_shortlist_is_identical_with_the_held_out_answers_removed",
    # M4.12: the two seal tests, and the reason this row's own `what` had to be restated. It said
    # "every tenth pair", which is the implementation the build shipped rather than 54b's rate --
    # so the row asserted the defect, and the escaped round's empty stream was invisible to it
    # (finding 30). The draw's stability is the other half the row never asked for: nothing here
    # named the card TOKEN, and twelve of them were mintable for one seat at one count (finding
    # 28). Both halves now live in `tonight-rank-holdout-is-sealed-and-is-a-rate` as well, which is
    # where the measurement of each is argued (decision 223).
    "backend/tests/test_tonight_integration.py::test_twelve_reads_of_the_arms_card_return_one_pair_and_one_token",
    "backend/tests/test_tonight_integration.py::test_the_card_a_phone_stashed_is_the_card_the_undo_re_issues",
    # And the negative the seal is only half of. 54f's solo round is stateless, so the client
    # hands its own answers back -- and a body that accepted a `selection` field would let a
    # phone move one of them into or out of §13's admissible stream, which is the same defect
    # as a mintable token arriving by another door. `SoloAnswer` has no such field and this
    # pins that it never gains one. Registered here rather than under M4.12's own seal row
    # because the requirement it holds is this row's sentence, not that row's repair.
    "backend/tests/test_tonight_routes.py::test_the_arm_is_still_the_servers_and_never_the_clients",
]

