# Two findings that look like a gating bug and a caching bug and are one fact: the arm was drawn
# fresh on every GET from an unseeded generator and then shipped to the client. Gated, because
# decision 117 puts every model-internal label behind the toggle and this one tells the person which
# of their answers do not count; stable, because §13's guard is about the hold-out RATE, and a rate
# that moves with the reload count is a rate the evaluation cannot divide by. The arm now derives
# from the same `(user, kind, answered)` the seal carries, through an HMAC over the session secret —
# so it is reproducible for a given board state without being guessable by the client, and the one
# thing that changes it is an answer. The arm moves under `pair.model`, where `rail.redact` already
# knows to strip it; the pair keeps one arm-independent reason, so the surface still says why.
# [M4.10 findings 15, 16: dd13-rank-queue-arm-and-pair-rerolled-per-get,
# cs-15-tier-queue-arm-and-reason-ungated; decision 117]

[[requirement]]
id = "tonight-rank-queue-arm-is-gated-and-the-pair-is-stable"
spec = "decision 117 (\"the selection label in the tier queue\") + §13's non-negotiable guard + §6.3"
milestone = "M4.10"
kind = "integration"
what = "`GET /api/rank/queue` returns no `arm` and no arm-naming reason to a member whose model toggle is off — the payload is identical under `rail.redact` — and the user-facing reason never says a pair is held out; thirty consecutive GETs without answering return the identical pair and token, and answering one changes it."
why = "The one Rank route that calls neither `visible_to` nor `redact` ships the arm and the sentence \"this pair never tunes the model\" to every member, which tells the person which answers do not count; and because the arm is re-rolled per GET, a client can reload into or out of the §13 stream, making the hold-out *rate* a function of the reload count rather than independent of the model."
tests = [
    "backend/tests/test_rank_routes.py::test_the_queue_ships_no_arm_to_a_member_who_cannot_see_the_model",
    "backend/tests/test_rank_routes.py::test_thirty_draws_return_one_pair_until_it_is_answered",
    "backend/tests/test_rank_routes.py::test_the_answer_route_writes_the_arm_the_server_drew_it_under",
]

