[[requirement]]
id = "tonight-rank-solo-lands-on-picks"
spec = "§6.2 step 8 (rewritten, 54f)"
milestone = "M4"
kind = "e2e"
what = "Solo opens directly on three picks and a wildcard ranked by the personal Ledger with no tilt, with no pair round and no ballot anywhere in the flow; 'sharpen this' runs the adaptive round and re-ranks in place, after which the provenance line reads 'tilted by your N answers' instead of 'unseen first'."
