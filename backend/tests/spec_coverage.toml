    "backend/tests/test_worker_jobs.py::test_every_job_this_loop_fires_declares_a_budget_that_fits_inside_its_interval",
    "backend/tests/test_worker_jobs.py::test_a_job_that_never_returns_is_abandoned_at_its_budget_and_the_tick_goes_on",
    "backend/tests/test_static_contracts.py::test_the_tick_does_not_argue_its_budget_against_a_healthcheck_the_compose_file_denies",
    "backend/tests/test_seen_sync.py::test_a_second_sweep_while_one_is_running_does_nothing",
    "backend/tests/test_jellyfin_link.py::test_sync_now_says_a_sweep_is_already_running_rather_than_starting_a_second",
]
# Three independent ways the sweep could take the worker down, so three layers: the page walk
# that must terminate, the tick that must abandon a job that does not, and the lock that keeps
# two sweeps of one user from interleaving. The short-page test and the route test both pass
# against the unfixed code and are named anyway -- the first guards the exit the cap must not
# break, the second pins the body the admin card prints for a held lock. The repeated-page test
# is named because the two bounds cover different servers and the count silently covered neither:
# the cap now answers only the server that never ends, and the honest-count-plus-cached-page-one
# server -- the one MAX_PAGES was written for -- is caught one page in. The static guard is the
# fourth layer and the only one that can hold prose: the argument for the timeout claimed a wedged
# loop leaves "every healthcheck green", which docker-compose.yml denies -- it reads the age of
# the heartbeat `_tick` touches once per pass, above the job loop -- so a reader sizing these
# budgets would have concluded that nothing detects a wedged worker at all. [M4.11, §5.3; review
# cycle 1: m411-rev-jf-01, m411-rev1-tick-comment-claims-a-green-healthcheck]
#
# The short page got the same treatment as the repeated one for the same reason and one cycle
# later: the count was only ever used to stop the walk EARLY, so a page shorter than `Limit`
# ended it however many rows that same page said were left. The no-Id test beside it is the
# control on the unit the new raise counts in -- rows kept, never distinct ids, because one
# corrupt row would otherwise abort every sweep for ever on a healthy server.
# [review cycle 2: m411-rev2-resolve-01, m411-rev2-jf-01]

[[requirement]]
id = "jellyfin-sync-the-server-version-gates-the-played-write"
spec = "§7.1 (\"Pin Jellyfin >= 10.9\")"
milestone = "M4.11"
kind = "integration"
what = "The probed server version and its verdict are stored on the connector and re-read by the sweep; a server below 10.9 refuses the Played write with a reason naming the route and the version, counts it as a failed push, and does not mark the link as needing a re-link; a server that reports no version at all is stored and rendered as unknown rather than as below the pin, and its writes are attempted. The admin copy names the write, not the reads."
why = "§7.1 pins >= 10.9 because `/UserPlayedItems` is the 10.9 route; an advisory pin let a 10.8 install 404 every write for ever while every visible check passed. The unknown is the same gate misfiring the other way: `/System/Info/Public` is tokenless and is the endpoint hardening guides block, so a 200 with no parseable version made a current server refuse every write locally, for ever, in a message naming no version."
tests = [
    "backend/tests/test_jellyfin_client.py::test_the_probe_reports_the_version_and_the_verdict",
    "backend/tests/test_jellyfin_client.py::test_a_server_that_reports_no_version_is_unknown_and_not_below_the_pin",
    "backend/tests/test_jellyfin_client.py::test_a_server_below_the_pin_refuses_the_played_write_by_name",
    "backend/tests/test_connector_registry.py::test_the_probed_version_is_stored_beside_the_url_not_in_the_secret",
    "backend/tests/test_jellyfin_link.py::test_the_probed_version_and_its_verdict_are_stored_by_save_and_by_test",
    "backend/tests/test_seen_sync.py::test_a_server_below_the_pin_counts_a_failed_push_and_never_a_re_link",
    "backend/tests/test_static_contracts.py::test_the_below_pin_copy_names_the_played_write_and_not_the_reads",
]
# The chain end to end, because §7.1's pin is only a gate if every link holds: probe, store it
# beside the url rather than inside the sealed secret, re-read it on both routes that save, and
# refuse the write with a reason naming the route -- counted as a failed push and never as a
# credential problem, which is the distinction §7.3 draws. [M4.11]
#
# The unknown-version test is parametrized over the three shapes `_request` collapses into `{}`
# (empty body, unparseable body, no `Version` key) because they are one state with three causes
# and the old code answered all three with `False`. It asserts the negative -- no refusal --
# which is the half `played_write_refusal`'s own docstring argues for: a refusal is only ever
# raised on a version the app can quote. [review cycle 1: m411-rev-jf-04]
#
# "The admin copy names the write, not the reads" is this row's last sentence and had no id
# behind it: `..._refuses_the_played_write_by_name` holds the CONNECTOR's refusal string, which
# is a different string in a different file and drifts from the card freely. The static guard is
# the registrable layer for a Svelte-source clause -- M4.9's cold-badge guard is the precedent --
# and it reads both printings of the sentence, the stored verdict and the fresh probe,
# because repairing one of them left the other saying "reads may miss fields".
# [review cycle 2: m411-c2-cov-01]

[[requirement]]
id = "jellyfin-connector-secrets-are-serialised-and-never-repr"
spec = "§14.3 + §2 (custody)"
milestone = "M4.11"
kind = "integration"
what = "Two Jellyfin links issued concurrently both store their token and the connector reports both users linked; no dataclass field named `api_key`, `token` or `user_tokens` under `connectors/`, `sync/` or `push/` -- every package a §7.3 or §14.3 credential is carried through -- appears in that object's `repr`."
why = "§14.3 makes the API key admin-equivalent on the whole media server and the per-user tokens real credentials; a lost token produces an account the admin table calls linked that cannot write, and a default repr copies both into any traceback."
tests = [
    "backend/tests/test_connector_registry.py::test_a_for_update_load_locks_the_connector_row",
    "backend/tests/test_connector_registry.py::test_two_links_at_once_keep_both_tokens",
    "backend/tests/test_jellyfin_link.py::test_two_members_linked_at_the_same_time_both_keep_their_token",
    "backend/tests/test_jellyfin_link.py::test_linking_an_account_while_it_is_being_unlinked_does_not_deadlock",
    "backend/tests/test_connector_registry.py::test_no_connector_credential_survives_a_repr",
    "backend/tests/test_static_contracts.py::test_no_connector_credential_is_printed_by_a_generated_repr",
    "backend/tests/test_static_contracts.py::test_the_connector_repr_guard_sees_a_repr_enabled_field_on_a_real_dataclass",
    "backend/tests/test_static_contracts.py::test_the_connector_repr_guard_catches_each_way_a_field_is_declared",
]
# Two halves, and the second is named three times because a repr leak cannot be tested for in
# general: the dataclass test catches today's three fields by name, the ast sweep catches the
# next credential field somebody adds, and the parametrized self-test is what keeps the sweep
# able to fail at all. The deadlock test belongs to the serialisation half: the route now takes
# `app_user` and then the connector row, which is `seen.unlink`'s order, and the adjacent buttons
# of §6.6's mapping table name the same account. [M4.11, §14.3]
#
# The sweep reads three packages because the rule is about the credential and not about a
# directory: scoped to `connectors/` it read green while `sync/seen.py`'s `LinkedUser.token` --
# the only field in the codebase actually named `token`, holding one member's decrypted access
# token for the whole of their sweep -- sat at default repr one directory over.
# [review cycle 1: m411-rev-jf-02]

[[requirement]]
id = "jellyfin-playback-an-episode-session-arms-its-series-prompt"
spec = "§7.3 + decision 210"
milestone = "M4.11"
kind = "integration"
what = "A `/Sessions` row whose `NowPlayingItem` is an Episode carrying `SeriesId` arms the finish prompt for that series and reports nothing unresolved; the test double emits the Episode shape a real server sends, never the Series folder item. An episode whose series list cannot be read is reported as `undecided` with its own operator sentence, never as a session that matched no title."
why = "§7.3's prompt is the whole capture path for television, and the fake reported a shape Jellyfin never emits, so the M1 exit criterion and e2e 08 certified a behaviour that existed only against the double (decision 210)."
tests = [
    "backend/tests/test_playback_prompt.py::test_an_episode_session_arms_the_prompt_for_its_series",
    "backend/tests/test_playback_prompt.py::test_a_mid_series_episode_arms_nothing",
    "backend/tests/test_playback_prompt.py::test_an_episode_whose_series_cannot_be_listed_arms_nothing_and_is_reported",
    "backend/tests/test_jellyfin_client.py::test_sessions_reduce_to_what_is_playing",
    "backend/tests/test_jellyfin_client.py::test_the_episode_list_is_read_once_per_series",
    "backend/tests/test_worker_jobs.py::test_a_playback_session_that_matched_no_title_is_named_in_the_log",
    "backend/tests/test_worker_jobs.py::test_the_same_unresolvable_session_is_named_once_and_not_once_a_minute",
    "backend/tests/test_worker_jobs.py::test_a_television_session_whose_series_could_not_be_listed_gets_its_own_sentence",
    "e2e/specs/08-jellyfin.spec.js::finishing a title arms a prompt that surfaces on the next app open",
]
# The e2e case is an M1 title whose body this milestone rewrote rather than replaced: the session
# it forces is now the Episode shape a real server sends, and it asserts `unresolved == []` --
# which is the assertion the old double made impossible, since a Series folder item resolved and
# an Episode did not. That is why the row names it: the browser layer is where the double and the
# app meet, and the defect was that they agreed on a shape Jellyfin never emits. The worker test
# is the other side of `unresolved` -- an honest count nobody prints is a count nobody reads.
# [M4.11, decision 210]
#
# The repetition test is the cost of that line, asserted because the producing condition is
# persistent rather than momentary: `_observe` re-derives `unresolved` every pass and writes
# nothing, so one paused session put the identical line into the log once a minute -- ops-15's
# own arithmetic, in the job ops-15 did not cover.
# [review cycle 1: m411-rev1-unresolved-session-logs-a-line-a-minute]
#
# The undecided test is the other half of that same line. `observe` put two outcomes into one
# list, and the sentence the operator reads asserts the first: "matched no title", whose repair
# is an import or a provider id. For a session that resolved perfectly and whose series list the
# server would not give up, every clause of that is false -- so it is its own list, its own
# sentence, and its own memo. [review cycle 2: m411-rev2-pb-02]

[[requirement]]
id = "jellyfin-playback-a-dismissed-prompt-stays-dismissed"
spec = "§7.3 (\"one tap sets seen\") + decision 211"
milestone = "M4.11"
kind = "integration"
what = "Answering a finish prompt 'no' writes `unseen` as an explicit action and leaves the prompt closed for that viewing: later polls of the same Jellyfin session arm nothing and send no further notification, while the same title played again in a new session asks again."
why = "§7.3 gives one prompt per viewing and `answer`'s own rule says a card that comes back after being dismissed teaches people to ignore the banner; `jf_session_id` is what distinguishes the viewing from the rewatch, and decision 211 makes the decline a fact rather than an absence the next sweep can overwrite with Jellyfin's Played flag."
tests = [
    "backend/tests/test_playback_prompt.py::test_a_dismissed_viewing_is_not_re_armed_and_sends_no_second_push",
    "backend/tests/test_playback_prompt.py::test_answering_no_writes_unseen",
    "backend/tests/test_state_routes.py::test_declining_the_prompt_writes_unseen_and_closes_it",
    "backend/tests/test_playback_prompt.py::test_a_rewatch_in_a_new_viewing_asks_again",
    "e2e/specs/08-jellyfin.spec.js::a declined viewing stays declined, and only a new viewing asks again",
]
# The rewatch test is the boundary and is named as carefully as the rule: the dismissal guard is
# keyed on `jf_session_id`, so it must refuse the viewing and not the (user, title) pair for ever.
# It passes against the unfixed code by design -- it is the control on a guard that would
# otherwise be indistinguishable from a ban. Its name changed in this milestone, from
# `test_a_rewatch_on_the_same_device_asks_again`, because `SessionInfo.Id` is stable per device
# (`0006_jellyfin.sql:29-37`) and the same-device rewatch is the cost decision 211's SQL takes.
# [M4.11, decision 211]

[[requirement]]
id = "jellyfin-playback-the-answer-is-durable-before-the-prompt-is-consumed"
spec = "§7.3 + §13"
milestone = "M4.11"
kind = "integration"
what = "If the seen write fails while answering a prompt 'yes', the prompt is still open afterwards; a successful answer marks the title seen and closes the prompt exactly once."
why = "§13 measures rating capture against finished playbacks, so a tap that loses both the state and the question subtracts from the numerator with no trace."
tests = [
    "backend/tests/test_playback_prompt.py::test_the_state_write_lands_before_the_prompt_is_consumed",
    "backend/tests/test_playback_prompt.py::test_an_answer_whose_state_write_fails_leaves_the_prompt_open",
    "backend/tests/test_playback_prompt.py::test_an_answered_prompt_does_not_come_back",
    "backend/tests/test_state_routes.py::test_answering_a_prompt_twice_is_a_404",
]
# The route test is named beside the three state tests because "closes the prompt exactly once" is
# a claim about what a second tap gets, and only the route can answer that: §13's denominator is
# `playback_event WHERE finished`, so a prompt answered twice is a rating the instrument counts
# twice. The ordering test is the falsifier for the rest -- the write was issued after the prompt
# was consumed, so a failed write lost both the state and the question with no trace. [M4.11, §13]

[[requirement]]
id = "push-a-second-device-registers-independently"
spec = "§4.2 push_subscription + §6 preamble (per-device onboarding)"
milestone = "M4.11"
kind = "e2e"
what = "A member whose account already has a registered device opens the app in a browser holding no push subscription of its own: the onboarding section reads off and offers the enable control, and its disable control is not the only thing on screen; turning notifications off on one device leaves the other device's row intact."
why = "§6's preamble makes install and notifications per-device, and §4.2 keys the table on the member; reading the member's whole device list as 'this device' meant only the first phone each member registered could ever receive a push."
tests = [
    "e2e/specs/12-onboarding.spec.js::a browser holding no subscription of its own reads off and is offered the switch",
    "e2e/specs/12-onboarding.spec.js::turning notifications off on one device leaves the other one registered",
]
# e2e and nothing else, deliberately. The fault is that the screen read the member's device list
# where it needed this browser's own subscription, and the only layer that holds two genuinely
# separate browser states is a second browser context. The vitest beside `push.js` asserts the
# same rule against a stubbed `pushManager` and is the fast local check, not the evidence: a
# stub that answers `null` because the test said so cannot tell anyone whether a real second
# phone reads off. [M4.11]

