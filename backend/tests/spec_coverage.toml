[[requirement]]
id = "platform-pin-session-cannot-mint-credentials"
spec = "§3.2 (PIN is a convenience, password the credential)"
milestone = "M4.6"
kind = "integration"
what = "A session created by `POST /api/auth/switch` is refused with 403 on passkey register/options, passkey register, passkey delete, set-PIN and push subscribe/unsubscribe, while Rate, Tonight and Rank stay reachable; setting a PIN requires the current password (422 without, 401 with a wrong one) and clears the PIN lockout counters; and the switch-then-register-then-passkey-login chain therefore never produces a session with `admin_verified_at` stamped."
why = "§3.2 makes the password the always-available account credential and the PIN a convenience for a handed-over device; a PIN session that mints a passkey is a permanent credential minted from a 4-digit convenience, and on the admin account it is exempt from the 24 h re-prompt."
tests = ["backend/tests/test_account_security.py::test_a_pin_session_is_refused_every_route_that_mints_a_credential", "backend/tests/test_account_security.py::test_a_pin_session_on_an_admin_account_never_reaches_the_admin_surface", "backend/tests/test_account_security.py::test_setting_a_pin_costs_the_password_and_clears_the_lockout", "e2e/specs/17-users.spec.js::a PIN switch session cannot mint a credential"]

[[requirement]]
id = "platform-admin-reauth-clears-in-place"
spec = "§3.2 (\"admin routes re-prompt after 24 h\"); §2 Configuration"
milestone = "M4.6"
kind = "integration"
what = "A stale admin stamp is cleared by `POST /api/auth/reauth` with the account password on the same session — the row count stays 1, the cookie is unchanged, a wrong password is 401 and leaves the stamp untouched, a non-admin is 403, and a PIN session is refused rather than stamped — after which the admin routes resolve without a re-login."
why = "§3.2 requires the re-prompt; `admin_verified_at` is written only at INSERT, so today the only way through is log out and log back in, which leaves a live 90-day orphan per cycle and whose only affordance in the shell redirects to Home."
tests = ["backend/tests/test_account_security.py::test_reauth_clears_the_stamp_on_the_session_in_hand", "backend/tests/test_account_security.py::test_a_wrong_password_does_not_clear_the_stamp", "backend/tests/test_account_security.py::test_reauth_is_refused_to_a_member_and_to_a_pin_session"]

[[requirement]]
id = "platform-login-throttle-and-input-bounds"
spec = "§3.2 fallbacks; §2 (Tailscale origin, 4 vCPU)"
milestone = "M4.6"
kind = "integration"
what = "Repeated wrong passwords for one name lock that account with the same generic 401, wherever the password is verified — `/api/auth/login`, `/api/auth/password`, `/api/auth/reauth` and `/api/auth/pin` each arm the same counter — resetting on success and on a password change once the window has lapsed; a present name, an absent name and a locked-out one make the same argon2 verifications and issue the same statements in the same order, and the one thing they do not do is the same work (the failure increment writes one row for a present unlocked name and none for the other two, ~1.5 ms on a ~37 ms refusal, which is asserted as the open gap it is because `app_user` has nowhere to keep a sentinel row for the absent path to write to); `name`, `password` and `device_label` are length-bounded and reject control characters; a name differing only by surrounding whitespace resolves to the same account; and a non-ASCII digit is refused as a PIN at both ends."
why = "§3.2 keeps password login always available and §2 puts the same origin behind Tailscale, which bypasses Cloudflare rate limiting, on a 4 vCPU box; today only the PIN path has a lockout and three routes verify the account password without counting anything, so any session on an account — including the four-digit PIN switch — is an unthrottled oracle on its password, ' Tom ' and 'Tom' are two accounts that cannot sign in as each other, and `PinSwitchRequest` carries no digit pattern at all."
tests = ["backend/tests/test_account_security.py::test_repeated_wrong_passwords_lock_the_account_with_the_same_refusal", "backend/tests/test_account_security.py::test_a_password_change_forgets_the_failures_against_the_old_one", "backend/tests/test_account_security.py::test_every_route_that_verifies_the_password_counts_the_failure", "backend/tests/test_account_security.py::test_the_login_body_is_bounded_and_control_characters_are_refused", "backend/tests/test_account_security.py::test_a_name_that_differs_only_by_surrounding_whitespace_still_signs_in", "backend/tests/test_account_security.py::test_a_non_ascii_digit_is_refused_as_a_pin_at_both_ends", "backend/tests/test_api_gating.py::test_a_wrong_name_and_a_wrong_password_cost_the_same"]

[[requirement]]
id = "platform-config-refuses-a-lockout-value"
