[[requirement]]
id = "platform-session-cookie-contract"
spec = "§3.2 sessions"
milestone = "M0"
kind = "integration"
what = "The session cookie is HttpOnly and carries a 90-day expiry that slides: a request made inside the window extends the expiry, while a request after the window has lapsed is rejected as unauthenticated. The slide is visible to the browser and cheap — the row is updated and the cookie re-issued at most once a day, carrying `session_days * 86400` — and it moves in the row and in the cookie together or not at all, including on a request the app refuses. A successful login destroys the session its own incoming cookie named, at the password door and at the passkey door alike, while a failed one leaves it alive. Signing out is a duty the device discharges either way: a logout POST that never reaches the server still forgets the account and lands on the sign-in page, rather than rejecting out of the click handler and leaving the menu open on a session the server may already have destroyed."
why = "§3.2: 90-day sliding per-device cookies are the \"appliance\" feel — you authenticate rarely — so the sliding renewal is the behaviour, not the fixed 90 days."
tests = ["backend/tests/test_auth_integration.py::test_loading_a_session_slides_its_expiry", "backend/tests/test_auth_integration.py::test_an_expired_session_does_not_load", "backend/tests/test_auth_integration.py::test_logout_removes_one_session_and_leaves_the_others", "backend/tests/test_auth_integration.py::test_a_password_change_revokes_every_other_session", "backend/tests/test_account_security.py::test_the_cookie_carries_the_window_and_is_re_issued_at_most_once_a_day", "backend/tests/test_account_security.py::test_a_login_destroys_the_session_its_own_cookie_named_and_a_refusal_does_not", "backend/tests/test_account_security.py::test_a_passkey_login_destroys_the_session_its_own_cookie_named", "backend/tests/test_account_security.py::test_a_refused_request_still_carries_the_cookie_its_slide_earned", "e2e/specs/07-boundaries.spec.js::the session cookie is HttpOnly and same-site", "e2e/specs/07-boundaries.spec.js::a tampered session cookie is rejected", "e2e/specs/02-shell.spec.js::a logout the server never answers still ends it on this device"]

