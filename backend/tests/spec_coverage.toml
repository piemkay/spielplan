# Two findings at one seam, and the only one of the four that is not a lock: the sweep reads the
# request, fits for seconds, then upserts `tier_set` and clears the request with no predicate, so a
# PUT that lands in between is overwritten by a fit that never saw it. A lock would have to be held
# for the whole fit, which is exactly what the advisory lock everywhere else in this milestone is
# sized to avoid — so the fit compares and refuses instead, and the request's own timestamp decides
# what the sweep may clear. Decision 11's "for that user alone" is the second half: a loop with no
# per-item isolation made one member's unfittable board everyone's, and the failure is now logged
# into that item's report with the sweep continuing, which is what `refit_all` already did.
# [M4.10 findings 5, 6: rrh-lifecycle-04-tier-set-sweep-reverts-put-and-splits-kinds,
# rrh-lifecycle-05-tier-set-sweep-aborts-on-first-failure]

[[requirement]]
id = "tonight-rank-tier-set-change-survives-a-concurrent-refit"
spec = "decision 11 (\"the settings control sets the tier set; a Ledger refit is queued for that user alone\") + §4.2 ledger_cutpoints"
milestone = "M4.10"
kind = "integration"
what = "A tier-set PUT that lands while the worker's refit for that user is in flight is not reverted: both kind rows read the tier set the person last chose, the newer refit request survives the sweep that did not fit it, and a drop into any tier of the set is accepted for both kinds; one member's failing refit does not stop another member's queued refit or leave it owed for ever."
why = "The sweep clears the request with no timestamp predicate and the fit upserts `tier_set` unconditionally, so a K change made twice within a minute — which the settings control invites — silently reverts on films, holds on series, and refuses legal drops into the upper tiers of the board that kept it. Decision 11 queues a refit *for that user alone*; a loop with no per-item isolation makes one bad fit everyone's."
tests = [
    "backend/tests/test_rank_integration.py::test_a_refit_cannot_overwrite_a_tier_set_it_did_not_fit_against",
    "backend/tests/test_rank_integration.py::test_a_refit_request_made_during_a_fit_survives_the_sweep_that_did_not_fit_it",
    "backend/tests/test_rank_integration.py::test_the_tier_set_is_read_for_the_kind_that_is_asked",
    "backend/tests/test_rank_integration.py::test_a_drop_resolves_the_tier_set_of_the_titles_own_kind",
    "backend/tests/test_worker_jobs.py::test_a_tier_set_put_that_lands_during_the_sweep_is_not_reverted_and_is_still_owed",
    "backend/tests/test_worker_jobs.py::test_one_members_failing_refit_does_not_strand_another_members",
]

[[requirement]]
id = "library-rate-the-jellyfin-push-is-outside-the-verdict-transaction"
spec = "§7.3 (the app is authoritative) + §3.3 (\"the app must work when Jellyfin is down\") + §6 preamble (<2 s per sweep card)"
milestone = "M4.10"
kind = "integration"
what = "With the fake Jellyfin's `/UserPlayedItems` sleeping 0.5 s, a verdict's row is visible to a second connection within ~100 ms of the POST starting, no backend holds an open transaction for longer than 0.3 s at any point during the tap, and the journal's `prior_state.pushed` and §7.3's `jf_synced_at` bookkeeping are unchanged whether the push succeeds, fails or is owed — on the not-seen arm as well as the verdict's, where an Undo hands back exactly the Played flag the tap set. No call site reaches the socket from inside a transaction: `_push_state`, `seen.push_owed` and `seen.retract` are all outside every `conn.transaction()` in `rate/session.py`."
why = "§3.3 is unambiguous that the app must work when Jellyfin is down, and `sync/seen.py` and `ledger/observations._set_state` both promise in prose that the app-side write commits before the network call. Awaiting a 15 s-timeout HTTP request inside the verdict transaction holds row locks for a foreign server's latency, blocks the other member rating at the same time, and is what widens the double-tap window from milliseconds to seconds."
