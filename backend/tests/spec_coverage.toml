spec = "§10 + §4.3 backbone.npz (decision 162)"
milestone = "M4.5"
kind = "integration"
what = "The model bundle carries an identity column (imdb_id, or tmdb_id plus kind) row-aligned to backbone.npz's title_id; the importer checks it against the title rows those ids name and fails the bundle when an id's identity disagrees, naming the title. A models-only bundle -- the only kind decision 162 says will arrive again -- is refused outright when the vector is absent, because it carries no spine of its own and the check would otherwise be skipped exactly where it exists to run. A seed is checked against the spine in its own content.sqlite, which names every title rather than only those with a model row, and is warned that the vector is absent."
