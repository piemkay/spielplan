# The static guard carries the self-test `docs/TESTING.md` demands of every source-reading rule
# after M4.7, and it is registered beside it rather than left implicit: the shape it is written for
# is the two-line bare call `record_skip` actually shipped, and the parametrised cases include
# `_append`'s own transaction fallback, which must NOT count as the contract being met — a guard
# that accepted it would pass on the day the last call site loses its `async with`.

# The §13 side of the same seam, and a separate row from `tonight-rank-queue-pair-is-single-use`
# because the property is different: that row says a pair can be answered exactly once, which a
# sequential replay can test; this one says the answer is durable exactly once when two arrive
# together, which only a gathered pair of clients can. The seal stays a count rather than becoming a
# unique index on `duel` — §13's re-ask stream and `rate/battle.py` both write the same unordered
# pair twice on purpose, so the constraint that would backstop this race would forbid a behaviour
# the spec requires. Eight repetitions per assertion, because the probes behind this finding wrote
# two rows in four of six attempts and five of six, not in all of them.
#
# The banner clause is the branch the first build's repair did not reach: `_stash_if_empty` made the
# empty-table draw one statement, and §6.0's head redraw went on replacing a standing card with no
# predicate at all, so two devices following the same CTA held two tokens for one session and the
# loser's first tap was a 409 saying a card nobody had answered was already answered. It is asserted
# from the snapshot the losing request holds rather than by gathering, because over the route the
# split reproduced once in 40 attempts and a race that passes once has not passed — the stale
# snapshot IS that race's state. [M4.10 cycle 1, m410-rev-02]
#
# The lock itself was unmeasured until the same review cycle: with `_claim_card` replaced by a
# no-op the whole race block above stayed green, because `_append` maps `rate_observation_seq` to
# the same `StaleCard("stale_card")` and finding 11 had already moved the socket out — so both
# refusals look identical from the route and from the fake's write log. What differs is how far the
# loser gets, and the race now counts `observations.record_verdict`: one call per answerable card,
# two with the lock removed. The static rule beside it says the claim is the FIRST statement inside
# the transaction at all five taps, which is the half a count cannot see, and it fails on a rename
# rather than silently checking nothing. [M4.10 cycle 1, m410-rev-01]
# [M4.10 finding 1, dd08-rank-queue-answer-double-write]

