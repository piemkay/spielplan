spec = "§4.2 (ledger_cutpoints \"length = |tier set| - 1, ordered ascending\"); §4.1 rule 5; §6.1; §6.2 step 2"
milestone = "M4.13"
kind = "integration"
what = "ledger_cutpoints refuses an empty or one-level tier set and refuses descending boundaries while still accepting coincident ones; rate_session refuses a duplicated kind; session_participant refuses a seat below 1; a verdict cannot supersede or re-ask itself; and a ledger_state or user_score row whose kind disagrees with its title's is refused by the database. The migration that installs that last refusal applies over an install that already carries such a row: the upgrade drill seeds one of each into both tables and the upgrade deletes the disagreeing row and keeps the agreeing one, rather than failing its ADD CONSTRAINT at a boot the operator cannot edit past."
