[[requirement]]
id = "data-rules-cutpoints-tier-set-per-user"
spec = "§4.2 ledger_cutpoints (decision 11)"
milestone = "M3"
kind = "integration"
what = "ledger_cutpoints is keyed (user_id, kind) and enforces length(boundaries) = length(tier_set) − 1; saving a new tier set for one user re-initialises that user's boundaries to the equal-mass quantiles of their own fitted s for the new K, queues a refit for that user alone, and leaves their tier_edit rows and every other user's cutpoints untouched. The change invalidates the fit rather than leaving the board rendered at the old K, and a kept tier_edit row keeps its MEANING and not merely its row: it is re-read at the level holding the same prior mass under the new tier set."
why = "decision 11: the tier set is a per-user preference; a change in K invalidates boundaries but never observations, and the authored F3/D7/C15/B25/A25/A+17/S8 shape is defined only for K=7."
tests = [
    "backend/tests/test_rank_integration.py::test_ledger_cutpoints_is_keyed_by_user_and_kind",
    "backend/tests/test_rank_integration.py::test_a_boundary_list_that_does_not_match_the_tier_set_is_refused",
    "backend/tests/test_rank_integration.py::test_saving_a_new_tier_set_reinitialises_to_equal_mass_quantiles",
    "backend/tests/test_rank_integration.py::test_saving_a_new_tier_set_queues_a_refit_for_that_user_alone",
    "backend/tests/test_rank_integration.py::test_one_persons_tier_set_never_touches_anothers",
    "backend/tests/test_migrations.py::test_a_tier_set_change_has_somewhere_to_record_the_refit_it_owes",
    "backend/tests/test_ledger_observations.py::test_an_edit_at_six_of_seven_is_read_at_eleven_of_twelve",
    "backend/tests/test_rank_integration.py::test_a_tier_set_change_invalidates_the_fit_rather_than_leaving_the_old_k",
]
# The meaning sentence is M4.13's, and it is where dd06 and ml01 asked to be registered. This row
# already said the tier_edit rows are kept (decision 11), which is the half that was true; no
# column recorded the K they were written under, so every reader used the raw index and `load_cache`
# validated `hp_digest` and `bundle_version` and not K. Growing 7->12, a drop into tier 7 of 12 was
# clamped to 6 of 7 and rendered at T4 on Home against T7 on Rank; shrinking to 3, a drop at the
# TOP was fitted as level 2 of 7 and s fell from 0.3588 to -0.1133 where a correct K=3 refit gives
# 1.1933. Simulated meaning shift 20-28 percentile points against 3.0 for a mass-preserving
# rescale. [M4.13, ml01 and dd06]

[[requirement]]
id = "tonight-rank-straddle-equals-eligible"
spec = "§6.3 badges and queue (proposals 157, 76)"
milestone = "M3"
kind = "backend"
what = "The set of titles carrying a straddle badge and the set the comparison queue draws from are the same set — the posterior crosses a cutpoint — the badge at either end of the scale names the one adjacent tier that exists (S/A+, F/D) and never repeats the title's own tier, the reach is restricted to the two ADJACENT tiers and when the posterior reaches both neighbours it names the nearer cut, and the threshold constant is read from ledger_hyperparams.json rather than hard-coded."
why = "One predicate doing both jobs; the prototype badged at σ>0.13 and queued at σ>0.09, so a title at σ 0.11 was queue-eligible and unbadged, and an S-tier title rendered 'S/S'."
# The adjacency half was in the row from the start and nothing asserted it, which is how
# `model.straddle` came to set the reach to `searchsorted(lo)` whenever it differs from the tier: a
# wide posterior crossing two cuts is reported two tiers down (badge "B/F" on a five-tier board),
# and because the lower reach is tested first a title 0.1 below its upper cut and 0.9 above its
# lower one is badged downward. `queue._boundary` consumes the same value, so the pairs drawn to
# settle a boundary can be pairs that do not span it. The ±z·σ predicate itself stays, and
# `straddle_z` is NOT retuned here — decision 205 leaves 175's retune and Tonight's borrowed z to
# M4.12. [M4.10 finding 13, rrh-straddle-names-non-adjacent-tier-and-prefers-downward]
#
# M4.12 took that retune (decision 214): `straddle_z` is 0.15 and is a badge constant only, and
# §6.2's round has BOUNDARY_Z of its own. The identity this row states was true and empty at 1.0 —
# a fitted board badged 120 of 120, so "becomes queue-eligible" named every title and the queue's
# 70% boundary arm drew from the same set its 20% exploration arm does. The last clause is
# unchanged: the constant is still read from ledger_hyperparams.json, and the corpus does not ship
# it yet (proposal 157), so the retuned default is what every box runs on.
#
# `test_restricting_the_named_tier_does_not_narrow_the_straddling_set` passes on both sides of that
# fix by design, and is registered anyway: this row's first clause is the identity between the
# badged set and the queue pool, which is precisely what restricting the named tier could have
# broken, and an unasserted identity is how the reach came to drift in the first place.
tests = [
    "backend/tests/test_rank_board.py::test_the_badged_set_and_the_queue_pool_are_the_same_set",
    "backend/tests/test_rank_board.py::test_moving_the_straddle_threshold_moves_both_sets_together",
    "backend/tests/test_rank_board.py::test_the_top_and_bottom_tiers_never_straddle_into_themselves",
    "backend/tests/test_rank_board.py::test_a_straddle_badge_never_repeats_the_titles_own_tier",
    "backend/tests/test_ledger_model.py::test_a_posterior_that_reaches_the_next_tier_is_flagged",
    "backend/tests/test_ledger_model.py::test_a_straddle_never_names_a_tier_that_is_not_adjacent",
    "backend/tests/test_ledger_model.py::test_a_posterior_reaching_both_neighbours_names_the_nearer_cut",
    "backend/tests/test_ledger_model.py::test_restricting_the_named_tier_does_not_narrow_the_straddling_set",
    "backend/tests/test_rank_board.py::test_a_fitted_boards_straddle_badge_is_a_minority_of_the_board",
]

[[requirement]]
id = "tonight-rank-queue-selection-mix"
spec = "§6.3 comparison queue"
milestone = "M3"
kind = "backend"
what = "Over a long draw the comparison queue yields 70% posterior-straddling pairs, 20% exploration and 10% uniform-random pairs tagged as held out, the held-out 10% feeds neither the selection rule nor any tier-model quality figure, and the exploration arm's anchor is the least-compared title on the WHOLE pool and never re-serves a pair already asked — in the arm, through `draw`, and through `GET /api/rank/queue`, which is where the set is read and forwarded."
why = "The adaptive-inflation guard: adaptively selected pairs inflate measured reliability, so the evaluation stream cannot be the selection stream."
# The exploration clause is M4.10's. `queue.py`'s `away = [c for c in pool if c.straddle is None] or
# list(pool)` inverts the moment one title leaves the straddle set: the arm then draws from the
# handful the model is MOST sure about, and because the route's incremental update shrinks exactly
# those two titles' sigma without moving the cutpoints they never leave. Simulated over 500 answers
# with the route's own semantics: from answer 110 `|away|` was 1-2 of 900, one pair served 78 of 109
# exploration draws, and its anchor ended with the most comparisons on the board (88) while the
# §6.7 line read "the least-compared title on your board". Each repeat counts as an independent
# Davidson row. `test_exploration_reaches_the_least_compared_title` and
# `test_exploration_rotates_as_comparisons_accrue` pass today against that collapse and are
# strengthened. [M4.10 finding 12, dd07-exploration-arm-locks-onto-settled-titles]
tests = [
    "backend/tests/test_rank_queue.py::test_a_long_draw_is_seventy_twenty_ten",
    "backend/tests/test_rank_queue.py::test_the_shares_are_the_specs_own_numbers",
    "backend/tests/test_rank_queue.py::test_a_held_out_pair_is_never_labelled_boundary_targeted",
    "backend/tests/test_rank_queue.py::test_the_held_out_arm_is_uniform_over_pairs_not_over_strata",
    "backend/tests/test_rank_queue.py::test_the_held_out_arm_never_receives_a_fallback",
    "backend/tests/test_rank_queue.py::test_a_pool_with_no_straddler_falls_back_to_exploration_and_says_so",
    "backend/tests/test_rank_queue.py::test_a_boundary_pair_crosses_the_cutpoint_the_title_straddles",
    "backend/tests/test_rank_queue.py::test_exploration_reaches_the_least_compared_title",
    "backend/tests/test_rank_queue.py::test_exploration_rotates_as_comparisons_accrue",
    "backend/tests/test_rank_queue.py::test_exploration_anchors_on_the_least_compared_title_of_the_whole_pool",
    "backend/tests/test_rank_queue.py::test_exploration_never_re_serves_a_pair_it_has_already_asked",
    "backend/tests/test_rank_queue.py::test_a_pair_is_never_a_title_against_itself",
    "backend/tests/test_rank_queue.py::test_the_selector_reads_no_held_out_comparison",
    "backend/tests/test_rank_integration.py::test_the_asked_set_leaves_the_held_out_stream_out_of_the_selector",
    "backend/tests/test_rank_routes.py::test_the_queue_never_re_serves_a_pair_this_person_has_answered",
]
# The route leg is cycle 1's. The no-repeat property was asserted of `queue._exploration` over 200
# draws and then, through `draw`, behind `if served.arm == queue.ARM_EXPLORATION:` on a single draw
# whose roll off that generator's state is 0.968 — the held-out band, so the branch never ran. The
# two forwarding hops the route depends on (`_draw` -> `draw` -> `_exploration`) were therefore
# covered by nothing: dropping `asked=asked` from `draw`'s two calls left the whole suite green
# while the arm re-served answered pairs. The `draw` clause is counted now rather than guarded, and
# the route leg answers six pairs in a row on the fixture's own board. [M4.10 cycle 1, M410-REV3]

[[requirement]]
id = "tonight-rank-drop-writes-observations"
spec = "§6.3 drag-and-drop"
milestone = "M3"
kind = "integration"
what = "Dropping a title into a tier writes exactly one tier_edit with via='drag_drop'; dropping it between two titles writes that edit plus exactly two duels against the two new neighbours with context='tier_insert' and margin NULL. A drop into a tier that names no position writes the edit and NO duel, which is the body the phone's tap actually posts; a named neighbour that is not in the target tier is refused 422 and nothing is written; and a drop made while any filter is active writes the edit and no neighbour duels (decision 204)."
why = "Drag-and-drop is data, not override — the rearrange is an observation into the Ledger, and the two neighbour duels are what carry the placement."
# The three new clauses are M4.10's. §6.3 reserves the margin-less duels for a drop BETWEEN two
# titles, and `rank.svelte.js` returned `{above: <last entry>, below: null}` whenever
# `beforeTitleId` was null — which is both the phone tap and a pointer drop on a row's empty space —
# so on the primary form factor every promotion into a non-empty tier wrote an append-only
# comparison the person never made, always in the same direction. The two tests closing this row
# called `drop.drop()` with no neighbours, a body the shipped client never sent for a non-empty
# tier. The filtered case is decision 204: the client reads neighbours from the board AS FILTERED,
# so "between" is a fact about what was on screen and the titles the filter hid may sit between the
# two that did not. [M4.10 findings 17, 18: cs-03, cs-60]
#
# The row gains no concurrency clause and the drop route gains no 409: decision 202 rules that a
# drop carries no seal, so two identical drops a minute apart are two legitimate gestures and a
# refusal would encode the opposite. What the gathered-drops test holds is this row's own claims
# under a race — at most one `tier_edit` per drop, at most one pair of neighbour duels, and no
# stored neighbour outside the target tier — which is the exit criterion's clause 3 as 202 narrowed
# it.
#
# Cycle 2 found that version inert. Gathered with the SAME body twice, neither request can move the
# neighbour either of them names, so all five of its assertions held under every interleaving and at
# the M4.9 head — a clause of the exit criterion discharged by a test with no reachable red. The
# pair disagrees now: one drop names title 1 as its neighbour while the other pulls title 1 out of
# the tier, which is the one shape in which a duel can be stored against a placement nobody made.
# What it asserts is ORDER and not the final board, because the mover legitimately leaves the
# neighbour elsewhere — `tier_edit.id` is a bigserial, so an accepted sandwich has to be the earlier
# insert, which is the neighbour check and the duel being one gesture. The identical pair stays as
# the first half, because decision 202's own claim is that it is answered twice.
# [M4.10 cycle 2, M410-C2-D202-02]
#
# Decision 204's Cost paragraph promised that `test_the_drop_route_answers_with_the_board_under_the_
# filters_it_was_given` would gain the duel-count assertion, and cycle 1 found that it had not: the
# only decision-204 assertion handed `filtered=True` to `drop.drop` itself, so `api/rank.py`'s
# `filtered=bool(filters.active())` — the one line joining the decision to the surface — could be
# deleted with this row green and a filtered two-neighbour gesture would store two comparisons
# nobody made. It is asserted now as an A/B on one body under `q=Title`, which matches every title
# in that fixture, so the board is the same board and the filter flag is the only difference.
# [M4.10 cycle 1, M410-REV1-D204-01]
tests = [
    "backend/tests/test_rank_integration.py::test_dropping_into_a_tier_writes_one_tier_edit_and_no_duel",
    "backend/tests/test_rank_integration.py::test_dropping_between_two_titles_writes_the_edit_and_two_margin_less_duels",
    "backend/tests/test_rank_integration.py::test_the_neighbour_duels_carry_the_placement_and_not_just_the_geometry",
    "backend/tests/test_rank_integration.py::test_a_drop_at_the_end_of_a_tier_writes_the_one_duel_that_exists",
    "backend/tests/test_rank_integration.py::test_a_drop_is_one_transaction",
    "backend/tests/test_rank_integration.py::test_the_board_renders_the_drop_and_does_not_snap_it_back",
    "backend/tests/test_rank_integration.py::test_tap_to_tier_writes_exactly_what_the_pointer_path_writes",
    "backend/tests/test_rank_integration.py::test_a_drop_naming_a_neighbour_that_is_not_in_the_target_tier_is_refused",
    "backend/tests/test_rank_integration.py::test_a_drop_naming_a_neighbour_that_is_not_on_the_board_is_refused",
    "backend/tests/test_rank_integration.py::test_a_drop_under_an_active_filter_writes_the_edit_and_no_neighbour_duels",
    "backend/tests/test_rank_routes.py::test_the_drop_route_answers_with_the_board_under_the_filters_it_was_given",
    "backend/tests/test_rank_routes.py::test_the_drop_route_refuses_a_tier_outside_the_set_and_writes_nothing",
    "backend/tests/test_rank_routes.py::test_two_gathered_drops_leave_the_board_consistent",
    "e2e/specs/13-rank.spec.js::dragging a title onto another writes the edit and two neighbour duels",
]

