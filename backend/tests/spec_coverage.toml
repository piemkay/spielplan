[[requirement]]
id = "tonight-rank-the-boundary-is-tonights-own-constant"
spec = "§6.2 step 4 (rewritten, 54c; the ~10 candidate votes sentence); §6.3 (the A/S badge); decisions 175 and 205"
milestone = "M4.12"
kind = "backend"
what = "Tonight's round tests the shortlist boundary against its own BOUNDARY_Z beside CAP_PAIRS and never reads §6.3's straddle_z: a round over a realistic pool reports 'converged' rather than always reaching the cap, the median round is close to §6.2's ~10 candidate votes, and no route passes a z drawn from ledger_hyperparams into the round. At the shipped straddle_z the A/S badge is a minority of a fitted board rather than all of it, and the queue's boundary and exploration arms draw from different sets."
why = "The two surfaces measure straddling against different scales - a Ledger posterior in logit units against learned cutpoints, and a §5.1 score standardised to unit variance against the rank-3/4 cut - so one sigma multiple cannot calibrate both and sharing it made one a no-op. At z = 1.0 `converged` was dead code and a board nobody has rated badged 600 of 600; the constant is the controlling variable, not the prior, whose measured pool variance of 0.76-0.88 makes prior_var 1.0 correct by construction."
# prior_var is NOT narrowed and finding 32 is recorded as refuted, which is a claim the row has to
# carry evidence for or somebody re-derives it: at the borrowed threshold a quarter of the prior
# converges exactly as often as the full one (zero in twenty), and at the round's own threshold it
# converges LESS, because the boundary tightens as fast as the intervals do. [decision 214]
#
# "AT THE SHIPPED straddle_z" is the clause the board test alone cannot close: it builds its own
# board and passes `DEFAULTS`, so it is a statement about the constant in `hyperparams.py` and not
# about the number a booted stack badges with. The corpus ships neither §6.3 threshold (proposal
# 157), which leaves `make_bundle.py`'s literal the only `straddle_z` `npm --prefix e2e run fresh`
# and `ops/devstub.py` ever load -- and it stayed at the retired 1.0, so decision 214 was inert on
# every stack this repository can boot while this row read as covered. The last test
# is the one that ties the two halves together. [M4.12 cycle 1, M412-RND-01]
#
# And the paragraph beside the constant is held to the harness that produced it. The tests above
# assert the ARGUMENT at whichever parameters make each point, so a record that is merely
# approximate survives them -- two of the four ranges written next to BOUNDARY_Z did not
# reproduce, and the prior docstring quoted a pair no pool size produces. A comment that says "do
# not narrow this without a new measurement" is the evidence the next person re-derives against,
# so the sweep it quotes is run rather than remembered. [M4.12 cycle 1, M412-RND-02]
tests = [
    "backend/tests/test_tonight_round.py::test_the_round_reads_its_own_boundary_and_no_route_hands_it_one",
    "backend/tests/test_tonight_round.py::test_a_round_over_a_realistic_pool_converges_rather_than_always_reaching_the_cap",
    "backend/tests/test_tonight_round.py::test_the_badge_threshold_and_the_rounds_boundary_cannot_be_one_constant",
    "backend/tests/test_tonight_round.py::test_narrowing_the_prior_does_not_make_a_round_converge",
    "backend/tests/test_tonight_round.py::test_the_sweep_this_constant_was_calibrated_against_still_reads_this_way",
    "backend/tests/test_tonight_round.py::test_a_non_positive_straddle_threshold_would_end_every_round_before_it_started",
    "backend/tests/test_rank_board.py::test_a_fitted_boards_straddle_badge_is_a_minority_of_the_board",
    "backend/tests/test_bundle_shapes.py::test_the_declared_exception_carries_the_thresholds_the_app_actually_ships",
]

[[requirement]]
id = "tonight-lifecycle-settles-from-a-read"
spec = "§6.2 steps 5-6 (rewritten, 54e)"
milestone = "M4.12"
kind = "integration"
what = "When every seat has ended and the combine has not run — because it failed once, or because the last write never reached it — the next GET of the session, the ballot or the result moves the room to 'ballot' and returns the slate; no route calls play.finish directly."
why = "The transition lived only inside the answer handler, so one transient failure left the evening in 'voting' for ever with the data intact and unreachable. A rule with no home has no caller other than a phone's POST — a read, a sweep or any later reader had nothing to call."
# The rule is `play.settle`; the three reads that call it are the lobby, the ballot and the
# result. The route tests are the ones that can fail on the clause's own words — `_announce`
# was the combine's only caller, so what had to change was which handlers reach the rule —
