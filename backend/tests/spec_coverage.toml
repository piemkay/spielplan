# it is absent costs nothing a machine without it could have proved anyway.


# --- M4.9: from the corpus to the card (decisions 187-193; docs/milestones/M4.9-plan.md) ----
#
# One milestone because one chain: importer/{load,dna,reviews,meta} -> db/library ->
# home/{shelves,why,rail} -> TitleDetail/ShelfRow/PosterCard. Every row below sits on a link of
# it where the app reads something the real corpus export does not ship, and half a repair is
# worse than none: decision 162 seeds content once, so an install that has already imported gets
# no second pass in which the other half could land.
#
# Every row below is written BEFORE the code it covers, and each names the exact tests this
# milestone owes rather than leaving `tests` off. The gate then fails on a test that does not
# exist yet, which says which stage still owes what instead of only how many rows are bare; and
# a stage cannot quietly satisfy a row by pointing it at some test that happens to exist. That
# red list IS this milestone's test plan: it is closed by writing those tests under those names,
# never by a waiver, never by renaming the row's test, and never by lowering `current_milestone`.
# `docs/TESTING.md`'s ledger block is re-pasted once, when the last of them is green.
#
# One M4.9 row already sits above, under the pre-release banner, and stays there:
# `library-rate-title-card-credits-are-one-row-per-person-and-job` shipped ahead of its
# milestone and is covered. The only part of its finding still owed is the count line and the
# disclosure, which is `library-rate-title-card-credit-count-names-what-is-hidden` below.

