[[requirement]]
id = "tonight-rank-vote-undo"
spec = "§6 preamble (\"undo everywhere\") + §6.2 step 4 (rewritten, 54c)"
milestone = "M4"
kind = "integration"
what = "A participant can retract the answer they have just given while their own round is still in progress: the retracted answer stops contributing to the per-title tally and to that participant's tilt, answered_count returns to its prior value, and the round is served a pair again rather than advancing. The retraction reaches only that participant's own most recent answer — retracting another participant's answer, an answer that is not the most recent, or any answer once that participant's round has ended, is refused and writes nothing."
why = "§6's preamble puts undo on every surface and the round is the one place a mis-tap is both easy and permanently unrecoverable: a hard cap of 20 pairs, a blind reveal, and no second pass over the same pair. Scoping it to your own last answer is what keeps it an undo rather than a way to edit a round after seeing where it went."
tests = [
    "backend/tests/test_tonight_integration.py::test_a_participant_can_take_back_the_answer_they_just_gave",
    "backend/tests/test_tonight_integration.py::test_undo_reaches_only_your_own_last_live_answer",
    "backend/tests/test_tonight_integration.py::test_a_finished_round_cannot_be_edited",
]

[[requirement]]
id = "data-rules-fixture-matches-the-shipped-artifact"
spec = "§10 (the bundle) + §4.3"
milestone = "M4.5"
kind = "backend"
what = "A committed shape manifest, derived from a real corpus bundle, pins every structural fact the importer relies on: feature_contract.json's top-level keys and the type of feature_names, the header of corrections_v1.tsv, the column list of every content.sqlite table the importer maps, and the artifact file set. The test fixture is asserted against that manifest, so a fixture whose shapes were invented to match the importer fails. When CORPUS_BUNDLE_DIR points at a real bundle the same manifest is additionally checked against it."
why = "The fixture reproduced every measured landmine and invented every shape around them, so the whole import layer was verified against the implementation's own reading. test_the_vector_is_built_from_the_database_through_the_contracts_own_columns asserts contract.block('credit').column('3') — the person id the builder emits — and passes, while the shipped contract names that column p:director:Adam Arkin."
