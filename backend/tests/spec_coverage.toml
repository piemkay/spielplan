[[requirement]]
id = "tonight-rank-pool-order-plain-average"
spec = "§6.2 step 3 (plain average) + §0 row 3 + §5.1"
milestone = "M4"
kind = "backend"
what = "The pool's order is the unweighted arithmetic mean of the seated members' §5.1 scores and nothing else — a title where the minimum favours one candidate but the mean favours another places the mean's winner first, every member counts equally regardless of label count, and no mood tilt (this session's or a stored one) enters the pool prior, so two sessions opened over the same filters against the same Ledgers produce the identical order."
