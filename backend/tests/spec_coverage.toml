[[requirement]]
id = "jellyfin-acquisition-eval-placement-vector-from-feature-contract"
spec = "§8 stage 9 + §4.3 + §5.3 reconciliation"
milestone = "M2"
kind = "backend"
what = "The placement feature vector is built from `feature_contract.json` and nothing else: the nine content blocks in the declared order and sizes (6,435 columns), then review-text columns 0..63 of the SVD embedding multiplied by the contract's frozen `text_scale`; the genome block is zero-imputed and absent blocks are dropped rather than defaulted. A title with no keywords and no DNA row still yields a vector and a coordinate. A title whose Backbone row is numerically zero is placed rather than called warm, a title with a real row below `WARM_SUPPORT` is served as a genuine blend of both coordinates with the scale of the two halves reported rather than assumed, and a title complete except for a block no enrichment could ever fill is placed and badged but not parked."
why = "The contract is the exhaustive definition of the tower's input and records all placement-time preprocessing; the tower's dropout training anticipates absent blocks, and M2's exit criterion is that every owned title has a coordinate (19 such titles arrive with the bundle, 3 with no DNA row)."
tests = [
    "backend/tests/test_placement.py::test_the_shipped_bundle_ships_a_contract_that_matches_its_own_tower",
    "backend/tests/test_placement.py::test_the_forward_pass_is_the_checkpoints_own_arithmetic",
    "backend/tests/test_placement.py::test_the_tower_is_in_eval_mode_and_two_passes_agree_bit_for_bit",
    "backend/tests/test_placement.py::test_a_tower_whose_width_disagrees_with_the_contract_is_refused_loudly",
    "backend/tests/test_placement.py::test_nothing_in_the_placer_reaches_for_a_gpu",
    "backend/tests/test_placement.py::test_a_title_with_no_keywords_and_no_dna_row_still_gets_a_coordinate",
    "backend/tests/test_placement.py::test_every_owned_title_has_a_coordinate_after_reconciliation",
    "backend/tests/test_placement.py::test_a_low_support_title_is_served_as_a_genuine_blend_of_both_coordinates",
    "backend/tests/test_placement.py::test_a_thin_title_is_placed_badged_and_parked_and_a_complete_one_is_not",
    "backend/tests/test_placement.py::test_the_vector_is_built_from_the_database_through_the_contracts_own_columns",
    "backend/tests/test_placement.py::test_reconciliation_is_idempotent",
    "backend/tests/test_placement.py::test_a_bundle_with_no_backbone_row_for_a_title_never_calls_it_warm",
    "backend/tests/test_placement.py::test_a_title_whose_only_gap_is_an_award_it_never_won_is_not_parked",
    "backend/tests/test_placement.py::test_a_zeroed_backbone_row_is_demoted_and_swept_rather_than_left_warm",
    "backend/tests/test_placement.py::test_the_cold_tower_coordinate_is_written_unscaled",
]
# Three clauses added, and all three are this row's own subject asserted against the corpus
# rather than the fixture. `test_a_low_support_title_is_served_as_a_genuine_blend_of_both
# _coordinates` passed while the blend was not one: over the thin non-cold rows median ||E|| is
# 0.0152 against median ||E_hat|| 20.47, so the cold half decided every thin title's personal
# term (decision 236 sends the rescaling upstream and keeps the measurement here). `test_a_bundle_with_no_backbone_row_for_a
# _title_never_calls_it_warm` was true of an ABSENT row and false of a zeroed one, which is what
# 2,879 cold_mask rows ship. And `test_a_thin_title_is_placed_badged_and_parked_and_a_complete
# _one_is_not` had no case for the thin title whose gap no enrichment can close -- 40 of the 46
# were thin for having won no awards. All three names are kept, and NONE of the three bodies
# changed: each case turned out to be a different subject from its host. The zeroed row needs an
# npz the no-backbone test does not write (a FLAGGED row above WARM_SUPPORT, not an absent one).
# Decision 236 sends the rescaling upstream, so the blend test cannot assert a comparability the
# app deliberately does not create, and what shipped instead is that ruling's negative half --
# nothing rescales on the way in -- which is an assertion about the WRITE and not about the blend.
# And the award gap is the sweep's park decision, which took its own name. The cases landed in
# siblings written beside them, and the two that live in their own M4.13 rows are listed here as
# well -- the zeroed-row clause on
# `test_a_zeroed_backbone_row_is_demoted_and_swept_rather_than_left_warm`, "the scale of the two
# halves reported rather than assumed" on `test_the_cold_tower_coordinate_is_written_unscaled` --
# because a clause whose only carrier sits in another row is prose no id in THIS row can fail on.
# [M4.13, cs-01, cs-02, cs-21; M4.13 cycle 1, m413-rev1-cov-02]

