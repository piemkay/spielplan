# Spec coverage map — the contract between the spec and the test suite.
#
# One row per testable requirement. `milestone` names the build-order step that owes it a test
# (§12); `tests` names the tests that actually assert it.
#
# `tests/test_spec_coverage.py` enforces two things:
#   1. every requirement at or before `current_milestone` names at least one test, and
#   2. every named test exists.
#
# So the way a milestone gets its tests is mechanical: raise `current_milestone`, run the suite,
# and it fails with the list of what is now owed. Nothing here is aspirational — a row with no
# test either blocks the milestone or carries an explicit `waived` reason.
#
# `kind` is the cheapest thing that can falsify the requirement:
#   backend      pytest, no database
#   integration  pytest against a real Postgres (TEST_DATABASE_URL)
#   e2e          Playwright driving the real UI
#   static       a guard that reads the source, for rules no runtime can enforce

current_milestone = "M4.5"

[[requirement]]
id = "platform-compose-http-port-and-volumes"
spec = "§1 diagram; §2 TLS/ingress, Backups"
milestone = "M0"
kind = "static"
what = "A guard over docker-compose.yml asserts the app publishes exactly one plain-HTTP internal port and configures no TLS certificate or termination of its own, and that the volume set covers /data/pg, /data/raw, /data/artifacts, /data/cache and /data/backups."
why = "§2: the operator's existing Traefik+Cloudflare terminates TLS; §1 names four volumes and §2's nightly dump target adds the fifth. (Corrected: /data/import rests only on unsettled proposal 138.)"
tests = ["backend/tests/test_static_contracts.py::test_the_app_publishes_one_plain_http_port_and_terminates_no_tls", "backend/tests/test_static_contracts.py::test_every_data_volume_the_spec_names_is_mounted"]

[[requirement]]
id = "platform-cpu-only-torch-wheels"
spec = "§1 hard constraint; §2 \"No GPU anywhere\""
milestone = "M0"
kind = "static"
what = "A source guard fails if any dependency spec, lockfile or Dockerfile pulls a CUDA/ROCm torch build, an nvidia-* wheel, or a GPU base image: torch must resolve from the CPU-only index and the image must build on a GPU-less base."
why = "§1: every in-app model update runs on CPU; reference target is a 4 vCPU / 6-8 GB GPU-less VM, and a CUDA wheel silently balloons the image and breaks that box."
tests = ["backend/tests/test_static_contracts.py::test_the_image_pulls_torch_from_the_cpu_index_only"]

[[requirement]]
id = "jellyfin-acquisition-eval-importer-rejects-renumbered-rating-sources"
spec = "§10 + §4.1 rule 4"
milestone = "M0"
kind = "integration"
what = "The importer fails validation, names the rule, and imports nothing when a bundle's `rating_source` ids differ from the frozen set {1,2,3,4,7,11,21,23,26,28,31}, or when `rating_source` is absent; a bundle carrying the frozen ids imports and the ids survive verbatim into the DB."
why = "Those ids key `fitted_cuts`, `equating_map` and the dataset arrays — renumbering them silently mis-maps every calibrated cut-point, and `rating_source` is mandatory in every bundle."
tests = ["backend/tests/test_bundle_validation.py::test_frozen_rating_source_ids", "backend/tests/test_bundle_validation.py::test_missing_rating_source_table_fails", "backend/tests/test_landmine_guards.py::test_frozen_rating_source_ids_match_the_spec", "backend/tests/test_schema_contracts.py::test_the_database_refuses_a_renumbered_rating_source"]

[[requirement]]
id = "jellyfin-acquisition-eval-bundle-swap-and-active-version-invariant"
spec = "§10 swap sequence"
milestone = "M0"
kind = "integration"
what = "Import runs validate → stage to `/data/artifacts/<version>/` → transactional flip of `artifact_bundle.active`; a failure at any step before the flip leaves the previous bundle active and serving with the staged directory not activated, and no partially-flipped state is observable. A process holding a loaded bundle version different from the active row refuses artifact-dependent work rather than proceeding."
why = "§10's invariant: everything expressed in the old Backbone's basis is garbage against a new one, so a half-swapped state must be unreachable and a stale in-process bundle must be fatal, not silent."
tests = ["backend/tests/test_import_integration.py::test_the_bundle_becomes_the_one_active_row", "backend/tests/test_import_integration.py::test_a_second_bundle_version_imports_over_the_first", "backend/tests/test_import_integration.py::test_reimporting_the_same_bundle_is_refused_while_it_is_active", "backend/tests/test_schema_contracts.py::test_only_one_bundle_can_be_active", "backend/tests/test_artifact_store.py::test_assert_matches_refuses_a_stale_load", "e2e/specs/01-first-boot.spec.js::import runs the swap sequence and asks for the restart it needs"]

[[requirement]]
id = "platform-backup-rotation-and-ciphertext"
spec = "§2 Backups"
milestone = "M0"
kind = "integration"
what = "The nightly job writes a pg_dump into /data/backups and prunes to the newest 14; the resulting dump contains no plaintext connector secret (searching it for a known secret value finds nothing) and restoring it without SECRETS_KEY leaves connector config undecryptable rather than usable."
why = "§2: \"Dumps contain ciphertext only — back up the env file (SECRETS_KEY) alongside them\"; rotation 14 is the stated retention."
tests = []

[[requirement]]
id = "platform-key-rotation-semantics"
spec = "§2 Configuration"
milestone = "M0"
kind = "integration"
what = "Rotating SECRETS_KEY re-wraps the single DEK row and leaves every connector secret decryptable with the stored ciphertexts unchanged; rotating SESSION_SECRET invalidates all existing sessions and leaves stored connector secrets readable."
why = "§2 states the two rotations have disjoint blast radii — conflating them either loses connector config or forces needless re-auth. (Corrected: SECRETS_KEY rotation re-wraps the DEK, so ciphertext key_ids do not advance.)"
tests = ["backend/tests/test_secrets.py::test_rotation_rewraps_the_dek_without_touching_secrets", "backend/tests/test_auth_logic.py::test_rotating_session_secret_invalidates_every_cookie"]

[[requirement]]
id = "platform-required-config-refuses-boot"
spec = "§2 Configuration"
milestone = "M0"
kind = "backend"
what = "Startup config validation rejects a missing or empty PUBLIC_URL, and secret-dependent connectors refuse to initialise when SECRETS_KEY is absent — never falling back to SESSION_SECRET or a derived key."
why = "§2: PUBLIC_URL is required because WebAuthn binds credentials to the origin; §2 explicitly forbids the SESSION_SECRET fallback for connector secrets."
tests = ["backend/tests/test_static_contracts.py::test_the_stack_refuses_to_start_without_its_required_config", "backend/tests/test_secrets.py::test_secrets_key_never_falls_back_to_session_secret"]

[[requirement]]
id = "platform-dek-aead-key-id"
spec = "§2 Configuration; §4.2 connector_config"
milestone = "M0"
kind = "integration"
what = "First boot creates exactly one random 256-bit data-encryption key row wrapped under SECRETS_KEY; every connector_config.secrets_encrypted ciphertext is AEAD and carries a key_id, and the first-boot web-push VAPID keypair is stored under the same wrapping. Flipping one ciphertext byte makes decryption fail rather than return plaintext."
why = "§2 mandates AEAD under one DEK with a key_id for rotation agility; §14 risk 3 — a leaked Jellyfin key is admin-equivalent on the media server."
tests = ["backend/tests/test_secrets.py::test_dek_wrap_round_trip", "backend/tests/test_secrets.py::test_dek_unwrap_fails_under_wrong_key", "backend/tests/test_secrets.py::test_seal_round_trip_and_tamper_detection", "backend/tests/test_schema_contracts.py::test_a_connector_secret_cannot_be_stored_without_naming_its_key"]

[[requirement]]
