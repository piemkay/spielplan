milestone = "M2"
kind = "integration"
what = "About 10% of queue slots are silent re-asks of verdicts and duels at least 3 days old; the payload served to the client carries no marker distinguishing a re-ask from a first observation, the re-ask is stored distinguishably server-side so the flip rate σ is computable over ~200 re-asks, and it is counted neither as a second independent observation by the Ledger nor in the class-balance widget."
why = "The re-ask stream is a different instrument from the uniform-random stream — the latter cannot measure test–retest consistency — and σ sets the tier budget and settles the corpus's zero-test-retest-data unknown."
tests = [
    "backend/tests/test_rate_queue.py::test_the_served_payload_carries_no_marker_distinguishing_a_re_ask",
    "backend/tests/test_rate_queue.py::test_the_re_ask_is_stored_distinguishably_and_sigma_is_computable_from_it",
    "backend/tests/test_rate_queue.py::test_a_re_ask_is_not_a_second_observation_for_the_ledger_or_the_widget",
