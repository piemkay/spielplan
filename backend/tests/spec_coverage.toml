# M4.12 finding 40 / decision 219, amending §6.2 step 1 in 54h. The ARITHMETIC does not move and
# was never wrong: `title.runtime_min` is minutes per episode for a series, so the bound was
# always per-episode. What was wrong is that nothing said so, on a slider the household reads as
# the evening's length -- measured against the shipped bundle the series pool is 121 of 121 owned
# titles at budget 60, 130 and 200 alike, and 104 candidates carried "fits your 60 min", one of
# them a 24 min/ep show with 293 episodes. The three backend tests below are the label on both
# branches, the stamp travelling with the candidate, and the whole thing through the query.
#
# And the slider itself, which the decision named "every label" and the first pass did not reach:
# the two labels it did name report the number AFTER the household has set it, so the one row
# where the misreading starts was the one row still reading "60 min" under the Series pill. It is
# a rendering fact -- the store holds the kind and the number and neither knows they are drawn
# together -- so the vitest id is beside the backend ones rather than instead of any (decision
# 226), and the browser asserts the pair in `the session controls sit before the fork and apply
# to both doors`. [M4.12 review cycle 2: M412-FE-5]


