[[requirement]]
id = "platform-wizard-step-gating"
spec = "§3.1 wizard sequence"
milestone = "M0"
kind = "integration"
what = "Wizard steps run in the order create admin → connector seed → bundle import → member creation; only the admin step is mandatory (connector config and bundle import can be skipped and the app still functions), and a wizard re-entered after the admin step has completed does not create a second admin account or re-issue its credential."
