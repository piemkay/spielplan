    "backend/tests/test_push.py::test_an_endpoint_on_this_machine_or_the_private_network_is_refused",
    "backend/tests/test_push.py::test_an_endpoint_naming_the_households_own_servers_is_refused",
    "backend/tests/test_push.py::test_an_ordinary_push_service_endpoint_is_still_stored_exactly_once",
