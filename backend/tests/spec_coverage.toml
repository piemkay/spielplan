[[requirement]]
id = "tonight-rank-tilt-centred-on-the-pool-mean"
spec = "§6.2 steps 4–5 (tilt observation) + §0 row 4 (the centring lever) + §4.2 session_participant.tilt"
milestone = "M4"
kind = "backend"
what = "Each separating answer yields a tilt observation of chosen-minus-rejected DNA taken relative to the mean DNA vector of that session's own candidate pool: the identical answer on the identical pair produces a different tilt when the surrounding pool differs, and a tilt computed with no centring — or centred on the library or corpus mean instead of the pool — is a distinguishable, failing result; the accumulated tilt is persisted on that participant's session_participant.tilt."
