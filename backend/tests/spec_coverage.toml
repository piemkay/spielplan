[[requirement]]
id = "platform-movie-data-backup-and-restore"
spec = "§2 Backups + §10 (decision 162)"
milestone = "M4.5"
kind = "integration"
what = "An operator-triggered (CLI) movie-data backup writes a restorable archive of the content spine, the DNA layer and the review store, and of nothing user-specific: no verdict, duel, tier_edit, ledger, session, passkey, push subscription or connector secret appears in it. Restoring it into an empty install reproduces the same title, person and DNA rows; carries the title and person sequence positions forward, so the first acquisition after a restore mints an id that collides with nothing; and preserves title.origin, so §10's rebuild set still names the app-acquired titles. A destination the command cannot write is a refusal and an exit code, not a traceback."
why = "Owner decision 2026-09-01: the corpus supplies trained models and the movie data is Spielplan's to keep. Two failure modes make this testable rather than obvious. The id sequence is positioned by the seed import, an event that by definition never runs again, so a restore that does not carry setval mints id 1 and the app cannot acquire a single title. And title.origin defaults to 'bundle' (0008_placement.sql:47), so a restore that drops the column silently re-labels every acquired title and reconcile.py stops re-placing them."
tests = [
    "backend/tests/test_backup.py::test_the_archive_carries_the_content_spine_the_dna_layer_and_the_review_store",
    "backend/tests/test_backup.py::test_the_archive_carries_nothing_user_specific",
    "backend/tests/test_backup.py::test_every_table_is_either_archived_or_deliberately_left_out",
    "backend/tests/test_backup.py::test_a_restore_into_an_empty_install_reproduces_the_title_person_and_dna_rows",
    "backend/tests/test_backup.py::test_a_restore_carries_the_sequence_positions_forward",
    "backend/tests/test_backup.py::test_a_restore_preserves_title_origin",
    "backend/tests/test_backup.py::test_a_restore_refuses_an_install_that_already_holds_movie_data",
    "backend/tests/test_backup.py::test_a_restore_into_an_empty_install_carries_no_placement_basis",
    "backend/tests/test_backup.py::test_a_restored_install_refuses_a_second_content_seed",
    "backend/tests/test_backup.py::test_a_restore_refuses_a_sequence_name_the_archive_does_not_own",
    # decision 182 reworded this row to "operator-triggered (CLI)". M4.7 spec-07 is the reason it
    # could be: until `spielplan-movie-data` existed, every test above called the two functions
    # directly and the row certified a deliverable no operator could reach.
    "backend/tests/test_backup.py::test_the_operator_command_writes_an_archive_and_restores_it",
    # The entry point also has to fail the way the module promises. `_run` caught RestoreRefused
    # and BadZipFile only, so the destination - the one argument the operator types - came back as
    # a traceback out of `write_archive`'s `path.parent.mkdir`: uid 1000 against a root-owned
    # /data in the wrong container, an unmounted stick, a read-only mount, a full disk. The
    # archive itself is never at risk (it is renamed off `.partial` only when whole), so the
    # module's one word for a failure it can foresee covers these too.
    "backend/tests/test_backup.py::test_a_destination_the_command_cannot_write_is_a_refusal_and_not_a_traceback",
]

[[requirement]]
id = "platform-backup-restore-ordering-is-explicit"
spec = "§10 swap sequence + §2 Backups"
milestone = "M4.5"
kind = "integration"
what = "Restoring movie data and loading a model bundle have one correct order, and the wrong one is refused with its reason rather than half-applied: a model bundle loaded into an install with no content is refused before it writes anything, and the refusal names content as the missing prerequisite. After a correct restore-then-load, every owned title has a coordinate — §12's M2 exit criterion reads the same number it read before the backup."
