[[requirement]]
id = "data-rules-a-zeroed-backbone-row-is-not-a-warm-title"
spec = "§5.1 (the e(t) branch); §4.3 backbone.npz; §12 M2 exit criterion"
milestone = "M4.13"
kind = "backend"
what = "A backbone.npz row flagged by cold_mask — or numerically zero where no cold_mask ships — is treated as absent: it is excluded from row_of, never stamped warm, never excused from the Cold Tower sweep, and its coordinate is the pure cold limit with e_source 'cold_tower'. The count is reported in the load notes. No owned title is served with e(t) = 0 while being reported warm. The exclusion costs the gate its input and nothing else: the crowd's own rating count for that row still reaches title_prior.item_n, so §6.1's P(seen) popularity term and §8 stage 10's badge payload read the file's figure while title_prior.gate carries the 0."
why = "The bundle ships E = 0 for all 2,879 cold_mask rows and their real coordinate in E_hat/b_hat; the app reads neither, so 1,915 titles (182 owned) got a Backbone row of zeros, no placement, e_source 'backbone' and gate ~1.0 — a personal term of exactly zero for every user for ever, counted as coordinated by M2's criterion. Excluding the row then wrote 0 into title_prior.item_n for all 2,879 (398 owned in the reference install, 375 shipping item_n >= 90), which §6.1 weights at 2.0 through log1p(n)/log1p(1e5): measured on the fixture, P(seen) for a 25,000-rating film fell from 0.68 to 0.27, so the sweep offered the best-known titles in the catalogue as ones the household has probably never seen."
tests = ["backend/tests/test_scoring.py::test_a_zeroed_backbone_row_is_not_a_warm_title", "backend/tests/test_placement.py::test_a_zeroed_backbone_row_is_demoted_and_swept_rather_than_left_warm", "backend/tests/test_placement.py::test_the_shared_fixtures_flagged_row_is_swept_and_served_from_the_tower", "backend/tests/test_rate_queue.py::test_a_cold_masked_titles_crowd_count_still_reaches_the_popularity_term"]

[[requirement]]
id = "tonight-rank-selection-is-affordable-at-real-pool-size"
spec = "§6 preamble (<1.5 s per battle); §6.2 step 4 (rewritten, 54c)"
milestone = "M4.12"
kind = "backend"
what = "The fast pair evaluator returns the same expected-straddler value as the reference scalar implementation — exactly, not within a tolerance, over boards with mixed variances and replayed answers as well as fresh ones — and `select` serves the same pair as the scalar argmin over all three searches, the `asked` filter and the DNA-axis tie-break. A first pair for a guest seat over 716 candidates at the shipped prior, and the straddler-against-anyone fallback over 696 reached with every between-straddler pair already answered, each complete in under 0.5 s. The block evaluates the error function three times per pair and not four, which is the sharing the module's own performance note claims."
why = "§6 budgets 1.5 s per battle; the real owned pool is 696 titles and the shipped search costs 36 s for a member and 126 s for a guest seat. Every pool in the suite is 4-6 titles, so nothing in CI could see it — and an optimisation that changes which pair 54c's rule picks is a rule change, so equivalence is asserted first and speed second. Decision 168 rules out the K-nearest-straddler bound and names the guest prior and the fallback arm as the boards the guard must use."
# The fifth is the module's own performance record rather than a threshold: the block comment above
# `_Board` concludes "three `erf` and three `exp` per pair" from a sharing of `Phi(t)` the code did
# not implement, so the search ran four passes over the one function that is a Python-level loop.
# Nothing a household can see failed -- which is why it is a test and not a measurement, and it is
# the same drift cycle 1 repaired for `BOUNDARY_Z`. [M4.12 cycle 2, M412-RND-03]
tests = ["backend/tests/test_tonight_round.py::test_the_fast_pair_evaluator_reproduces_the_scalar_expectation_exactly", "backend/tests/test_tonight_round.py::test_a_moved_titles_own_interval_endpoint_landing_on_the_cut_changes_nothing", "backend/tests/test_tonight_round.py::test_the_fast_pair_search_serves_the_pair_the_scalar_argmin_serves", "backend/tests/test_tonight_round.py::test_a_guest_seat_gets_its_first_pair_inside_the_battle_budget", "backend/tests/test_tonight_round.py::test_the_costlier_fallback_arm_is_inside_the_budget_too", "backend/tests/test_tonight_round.py::test_the_pair_search_evaluates_the_error_function_three_times_per_pair"]

[[requirement]]
id = "data-rules-the-printed-beta-optimum-is-this-apps-own-coordinate"
spec = "§5.1 (the blend); §6.0 row 2's why-line; decision 167"
milestone = "M4.13"
kind = "integration"
what = "The `beta_optimum` a \"Top of your ledger\" section prints is 0.2 — §5.1's measured optimum converted into this app's coordinates, where β weighs the personal half — and the caption a never-fitted profile carries names that same 0.20 rather than its complement. A profile the fold-in has fitted carries no caption at all: it is told its own β and measured against no constant."
