[[requirement]]
id = "tonight-a-seat-that-can-never-be-asked-ends-itself"
spec = "§6.2 steps 3-4 (54c); 54d (three finalists and a wildcard); decision 215"
milestone = "M4.12"
kind = "integration"
what = "A seat whose replay reports a stop reason with no pair to serve is ended with that reason rather than left with ended_by NULL: a pool of three candidates and a seat with no scores in the frozen snapshot both reach 'ballot' instead of waiting for ever — including through the routes, where the read that ends the last seat is the only thing that can move the room and nothing else re-reads the session afterwards."
why = "boundary() returns None at or below the shortlist size, so such a round converges at zero answers; _end was reachable only from an answer (needs a pair) or the escape (refused below five answers), so everyone_finished stayed false and no route could close the room."
# Both routes into the dead end, because they arrive for different reasons and a fix for one
# would not have closed the other: a seat outside the frozen snapshot (finding 5's leftovers,
# constructed here rather than raced for) and a pool too small to have a shortlist boundary at
# all (decision 215, parametrised over exactly two and exactly three candidates). Each ends with
# `settle` returning True, so the assertion is the evening finishing rather than a column
# changing value. The third test is what the repair costs: ending a seat from a READ makes
# `state_for` a second writer of `ended_by`, and §14 risk 6 reads that column as the rate at
# which each of the three endings fires — so the first ending recorded has to be the one that
# stands, or a household's escape is counted as a convergence.
#
# The fourth is the SECOND thing that repair costs, and it is a different race from the third: not
# a competing ending but a moved count. The read's replay is off the loop in the same diff, so an
# undo commits between the answers it read and the ending it writes, and a reason stamped from the
# round the seat has already left ends somebody who is playing again -- on a card whose pair is
# suppressed by the stop reason and never by `ended_by`, so that seat then answers 409 `round_over`
# over a live pair until a frame drags the room to the ballot. The write paths pass `_end`'s
# `when_answered` for exactly this; the read is the caller that did not.
# [M4.12 cycle 1, M412-CONC-01]
#
# AND THE FIFTH IS THE ROUTE, because the four above it end the seat by calling `play.state_for`
# and then settle the room by calling `play.settle` themselves -- an order no client produces. The
# round read was the one handler that called neither, and on a pool this size it is the only thing
# that can end a seat at all: so the device that read the LAST un-ended seat left the room in
# `voting` with every seat `converged` and woke nobody, and the client's only GET of the session
# runs BEFORE its round read inside the same `refresh()`. A green domain test and a hung household,
# which is what "tested through the surface the row names" is for. [M4.12 cycle 2, M412-PLAY-4]
tests = [
    "backend/tests/test_tonight_integration.py::test_a_seat_that_can_never_be_asked_ends_itself",
    "backend/tests/test_tonight_integration.py::test_a_pool_too_small_for_a_round_reaches_the_ballot",
    "backend/tests/test_tonight_integration.py::test_the_first_ending_recorded_is_the_one_that_stands",
    "backend/tests/test_tonight_integration.py::test_an_undo_during_a_read_of_the_round_leaves_the_seat_playing",
    "backend/tests/test_tonight_routes.py::test_a_three_candidate_evening_reaches_the_ballot_from_the_round_read",
]

[[requirement]]
id = "tonight-a-join-and-a-start-do-not-both-win"
spec = "§6.2 step 2 (\"Anyone who joins before you start is in\")"
milestone = "M4.12"
kind = "integration"
what = "Two concurrent operations on one room — a member's join and the host's start — leave exactly one outcome standing: either the member is seated and appears in the frozen pool snapshot, or the join is refused with 'started'. A seat never exists outside the snapshot the round was built from."
why = "start read the seats and built the pool outside any transaction and flipped the state last, while join consulted a session row read before its own retry loop — so on a real library the admit window was the whole pool build, tens of seconds wide."
# Two real connections and a pool query slowed to the plan's own 0.6 s, because in sequence
# either order is correct and that is why the suite was green. The second test is the claim's
# own hazard rather than the defect's: `start` refuses an unrankable pool AFTER it has claimed
# the room, and a room left in 'voting' with no snapshot would be this defect again — so the
# refusal rolls the claim back and the join waiting behind it is admitted.
tests = [
    "backend/tests/test_tonight_integration.py::test_a_join_and_a_start_do_not_both_win",
    "backend/tests/test_tonight_integration.py::test_a_refused_start_leaves_the_room_open_and_joinable",
