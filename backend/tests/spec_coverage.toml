[[requirement]]
id = "platform-app-minted-ids-are-partitioned-from-the-corpus"
spec = "§4.1 (canonical key) + §8 stage 1 + §10 (decision 162)"
milestone = "M4.5"
kind = "integration"
what = "Spielplan mints title and person ids from a range disjoint from the corpus's, and the importer refuses any bundle whose title or person ids — or whose backbone.npz, review_text_emb.npz, seed_list.json or corrections_v1.tsv title ids — fall inside Spielplan's minted range, naming the offending id. The sequence is positioned by the seed import rather than by the migration, so a fresh install that has not seeded cannot mint an id the corpus already used."
why = "The corpus's own sqlite_sequence reads title=21442, so its next minted id is 21443 — exactly where 'mint above the imported maximum' would start Spielplan. Two minters in one namespace, and the model bundle still carries content ids, so a single newly crawled film would make a later bundle assert things about a title the household acquired. Nothing would trip: the only check is that ids ascend."
tests = [
    "backend/tests/test_bundle_lifecycle.py::test_a_fresh_install_mints_from_a_range_the_corpus_cannot_reach",
    "backend/tests/test_bundle_lifecycle.py::test_the_seed_import_positions_the_mint_and_the_migration_does_not",
    "backend/tests/test_bundle_lifecycle.py::test_the_partition_is_a_constraint_not_a_convention",
    "backend/tests/test_bundle_lifecycle.py::test_an_id_reaching_into_the_app_range_is_refused_and_named",
    "backend/tests/test_bundle_lifecycle.py::test_the_id_partition_is_checked_before_anything_else_in_the_bundle",
]

