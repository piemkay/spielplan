# Decision 207 settles the one thing moving the call out changes: the journal row is written before
# the push resolves, so `record_verdict` / `record_not_seen` / `record_correction` correct
# `prior_state.pushed` in one follow-up UPDATE outside the observation transaction, best-effort and
# logged if it fails. `_state_entries`' own docstring is the reason — "Undo compensates what it did,
# not what it intended" — so a permanently false `pushed` would leave Jellyfin marked Played against
# an app row that says otherwise, and §7.3's next sweep would adopt it back.
#
# All three arms are now asserted and not just claimed. The not-seen arm's follow-up UPDATE could be
# deleted outright with the whole suite still green: every `record_not_seen` call in the suite passed
# no connector, and the two route-level not-seen taps run under an unreadable SECRETS_KEY, where
# `_mark_pushed` early-returns. It is the arm where a lost flag costs most, because `observations.undo`
# restores `user_title` byte for byte including the `jf_synced_at` stamp — so the skipped retraction
# leaves nothing owed for §7.3 to settle. [M4.10 cycle 1, f11-02]
#
# The field has exactly one reader and decision 207's own text named another: it sent an auditor to
# `sync/seen.py`, whose `prior_state` is a plain state string kept a string so `sync` does not import
# from `ledger`, while `undo` is what gates the compensating Played write on the journal's flag. The
# static guard pins the reader set to the file the decision names, so moving the read moves the
# record with it. [M4.10 review cycle 1: M410-REV1-D207-03]
#
# Two repairs from cycle 1 of this milestone's own review. The positional property was asserted at
# one of the three call sites step 4 names: `record_not_seen` and `record_correction` could be
# returned to the pre-M4.10 shape with every test above green, because each of them asserts the
# push's effects (`write_log`, `jf_synced_at`, the link state, Undo's symmetry) and those are
# identical wherever the await sits. The static rule closes all four sites including Undo's
# `seen.retract`, and the correction is the worst of them: `side='both'` awaits two 15 s-budget
# sockets in series. And the transaction clause is now a DURATION sampled on every poll: plain
# `idle in transaction` is what the correct shape also reports between the three round trips of its
# own observation transaction, so measured at the shipped 10 ms poll the unbounded predicate read
# 1 in two of eight runs on correct code, while the old clause -- sampled only while the row was
# still invisible, which it never was after the first poll -- asserted its own initialiser in five
# of five. [M4.10 cycle 1, f11-01 and f11-04]
# [M4.10 finding 11, syncpush-13-jellyfin-call-inside-the-verdict-transaction; decision 207]

# §5.2's own arithmetic is the repair: an unobserved title's score is mu + <v, e> at zero extra
# parameters, so a title with no `ledger_state` row is not a title with no prediction — it is a title
# nobody has written a cached row for. The reveal computes it instead of reading a row that the
# nightly refit only ever writes for observed and owned titles.
#
# One thing this row's second clause now depends on that it did not when it was written: finding 9
# moved a Ledger cache miss off the request path, so a brand-new member's first tap stamps
# `refit_requested_at` and the fit lands with the 60 s `tier-set-refit` sweep. The structural
# darkness is gone either way — after any fit, an unowned queue title is lit — but a measurement of
# the exit criterion's "at most the first tap per member" has to let that sweep run, or it measures
# the absence of a worker rather than the presence of a reveal.
# [M4.10 finding 26, dd22-rate-reveal-unavailable-for-the-whole-first-sitting]

