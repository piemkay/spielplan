# M410-C1-HP-1]

[[requirement]]
id = "platform-every-http-route-is-named-by-a-test"
spec = "§3.2 (every route behind a session) + docs/TESTING.md's M3 lesson (\"a row whose `what` names a surface has to be tested through that surface\")"
milestone = "M4.10"
kind = "static"
what = "An inventory built from the app's own OpenAPI paths plus its websocket routes asserts that every `(method, path)` outside an explicit anonymous allow-list refuses an unauthenticated request with 401, and that every route is named by some test file, with an `UNTESTED` set that may only shrink; a route added without `ActiveUser` fails both rules."
why = "Seventeen of 82 routes are named nowhere at any layer and the three hand-listed anonymous sweeps are each partial, so a new route added without a session dependency passes the suite. `docs/TESTING.md` records the M3 lesson — `api/rank.py` shipped with no HTTP test — and nothing mechanised it."
# The seventeen is the plan's count, measured at the M4.5 head; `UNTESTED` is measured in the test
# and stands at eight, because M4.6 through M4.9 named nine of them (the passkey set, the Tonight
# channel) and two more were already named in passing. The row's `what` is unaffected: it states the
# rules, and the rules are what the tests hold. [M4.10 finding 34]
#
# One of them did not hold, until cycle 2. "An `UNTESTED` set that may only shrink" is two
# properties and the file implemented the closing one: `UNTESTED - unnamed` fails while an entry
# outstays its route, and nothing counted the set. A route added behind `ActiveUser` with no test
# answers 401, so the live sweep passes it BY DESIGN, and the naming rule's failure message hands
# the author the escape in as many words — "add it to UNTESTED". Measured on a live app: with a
# gated `GET /api/rank/leak_probe_xyz` registered and its path appended to the set, all seven tests
# passed and the debt was nine. The size is pinned now rather than capped, because `<=` funds a free
# slot the moment a legitimate shrink lands and nothing forces the number down with it — the
# one-directional baseline M4.16's `platform-api-layer-sql-baseline` row already calls a defect
# class. The eighth test is the blind spot itself, held end to end: rule 1 silent, rule 2 catching,
# and the excuse costing a second line. [M4.10 cycle 2, M410-C2-COV-01]
#
# The seventh is the green gate's, and it is about what "named by some test file" may count. The
# rule greps `backend/tests`, and this milestone put a harness test for decision 203's banner link
# into that directory — a real HTTP request, made to `ops/devstub.py`'s app rather than to this one
# — which shrank `UNTESTED` by `/api/home/pending-verdicts` while `api/home.py`'s handler stayed
# unasserted. CLAUDE.md decides that disagreement in the app's favour, so `test_devstub_contract.py`
# joins the module itself outside the haystack, and the new test keeps that exclusion honest: both
# skipped names must be real files, absent from the haystack, and the harness one must still name a
# route, or it is a narrowing that hides nothing. The set is eight on both sides of M4.10.
#
# `spec` quotes the M3 lesson rather than naming its line, which is the same repair one step up: the
# plan's `docs/TESTING.md:260-265` was read at the M4.5 head and by this milestone pointed at M4.9's
# exit-criterion shell block. A row whose citation drifts to an unrelated paragraph is a row whose
# argument nobody can check, and the sentence it rests on is stable where its line number is not.
tests = [
