[[requirement]]
id = "platform-session-cookie-contract"
spec = "§3.2 sessions"
milestone = "M0"
kind = "integration"
what = "The session cookie is HttpOnly and carries a 90-day expiry that slides: a request made inside the window extends the expiry, while a request after the window has lapsed is rejected as unauthenticated."
why = "§3.2: 90-day sliding per-device cookies are the \"appliance\" feel — you authenticate rarely — so the sliding renewal is the behaviour, not the fixed 90 days."
tests = ["backend/tests/test_auth_integration.py::test_loading_a_session_slides_its_expiry", "backend/tests/test_auth_integration.py::test_an_expired_session_does_not_load", "backend/tests/test_auth_integration.py::test_logout_removes_one_session_and_leaves_the_others", "backend/tests/test_auth_integration.py::test_a_password_change_revokes_every_other_session", "e2e/specs/07-boundaries.spec.js::the session cookie is HttpOnly and same-site", "e2e/specs/07-boundaries.spec.js::a tampered session cookie is rejected"]

