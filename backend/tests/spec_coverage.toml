# could not see their own violation: the volume guard was `assert path in compose` over the raw
# text, true of a commented-out mount and of a file of pure comments, and the port guard counted
# lines matching `${BIND_ADDR}`, so a second published port written any other way left it green.
# The three self-tests are what make the two guards above worth reading. [M4.7 ddocs-08,
# tq3-one-published-port]
#
# The rewritten port guard then read `- ` items only, so `ports: ["0.0.0.0:5432:5432"]` — the flow
# sequence an operator adds to reach Postgres with psql, and one keystroke fewer than the block
# form — contributed no entry and left the count at one. Both spellings are read now, and the
# self-test carries the flow form as its second case.
