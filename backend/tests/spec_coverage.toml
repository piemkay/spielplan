tests = ["backend/tests/test_landmine_guards.py::test_no_weight_column_is_used_as_a_filter", "backend/tests/test_landmine_guards.py::test_weight_filter_guard_catches_a_real_violation", "backend/tests/test_landmine_guards.py::test_weight_filter_guard_does_not_flag_legitimate_usage"]

[[requirement]]
id = "data-rules-platform-rating-display-only"
spec = "§4.1 rule 3"
milestone = "M0"
kind = "integration"
what = "platform_rating exists only inside the display-only schema, and the DB role the feature builder connects as cannot read it — selecting it as that role raises insufficient_privilege."
why = "aggregate platform scores are a popularity conduit and are banned as model features; the measured popularity penalty is −0.010 Spearman for nothing."
tests = []
waived = "The privilege half cannot be asserted at M0: there is no separate feature-builder DB role. I grepped every file under backend/migrations for CREATE ROLE, GRANT and REVOKE and found zero hits — 0003_content.sql only comments that a separate schema makes the boundary grantable — and conftest.py connects as the single owner, so nothing can raise insufficient_privilege. The schema-separation half is meanwhile already asserted by test_rule3_platform_ratings_land_in_the_display_schema_only and test_display_only_schema_exists_and_holds_only_platform_ratings."

