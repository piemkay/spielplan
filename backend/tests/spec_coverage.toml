# Four layers, because the clause is one decision taken in four places: the election that picks
# the representative (resolve), the sweep that must not follow a Played flag off it, and the
# `/Sessions` reader that has to find the title from whichever copy the television played. The
# two session tests are both named because they take different routes -- the copy map a sweep
# wrote, and ProviderIds when no sweep has run -- and a row that named only one would certify
# the path a household in mid-link does not have. [M4.11]
#
# The last two are the window between a copy leaving the library and the sweep that notices: the
# map still names the dead id, and `ORDER BY jellyfin_id` puts it first as often as not. One test
# is the tap in that window -- a 404 on one copy of a multi-copy DELETE must not abort the write
# to the live one -- and the other is the sweep, which now prunes before the loop instead of
# after it, so it does not spend a round trip on an id its own read has just dropped.
# [review cycle 2: m411-rev2-resolve-02]

