[[requirement]]
id = "jellyfin-acquisition-eval-seen-sync-no-echo-loop"
spec = "§7.3"
milestone = "M1"
kind = "integration"
what = "When the app's explicit `seen`/`unseen` action and Jellyfin's Played flag disagree, the app's action wins; the write stamps `jf_synced_at`, and the next 15-minute sync reading back the value the app just wrote produces no further write and no state change. A Jellyfin-side change made after `jf_synced_at` is accepted."
why = "Two-way sync is new relative to the corpus project's read-only stance; last-writer-wins with app-explicit precedence plus `jf_synced_at` is the stated loop guard."
tests = ["backend/tests/test_seen_sync.py::test_reading_back_our_own_write_changes_nothing", "backend/tests/test_seen_sync.py::test_a_jellyfin_side_change_after_the_sync_is_accepted", "backend/tests/test_seen_sync.py::test_an_action_taken_while_jellyfin_was_down_is_pushed_by_the_next_sync", "backend/tests/test_seen_sync.py::test_the_first_sync_after_linking_never_erases_jellyfin_history", "backend/tests/test_seen_sync.py::test_the_app_side_write_never_depends_on_jellyfin", "backend/tests/test_seen_sync.py::test_sync_all_runs_every_linked_user_and_reports", "e2e/specs/08-jellyfin.spec.js::a flag set in jellyfin arrives in the app", "e2e/specs/08-jellyfin.spec.js::a second sync reads back our own write and changes nothing", "backend/tests/test_seen_sync.py::test_each_linked_user_syncs_their_own_state", "backend/tests/test_seen_sync.py::test_one_users_action_is_pushed_under_their_own_token", "backend/tests/test_seen_sync.py::test_a_duplicate_copy_cannot_erase_an_explicit_seen", "backend/tests/test_seen_sync.py::test_a_duplicate_copy_marked_in_jellyfin_is_adopted", "backend/tests/test_seen_sync.py::test_an_action_taken_during_the_sweep_is_pushed_not_adopted", "backend/tests/test_seen_sync.py::test_an_owed_write_for_a_vanished_title_is_reported"]

[[requirement]]
id = "jellyfin-acquisition-eval-seen-write-uses-per-user-token"
spec = "§7.3"
milestone = "M1"
kind = "backend"
what = "Setting `seen` in the app issues `POST /UserPlayedItems/{itemId}?userId=` and `unseen` issues `DELETE`, both authenticated with that linked user's own access token and never the admin API key; a 401 on the write marks that link as needing re-link and neither retries with the admin key nor silently drops the write."
why = "Jellyfin API keys are unscoped and admin-equivalent — there is no read-only variant — so write restraint is enforced by this app's code alone (§14 risk 3); a per-user token can only set its own state."
tests = ["backend/tests/test_jellyfin_client.py::test_a_played_write_uses_the_users_own_token", "backend/tests/test_jellyfin_client.py::test_the_admin_key_is_refused_on_a_played_write", "backend/tests/test_jellyfin_client.py::test_a_write_with_no_token_never_reaches_the_network", "backend/tests/test_jellyfin_client.py::test_one_users_token_cannot_write_another_users_state", "backend/tests/test_seen_sync.py::test_marking_seen_writes_played_with_the_users_own_token", "backend/tests/test_seen_sync.py::test_marking_unseen_issues_the_delete", "backend/tests/test_seen_sync.py::test_a_link_with_no_token_refuses_the_write_and_asks_for_a_re_link", "backend/tests/test_seen_sync.py::test_a_rejected_token_marks_the_link_and_keeps_the_write_owed", "e2e/specs/08-jellyfin.spec.js::a tap in the app arrives in jellyfin, under the per-user token", "backend/tests/test_seen_sync.py::test_a_link_with_no_token_is_not_promoted_to_linked", "backend/tests/test_seen_sync.py::test_an_unreachable_jellyfin_does_not_promote_a_broken_link"]

[[requirement]]
id = "jellyfin-acquisition-eval-finish-prompt-banner-path"
spec = "§7.3 (with §12 M1, decision-doc proposal 150)"
milestone = "M1"
kind = "e2e"
what = "With push undeliverable, an armed finish prompt queues and appears as an in-app card on the user's next app open, naming exactly one title (\"Did you finish X?\"); its first tap writes `seen` for that user, and the card does not reappear on subsequent opens."
