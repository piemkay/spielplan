# Four rows below were added when M3 was opened, by reading §6.3 and §12's M3 row clause by
# clause against the map. The map is a contract, not a ceiling: §12 lists "filters" among M3's
# contents and no row had one, §6.3's neighbourhood badge and its "learned cutpoints, not
# percentile cuts" had no row either, and nothing asserted that a person can reach the
# comparison queue at all. Same routine that added M1's tenth row and M2's two.

[[requirement]]
id = "tonight-rank-board-filters"
spec = "§6.3 Filters (with §4.1 rules 1, 2, 5)"
milestone = "M3"
kind = "integration"
what = "The Rank board filters on genre, decade, runtime and seen-state, and on a DNA predicate written either bare (`cosy`) or facet-qualified (`mood.cosy`); the predicate matches rows of both DNA tiers and every survivor still reports which tier matched it; no filter applies a threshold to salience, confidence or n_sources; each filter narrows on its own, combining them intersects, and none of them suspends the kind partition."
why = "§12's M3 row names \"filters\" as M3 contents and §6.3 names six dimensions, two of which (runtime, DNA facet/term) the M0 catalog filter does not have. `dna_tag` stores the bare term, so the qualified form is built at query time; §4.1 rule 2 forbids the confidence cut the obvious implementation reaches for, and rule 1 forbids answering the predicate from a union that has lost the tier."
tests = [
    "backend/tests/test_rank_integration.py::test_each_rank_filter_narrows_the_board_on_its_own",
    "backend/tests/test_rank_integration.py::test_combining_rank_filters_intersects",
    "backend/tests/test_rank_integration.py::test_a_dna_predicate_matches_bare_and_facet_qualified_alike",
    "backend/tests/test_rank_integration.py::test_a_dna_predicate_reaches_both_tiers_and_keeps_them_apart",
    "backend/tests/test_rank_integration.py::test_no_rank_filter_puts_a_threshold_on_a_weight",
    "backend/tests/test_rank_integration.py::test_no_filter_suspends_the_kind_partition",
    "backend/tests/test_rank_integration.py::test_the_queue_pool_is_the_whole_board_and_not_the_filtered_view",
    "backend/tests/test_landmine_guards.py::test_no_weight_column_is_used_as_a_filter",
    "backend/tests/test_rank_routes.py::test_the_board_route_refuses_an_absent_kind",
    "e2e/specs/13-rank.spec.js::all six filter dimensions in section 6.3 have a control",
]

[[requirement]]
id = "tonight-rank-neighbourhood-badge"
spec = "§6.3 badges"
milestone = "M3"
kind = "backend"
what = "A title's badge names its tier and its neighbourhood — the titles immediately above and below it in the same tier, in the ledger order the board renders — and a title alone in its tier, or at either end of it, names only the neighbours that exist rather than inventing one or naming itself."
why = "§6.3: \"Badge shows tier + neighbourhood (\\\"A — between Heat and Prisoners\\\")\". A neighbourhood computed over an ordering other than the one on screen is unverifiable, and the ends of a tier are exactly where an off-by-one produces a badge that names the title it is attached to."
