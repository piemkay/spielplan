# asserted the control was DRAWN and the store tests called `submitBallot` with an explicit
# argument, so the only falsifier in the repository was the Playwright case above -- which is the
# right layer for the claim and the wrong one to be alone with it, since a refactor of the ballot
# block passes every gate a frontend change actually runs.
# [M4.12 review cycle 2: M412-FE-6]
tests = [
    "e2e/specs/14-tonight.spec.js::the guest hand-off clears the screen and offers nothing early",
    "frontend/src/routes/tonight/tonight-page.test.js::draws the guest's turn inside the ballot, where the phone actually changes hands",
