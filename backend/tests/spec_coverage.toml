milestone = "M4"
kind = "backend"
what = "The threshold is inclusive and the silence below it is real: a session whose leading candidates draw no divergent answers surfaces the split at D = 0.20 and surfaces nothing at D = 0.199 — no split copy, no zeroed facet, no reserved third slot — and the unsurfaced session still yields three finalists ordered by the plain average; whether the split fired is recorded on the session so the rate behind the ~14.5% figure is recoverable."
