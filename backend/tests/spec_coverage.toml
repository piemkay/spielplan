[[requirement]]
id = "platform-nightly-is-a-night-not-an-uptime"
spec = "§2 Backups; §5.3; §2 Configuration (TZ)"
milestone = "M4.7"
kind = "backend"
what = "A nightly job fires once per local calendar date resolved through TZ, not once per 24 h of uptime, and a worker restart neither spends nor skips a night: due() over a seeded last-run does not re-fire the every=86400 jobs, and a second dump on the same night is refused. The dump's own guard reads the same local date the anchor does, so a household far from UTC neither loses a night nor spends two slots on one. A failed job is retried within RETRY_AFTER of the moment it failed — not of the moment the attempt began, and not after its full interval — so an attempt that outlasts RETRY_AFTER still waits it out instead of being re-armed on the next tick. A TZ the process cannot resolve is still taken rather than refused, and is warned about once at boot with the boot line naming the clock actually in use instead of the configured string."
why = "§2's \"rotation 14\" is a promise about nights; today every worker start spends a retention slot, fourteen restarts inside an hour erase two weeks, and TZ is read only by a log line. And the dump's own no-op guard asked the UTC date while the anchor asked the local one, so a household far from UTC skipped a night with job_run.ok true and nothing reporting it. The retry was stamped from the top of the tick, so the 1800 s dump timeout this milestone added against a 300 s RETRY_AFTER gave a blocked pg_dump 36 back-to-back attempts and no idle second between them."
tests = [
    "backend/tests/test_worker_schedule.py::test_every_live_daily_job_is_anchored_to_an_hour_of_the_household_s_day",
    "backend/tests/test_worker_schedule.py::test_the_nightly_anchors_are_staggered_so_one_night_is_not_one_tick",
    "backend/tests/test_worker_schedule.py::test_a_nightly_job_fires_once_per_local_calendar_date_at_its_anchor",
