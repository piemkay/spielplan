milestone = "M4.13"
kind = "integration"
what = "An active artifact_bundle row whose directory is absent is a broken install, not an empty one: the model jobs refuse and write nothing, the five fitting routes answer 409 naming the restore before any row is written, ledger_fit.fitted_at does not advance, refits_owed() still holds the request, and the admin bundle state reports broken with the missing path. A refit over an empty observation set empties the board it can no longer justify — no ledger_state rows, no ledger_fit row, cutpoints back at initial_cutpoints(K) — rather than leaving one fitted on retracted data. A backbone.npz that is truncated or half-copied raises BackboneError — at zero bytes, which is where every interrupted copy starts, as well as part-way through — so app.py's lifespan guard catches it and the boot the admin needs in order to fix the bundle still happens."
why = "load_active returned the EMPTY store for a broken install, so the worker fitted every board with zero_embeddings under DEFAULTS, stamped it with the active version, and load_cache accepted the zero-basis cache; and refit_user's is_empty() branch returned before any write, leaving observed=True rows and learned cutpoints behind. Separately backbone.open indexed the npz arrays with no try, so a truncated file raised zipfile.BadZipFile past a guard that catches only BackboneError and took the boot down with it."
tests = [
    "backend/tests/test_model_basis.py::test_a_broken_store_carries_the_active_version_and_still_refuses_on_its_own_flag",
    "backend/tests/test_model_basis.py::test_the_model_jobs_refuse_a_broken_bundle_and_leave_ledger_fit_where_it_was",
    "backend/tests/test_model_basis.py::test_a_fitting_request_on_a_broken_bundle_answers_409_and_writes_nothing",
    "backend/tests/test_model_basis.py::test_every_fitting_route_awaits_the_basis_guard_as_its_first_statement",
    "backend/tests/test_model_basis.py::test_a_refused_job_leaves_the_refit_owed_rather_than_swallowing_it",
    "backend/tests/test_model_basis.py::test_the_admin_bundle_state_reports_broken_and_names_the_missing_path",
    "backend/tests/test_model_basis.py::test_a_refit_over_an_empty_observation_set_empties_the_board_it_cannot_justify",
    "backend/tests/test_scoring.py::test_a_truncated_backbone_npz_raises_backbone_error_rather_than_a_zip_error",
]

[[requirement]]
id = "data-rules-the-ledger-fits-the-coordinate-it-serves"
spec = "§5.1 (e(t) and the gate); §5.2 (the MAP fit takes §5.1's coordinates)"
milestone = "M4.13"
kind = "integration"
what = "standard_embeddings returns §5.1's coordinate for every title — E outright for a warm one, gate·E + (1-gate)·ê for a title with a Backbone row below WARM_SUPPORT, ê for one with no row — and equals serve.coordinates()[t].e for every title. A title with item_n = 30 and a placement yields 0.75·E + 0.25·ê on both paths."
why = "standard_embeddings composed the two sources as a precedence chain, so any title with a Backbone row took raw E regardless of support while the serving path blended: 33% of the real bundle's covered rows, fitted and served from different inputs, with §6.1's held-out instrument measuring a v the serving path does not use."
tests = [
    "backend/tests/test_ledger_observations.py::test_a_warm_title_is_fitted_at_its_backbone_row_outright",
    "backend/tests/test_ledger_observations.py::test_a_thin_title_is_fitted_at_the_blend_rather_than_at_its_raw_backbone_row",
