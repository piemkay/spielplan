spec = "§3.1; §6.6 Users"
milestone = "M0"
kind = "integration"
what = "The one-time password is returned exactly once, in the account-creation response; it is persisted only as a hash (no plaintext column anywhere), no later user-list or user-detail response contains it, and it no longer authenticates once the forced first-login password change has landed."
