[[requirement]]
id = "map-taste-admin-wizard-ends-at-the-bundle-import"
spec = "§3.1 (decision 164); §14 risk 4; §2"
milestone = "M4.6"
kind = "e2e"
what = "The first-boot wizard runs create admin -> connector seed -> bundle import and stops: its later steps are reachable after the admin exists rather than redirecting to Home, it contains no member-creation step and no Add-to-Home-Screen walkthrough, and step one renders the configured `PUBLIC_URL` value beside the sentence that changing it invalidates every registered passkey. It is the admin's revisitable page and no one else's: a signed-out visitor to /setup on an installed app is sent to the sign-in page and no admin-creation control is rendered at any point on the way, and the member step's route answers 404 in the built app as well as under pytest — the SPA catch-all declines the /api namespace, so a route that was deleted does not read as a method mismatch."
why = "Decision 164 takes member creation out of §3.1's sequence and §3.1 puts phone onboarding in member first-run; §14 risk 4's whole mitigation is that the wizard warns loudly, and it currently prints the literal token `PUBLIC_URL` while the value is fetched, stored and read nowhere. Both additions are regressions this milestone introduced and the review caught: sec-14 cut `has_admin` out of the anonymous state payload while the wizard and the shell still decided from it, and `undefined` is falsy, so an installed app offered a passer-by the admin form; and the catch-all `create_app` mounts only when `SPIELPLAN_STATIC_DIR` is set — the container, never pytest — partially matched a POST to any unrouted /api path and Starlette answers a partial match with 405."
tests = ["e2e/specs/17-users.spec.js::accounts are made here and nowhere else, and there are two roles", "backend/tests/test_api_gating.py::test_the_spa_fallback_does_not_answer_for_the_api_namespace"]

