    "backend/tests/test_operator_runbook.py::test_the_import_gesture_guard_sees_either_half_go_missing",
    "backend/tests/test_box_claims.py::test_the_image_does_not_hand_its_own_install_tree_to_the_runtime_user",
    "backend/tests/test_box_claims.py::test_the_install_tree_guard_catches_a_real_violation",
    "backend/tests/test_box_claims.py::test_the_install_tree_guard_ignores_a_stage_that_does_not_ship",
    "backend/tests/test_backup.py::test_every_place_that_names_the_archive_command_names_a_container_that_can_write_it",
