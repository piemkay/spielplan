[[requirement]]
id = "platform-passkey-verification-gates-the-admin-stamp"
spec = "§3.2; §4.2 webauthn_credential.sign_count"
milestone = "M4.6"
kind = "integration"
what = "An assertion with the user-verification flag clear creates a session with `admin_verified_at` NULL, so the admin routes answer 401 with `X-Spielplan-Reauth`, while a UV-verified assertion stamps it; and the stored sign_count is advanced by a conditional UPDATE that refuses an assertion whose counter has not advanced — two assertions in flight that read the same stored counter and carry the same advanced one leave exactly one winner — with the synced-passkey zero-counter case documented as accepted."
why = "§3.2's passkey is Face ID / Touch ID / Android biometrics, so a presence-only tap on a roaming key must not satisfy the 24 h admin re-prompt; §4.2 stores sign_count for the cloned-hardware-key case only, and the module claims a replay guard that is inert for the synced passkeys §3.2 targets."
tests = ["backend/tests/test_account_security.py::test_only_a_user_verified_assertion_stamps_the_admin_clock", "backend/tests/test_account_security.py::test_an_assertion_whose_counter_has_not_advanced_is_refused", "backend/tests/test_account_security.py::test_two_assertions_carrying_the_same_advanced_counter_leave_one_winner", "backend/tests/test_account_security.py::test_a_synced_passkey_that_never_counts_signs_in_every_time"]

[[requirement]]
id = "platform-anonymous-surface-is-bounded"
spec = "§3.1; §3.2; §14.4"
milestone = "M4.6"
kind = "integration"
what = "Anonymous passkey login-options calls prune expired challenges inline and hold a cap on outstanding rows by evicting the oldest, never by refusing a caller — an anonymous burst of 25 leaves the cap's worth of rows and a household passkey sign-in still succeeds through it; an anonymous `GET /api/setup/state` carries only `required` and the note, while an authenticated one carries `has_admin`, `member_count`, the bundle and the steps; and a malformed passkey credential is 422 or 401 rather than a 500 with a traceback."
