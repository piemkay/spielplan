[[requirement]]
id = "platform-forced-first-login-change"
spec = "§3.1; §3.2 fallbacks"
milestone = "M0"
kind = "integration"
what = "An account in pending_first_login state reaches only the four routes that are the way out of the lock — `GET /api/auth/me`, `POST /api/auth/password`, `POST /api/auth/logout` and `POST /api/auth/switch` — while a sweep over every other authenticated route in the app finds each of them refused - including the two that read the session cookie by hand, where a dependency walk cannot see them: `GET /api/setup/state` answers a locked session with the anonymous two fields and the Tonight WebSocket closes it; and after the change the flag clears, the new password verifies as an argon2 hash (no plaintext or non-argon2 digest in the DB), and normal password login works."
