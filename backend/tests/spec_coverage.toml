milestone = "M0"
kind = "integration"
what = "Import runs validate → stage to `/data/artifacts/<version>/` → transactional flip of `artifact_bundle.active`; a failure at any step before the flip leaves the previous bundle active and serving with the staged directory not activated, and no partially-flipped state is observable. A process holding a loaded bundle version different from the active row refuses artifact-dependent work rather than proceeding, and the refusal is performed by production code rather than by the invariant's own unit test: the worker's model jobs raise rather than writing, so the tick advances nothing and records a failed `job_run` whose error names both versions, retried on the next tick, and the scoring and refit entrypoints answer 409 with the restart-required wording."
