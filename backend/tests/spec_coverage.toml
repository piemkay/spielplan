[[requirement]]
id = "data-rules-dna-tiers-never-merged"
spec = "§4.1 rule 1"
milestone = "M0"
kind = "integration"
what = "After import, dna_tag (extracted, 2,016 titles) and dna_projected (inferred, 11,324 titles) are two distinct relations, and each of the ~14,181 (title,term) pairs present in both is retrievable from each side carrying its own tier; a bundle that ships the two tiers as one unioned table fails validation."
