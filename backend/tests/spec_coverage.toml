[[requirement]]
id = "platform-image-runs-unprivileged-and-installs-the-project"
spec = "§1; §2; §14.3"
milestone = "M4.7"
kind = "static"
what = "The stage the image ships declares a non-root USER, hands that user no write access to the tree it installed, pins uv, installs the project so its declared console scripts exist, and the HTTP-serving backend receives no writable mount of the host directory the nightly dumps land in, under any container path and however the mount's option list is spelled. The host side of that USER is guarded too: CI gives the container's uid the bind mounts before the stack can create them as root, the e2e reset empties the artifacts mount rather than removing it however the removal is spelled, the upgrade an existing install follows hands those same mounts to uid 1000 before the rebuild that makes it necessary, the two gestures that chown takes away from the host operator — delivering the bundle into data/import, which has no upload route, and removing a leftover .unpacked- tree — are written down where the chown is required, and no document tells the operator to write the movie-data archive in a container with no writable /data/backups."
why = "§14.3's threat model is that the stored credential is admin-equivalent; the SPA fallback runs unauthenticated in the same process that today holds every dump as root, and the runbook now names two console scripts."
# Four clauses, four guards, and a self-test apiece: each guard is handed a synthetic violation
# it must catch, because two guards in this same file passed on a compose file of pure comments
# and that is the instrument this milestone is repairing (docs/TESTING.md's own rule).
#
# Three of those self-tests then constructed only the spelling their own guard matched, which is
# the same failure one level up, and the `what` above is worded against all three now. The root
# guard read the last `USER` anywhere in a file that has been two stages since M0, so a `USER`
# added to the node build stage covered a runtime stage that had lost its own. The dumps clause
# filtered on the *container* path, so `- ./data/backups:/backups` — the line the `db` service
# already carries — and `- ./data:/data` both delivered every dump to the HTTP container with the
# guard green; it reads the host side now, taken from the worker's own mount. And the reset guard
# matched one inline `join(ROOT, 'data', '<mount>')`, while the fix it protects had introduced the
# `const artifacts` that makes `rmSync(artifacts, …)` the natural regression.
#
# Two more clauses, from the same review one cycle later. The USER directive was half undone by a
# `chown -R spielplan:spielplan /app` in the same RUN: ./data is mounted at /data and never under
# /app, so it reached nothing the comment above it named and instead gave the runtime user the
# code, the migrations and the static bundle - a write reached through the anonymous SPA fallback
# would have survived a restart. Nothing read that line at any layer. And the mount half has a
# documentary consequence nobody had asserted: with ./data/backups off x-backend-volumes,
# `movie_data.py`'s own docstring still told the operator to write decision 162's only copy of the
# household's movie data with `docker compose exec backend`, which cannot write it at all.
tests = [
    "backend/tests/test_static_contracts.py::test_the_image_does_not_run_its_processes_as_root",
    "backend/tests/test_static_contracts.py::test_the_root_guard_catches_a_real_violation",
    "backend/tests/test_static_contracts.py::test_the_root_guard_reads_the_stage_that_ships_rather_than_the_order_within_it",
    "backend/tests/test_static_contracts.py::test_the_image_pins_the_tool_that_installs_everything_else",
    "backend/tests/test_static_contracts.py::test_the_uv_pin_guard_catches_a_real_violation",
    "backend/tests/test_static_contracts.py::test_the_uv_pin_guard_accepts_a_flagged_pin",
    "backend/tests/test_static_contracts.py::test_the_image_installs_the_project_and_not_only_its_dependencies",
    "backend/tests/test_static_contracts.py::test_the_project_install_guard_catches_a_real_violation",
    "backend/tests/test_static_contracts.py::test_the_http_container_does_not_carry_the_nightly_dumps",
    "backend/tests/test_static_contracts.py::test_the_backups_guard_sees_the_dumps_reach_the_http_container",
    # One cycle later again, in the half of the mount the rewrite left alone: the mode was read as
    # a word and compared to "rw", but it is an option list — `:z` is what every SELinux guide has
    # an operator append when a bind mount answers Permission denied, `:Z` did not even parse, and
    # `:rw,z` is that advice on a line that already had a mode. All three writable, all three read
    # as harmless, and the guard's own three self-tests were written bare so none could find it.
    # This is the only mode comparison in the file that fails open; `_mounts`' identical idiom
    # fails the assertion instead. The read-only case is asserted from the other side now, because
    # the rule is about a *writable* copy and `:ro` has to keep satisfying it.
    "backend/tests/test_static_contracts.py::test_the_backups_guard_leaves_a_read_only_mount_alone",
    # The half that lands on the host rather than in the image, and the one the image guards
    # cannot see: Docker recreates a missing bind-mount source as root, so a reset that removed
    # `data/artifacts` spent CI's chown before phase one's import needed it. Linux-only, which
    # means CI-only — no developer's box and no other layer of this suite can fail on it.
    "backend/tests/test_operator_runbook.py::test_the_e2e_reset_empties_the_bind_mount_it_clears_and_removes_none_of_them",
    "backend/tests/test_operator_runbook.py::test_the_reset_guard_sees_the_directory_being_removed",
    "backend/tests/test_operator_runbook.py::test_the_e2e_job_chowns_the_bind_mounts_before_the_stack_can_create_them",
