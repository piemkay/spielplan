what = "A comparison-queue pair can be answered exactly once: the sealed pair carries the number of comparisons the person had answered when it was drawn, a second answer under the same seal is refused with §6.1's 409 and writes no duel, one person's seal is refused for another account, and two concurrent answers under one seal write one duel, not two."
