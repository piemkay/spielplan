[[requirement]]
id = "tonight-the-answer-latency-is-a-measurement"
spec = "§4.2 (session_answer columns); §14 risk 6 (the round must be instrumented before it is re-tuned); decision 226"
milestone = "M4.12"
kind = "e2e"
what = "An answer recorded through the real UI stores a non-zero latency_ms measured from when the pair reached the screen, and one answer and one verdict each complete within §6's per-card budgets against the fixture."
why = "The elapsed time was evaluated inside the object literal one statement after it was started, so every row ever written is 0 — and rows are append-only, so evenings already played cannot be re-measured. §14 risk 6 requires the instrument before anyone tunes the round, and a zero reads as a measurement rather than as a bug."
# Asserted against the REQUEST the client sends rather than against the stored row, and that is
# the whole of where the defect lives: `latency_ms` is the client's number, the backend writes
# whatever arrives, and a row read back through the API would have been a round trip about the
# column rather than about the instrument. The Playwright test spends a deliberate 400 ms in
# front of the pair first, because the quantity is how long a card was on a screen and an
# instrument for it has to give it something to measure -- and it bounds the value from above as
# well, since a clock armed once at the door satisfies "not zero" on every pair of a round.
#
# The budgets ride here because §6's preamble states them in one line for both cards this app
# asks a question on ("<2 s per sweep card, <1.5 s per battle") and nothing measured either on
# the phone project, which is the form factor the sentence is about. The sweep half borrows a
# verdict from §6.1 and gives it back through §6's own "undo everywhere", so the member's queue
# is left as the test found it rather than draining towards a skip on the fifth re-run.
# [M4.12 findings 41, 47; decision 226]
#
# "MEASURED FROM WHEN THE PAIR REACHED THE SCREEN" is the half the browser gate falsified, and
# three of the rows below are what holds it. `loadRound` is the tail of `refresh`, which every channel
# frame ends in, so a clock armed on each re-read reported the time since the last thing anybody
# in the household did; `start` sends the host's own device both a `lobby` and a `rooms.changed`
# frame, which made it the first pair of every round -- a card held for 400 ms recorded as 176.
# The pair's identity is the sealed card token, and both directions are asserted because a clock
# that never re-arms satisfies the first one alone.
#
# The third of them is mounted rather than stated in the store, because the interval it is about
# is one in which the page does not exist: /tonight is not in the layout's `bare` list, so the nav
# rail renders over a live round and one tap on Rank destroys the component while the module keeps
# the clock. The re-read that brings the pair back carries the same sealed token, so the gate two
# paragraphs above -- correct about a channel frame -- did not re-arm on it either, and the next
# answer was charged the whole absence: measured, a 900 ms read after two minutes elsewhere wrote
# 181200. No store test can produce it, for the reason the finding-19 case in the same file cannot
# be written here: the defect is that the module outlives its own page.
# [M4.12 review cycle 1: M412-FE-1]
tests = [
    "e2e/specs/14-tonight.spec.js::an answer carries the time it took, and the card budgets hold",
    "frontend/src/lib/tonight.svelte.test.js::records how long the pair was on screen rather than zero",
    "frontend/src/lib/tonight.svelte.test.js::sends nothing at all rather than zero before a pair has been shown",
    "frontend/src/lib/tonight.svelte.test.js::is not restarted by a household frame that re-reads the pair already on screen",
    "frontend/src/lib/tonight.svelte.test.js::is restarted by a card that is new, which the hand-off puts on the phone",
    "frontend/src/routes/tonight/tonight-page.test.js::charges the answer the read after the remount, not the time the page was gone",
]

# --- M4.13: the model basis (decisions 234-241; docs/milestones/M4.13-plan.md) --------------
#
# One milestone because one numeric object: `ledger/`, `scoring/` and `placement/` are the only
# packages that compute a coordinate, fit a vector or write a tier, and every row below is the
# same defect at a different scale -- a fit that does not record the basis it was computed in.
# "Basis" reads three ways and each is wrong in a way the other two cannot see: the bundle
# version (threaded by nobody, so §10 step 3 fitted the OUTGOING bundle and stamped it), the
# tier-set size K (kept across a change by decision 11 with no column recording it), and the
# coordinate a title is actually served at (a precedence chain on the fit path against §5.1's
# blend on the serving path, on 33% of the real bundle's covered rows). Split across milestones,
# two of them contend for the same four functions -- `observations.standard_embeddings`,
# `refit.load_cache`, `refit.refit_user`, `backbone.coordinate` -- and the second to land rebases
# onto a file it did not read. The schema trio rides here because a migration number is a
# serialised resource and every table it touches is one these rows already own.
#
# Every row below is written BEFORE the code it covers and NAMES THE EXACT TESTS IT OWES rather
# than leaving `tests` off: M4.9's opening, which this milestone repeats for M4.9's reason. The
# gate then fails on a test that does not exist yet, so the red list says which stage still owes
# what instead of only how many rows are bare, and a stage cannot quietly satisfy a row by
# pointing it at some test that happens to exist already. That red list IS this milestone's test
# plan: it is closed by writing those tests under those names, never by a waiver, never by
# renaming a row's test, and never by lowering `current_milestone`. `docs/TESTING.md`'s ledger
# block is re-pasted once, when the last of them is green.
#
# Five names below already exist and are registered rather than written, which costs the gate
# nothing and closes a real gap: `test_ledger_contract.py`'s four contract assertions and
# `test_ledger_model.py::test_a_threshold_can_never_put_a_disliked_title_above_a_liked_one` were
# named by no row at all, so the file that states what §5.2's fit must BE could have been deleted
# without breaking a gate. They sit on the incremental-board row because that is the row whose
# `what` says the tick produces a full fit, and "a full fit" is exactly what those five define.
#
# Two M4.13 rows are already green and sit in the pre-release cluster above rather than here --
# the zeroed-Backbone row (65614ae) and the printed-beta row (c4e74e6, decision 167), both
# shipped ahead of this milestone out of ROADMAP-to-M5.md's "Start here" table. Seven rows this map
# already had are amended in place ABOVE rather than duplicated here, for the reason M4.11's
# banner gives: each is the same clause asserted against the fixture instead of the corpus, and a
# second row would leave the easy one standing as a claim about the app. Six of the seven gain a
# clause and the ids that assert it; the seventh, `data-rules-verdict-append-only`, changes only
# its citation, because decision 237 executes decision 174 rather than re-deciding it. No row below is an e2e
# row, which is a layer choice the plan states -- this milestone ships no surface, and a spec in
# `05-milestones` would be a placeholder for a screen nobody is building.

