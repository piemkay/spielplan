    "backend/tests/test_ledger_observations.py::test_the_fitted_coordinate_equals_the_served_coordinate_for_every_title",
    "backend/tests/test_scoring.py::test_a_title_at_item_n_thirty_weights_its_two_halves_three_to_one",
]

[[requirement]]
id = "data-rules-the-gate-weights-two-comparable-halves"
spec = "§5.1 (e(t) = gate·E[t] + (1-gate)·ê(t)); §4.3; decision 236"
milestone = "M4.13"
kind = "backend"
what = "The app measures, rather than assumes, what §5.1's gate is weighting: a helper reports the ((1-g)·||ê||)/(g·||E||) distribution over the rows the middle line of §5.1 applies to and the range of a fitted member's owned user_score, the measurement is exercised against synthetic arrays whose two halves are known, and ops/m413_exit_criterion.py prints both against the shipped bundle. Whether the two weighted halves are brought within one order of magnitude of each other — and by which rescaling — is decision 236's upstream contract question, and nothing in the app rescales E or ê before it is answered."
why = "Measured on the shipped bundle over the 3,860 thin non-cold rows the blend applies to (a real Backbone row below WARM_SUPPORT, which is one ulp above 90): median ||E|| 0.0152 against median ||E_hat|| 20.47, and ((1-g)·||ê||)/(g·||E||) runs p10 82.5 / median 525.8 / p90 5,499 — so 'gate' weights two incommensurable quantities and the cold half decides every thin title's personal term. E itself is support-scaled (norm median 0.043, max 127), so standardising ⟨v,e⟩ over the reference population puts owned popular titles at -15.9."
tests = [
    "backend/tests/test_scoring.py::test_the_blend_report_names_the_ratio_of_the_two_weighted_halves_on_known_arrays",
    "backend/tests/test_scoring.py::test_the_blend_report_counts_only_the_rows_the_middle_line_of_the_blend_applies_to",
    "backend/tests/test_scoring.py::test_the_blend_expression_rescales_neither_half_while_the_scale_question_is_open",
    "backend/tests/test_placement.py::test_the_cold_tower_coordinate_is_written_unscaled",
]

[[requirement]]
id = "data-rules-a-tier-edit-carries-the-k-it-was-written-under"
spec = "§4.2 tier_edit; §5.2 arm 3; decision 11"
milestone = "M4.13"
kind = "integration"
what = "tier_edit records the tier-set size it was written under, and one rescale_level helper — mapping by cumulative prior mass, clamping only as its last step — is what the loader, the incremental path, the board and the drop's neighbour check all call, so bucket, badge, fit and refusal agree. Dropping a title into tier 6 of 7 and then saving 12 labels renders it at tier 11, not 6; saving 4 labels puts an S edit in tier 3 and a B edit in tier 1. A drop beside that title is accepted at the tier the board renders it in and refused at the stale one. A tier-set change invalidates ledger_fit rather than leaving the board at the old K."
why = "Decision 11 keeps tier_edit rows across a K change and no column recorded the K, so every reader used the raw index: 7->12 left every loved title mid-board, emptied the top five tiers and put 36 of 60 later drops into tension; 7->4 collapsed 280 of 320 titles into the top tier. Simulated meaning shift 20-28 percentile points against 3.0 for a mass-preserving rescale. The clamp existed in three places, one of them silent."
tests = [
    "backend/tests/test_ledger_observations.py::test_a_tier_edit_records_the_tier_set_size_it_was_written_under",
    "backend/tests/test_ledger_observations.py::test_rescale_level_maps_by_cumulative_prior_mass_and_clamps_only_last",
    "backend/tests/test_ledger_observations.py::test_an_edit_at_six_of_seven_is_read_at_eleven_of_twelve",
    "backend/tests/test_ledger_observations.py::test_shrinking_to_four_labels_keeps_an_s_edit_above_a_b_edit",
    "backend/tests/test_rank_integration.py::test_a_tier_set_change_invalidates_the_fit_rather_than_leaving_the_old_k",
    "backend/tests/test_rank_integration.py::test_the_loader_the_incremental_path_and_the_board_rescale_through_one_helper",
    "backend/tests/test_rank_integration.py::test_a_drop_beside_a_pre_k_change_neighbour_is_checked_at_the_rendered_tier",
    "backend/tests/test_schema_contracts.py::test_the_tier_edit_k_column_is_backfilled_from_the_users_own_tier_set",
]

[[requirement]]
id = "data-rules-a-fold-in-cannot-lose-the-work-it-fitted"
spec = "§5.3 (nightly refit vs the <50 ms incremental path); §6.3 (\"placement never snaps back\"); §5.2 (freshness)"
milestone = "M4.13"
kind = "integration"
what = "A verdict recorded while a refit is running is not discarded: the tap waits on the same advisory lock the fit holds and survives into ledger_state and ledger_fit.title_ids. A tier-set change made during the sweep's fit is not cleared. A fold-in whose score write fails leaves no user_vector row, so the next tick reports stale. A re-rating that commits inside the fit window is picked up by the next tick rather than waiting for the nightly. And an undo leaves the surviving observation's freshness clock where the observation put it, rather than restamping a 400-day-old verdict as if it had been made now."
why = "refit_user read observations unlocked and outside any transaction and wrote seconds later, reverting a concurrently recorded verdict to the unobserved prior; clear_refit_request had no timestamp predicate; write_fit and replace_scores were two transactions; a §4.2 supersede leaves the label count unchanged with created_at before updated_at, so _is_stale reported fresh for ever; and undo derived its touched set from the rows but its stamps from the wall clock, so last_observed_at 2025-07-30 with sigma_eff 1.4276 became 2026-09-03 with sigma_eff == sigma."
tests = [
    "backend/tests/test_foldin_jobs.py::test_a_verdict_recorded_during_a_refit_survives_into_the_fit_that_follows",
    "backend/tests/test_foldin_jobs.py::test_the_tap_waits_on_the_lock_the_fit_holds_rather_than_racing_it",
    "backend/tests/test_foldin_jobs.py::test_a_tier_set_change_made_during_the_sweeps_fit_is_not_cleared",
    "backend/tests/test_foldin_jobs.py::test_a_fold_in_whose_score_write_fails_leaves_no_user_vector_row",
    "backend/tests/test_foldin_jobs.py::test_a_re_rating_committed_inside_the_fit_window_is_picked_up_by_the_next_tick",
    "backend/tests/test_ledger_observations.py::test_an_undo_leaves_the_freshness_clock_where_the_observation_put_it",
]

[[requirement]]
id = "data-rules-the-incremental-board-does-not-hold-a-one-verdict-fit"
spec = "§5.2 (\"refit nightly … and incrementally on each new observation\"); §6.3"
milestone = "M4.13"
kind = "integration"
what = "After a sitting's worth of verdicts on titles the person had not rated before, the Ledger's fit_source returns to a full fit within one worker tick, and the spread of s over UNRATED titles exceeds a flat board rather than holding the first tap's one-observation estimate; the nightly then moves a few dozen tier badges, not hundreds. The trigger counts TITLES, so a sitting of re-ratings and battles is a measured LIMIT rather than a claim: it owes no refresh until the nightly, and the test that says so is what keeps the sentence above honest about which sitting. The fit that tick produces is the fit §5.2 specifies: finite everywhere, cutpoints ordered, the reported objective the objective of the reported parameters, no other starting point finding a lower one, and no threshold ever placing a disliked title above a liked one."
why = "The incremental path runs a full refit only on the very first verdict, at n = 1, and every later tap re-solves residuals against that fit's mu and v: measured, 715 unrated owned movies had sd(s) 0.070 against 2.77 after a refit and correlated -0.135 with a taste the refit recovers at +0.57, so the nightly moved 252 and then 724 of 765 badges at once — the snap §6.3 says the design avoids. The four assertions that state what that fit must be live in test_ledger_contract.py, a file named by zero coverage rows, and §5.2's headline threshold claim was equally unregistered and could not fail."
tests = [
    "backend/tests/test_worker_jobs.py::test_a_sittings_worth_of_verdicts_returns_the_board_to_a_full_fit_within_one_tick",
    "backend/tests/test_worker_jobs.py::test_the_board_spreads_unrated_titles_rather_than_holding_the_first_taps_estimate",
    "backend/tests/test_worker_jobs.py::test_a_dead_connection_stops_the_ledger_refresh_tick_rather_than_reporting_a_skip",
    "backend/tests/test_worker_jobs.py::test_a_sitting_of_re_ratings_and_battles_does_not_move_the_refresh_trigger",
    "backend/tests/test_ledger_contract.py::test_no_board_produces_a_number_that_is_not_a_number",
    "backend/tests/test_ledger_contract.py::test_every_board_returns_ordered_cutpoints",
    "backend/tests/test_ledger_contract.py::test_the_reported_objective_is_the_objective_of_the_reported_parameters",
    "backend/tests/test_ledger_contract.py::test_no_other_starting_point_finds_a_lower_objective",
    "backend/tests/test_ledger_model.py::test_a_threshold_can_never_put_a_disliked_title_above_a_liked_one",
]

[[requirement]]
id = "data-rules-the-fold-in-tick-is-debounced"
spec = "§5.3 (\"Fold-in user vectors … nightly — seconds\"); §12 M2"
milestone = "M4.13"
kind = "integration"
what = "A verdict recorded seconds ago does not trigger a partition rewrite on the next tick: with a fresh label the tick reports no refit, and after the debounce window (or the hard cap) exactly one refit runs and writes one partition. A refit with unchanged labels writes zero rows. The job registry's budget string names what is measured."
why = "Measured at 14k titles the tick deleted and re-inserted the whole (user, kind) partition every 60 s during a sitting — 5-8 MB WAL and 325-590 ms per rater-minute, 0.7-1.5 s for two raters — against a job table that calls it 'ms'. The write-shape alternatives measured worse (ON CONFLICT: 11.2 MB WAL, 459 ms, 14,000 non-HOT updates), so frequency is the only lever."
tests = [
    "backend/tests/test_foldin_jobs.py::test_a_label_recorded_seconds_ago_does_not_rewrite_a_partition_on_the_next_tick",
    "backend/tests/test_foldin_jobs.py::test_the_debounce_window_lets_exactly_one_refit_through_and_it_writes_one_partition",
    "backend/tests/test_foldin_jobs.py::test_the_hard_cap_forces_a_refit_for_a_member_who_never_stops_rating",
    "backend/tests/test_foldin_jobs.py::test_a_refit_with_unchanged_labels_writes_no_rows",
    "backend/tests/test_worker_jobs.py::test_the_fold_in_budget_string_names_what_the_tick_measures",
]

[[requirement]]
id = "data-rules-observations-survive-a-title-delete"
spec = "§10 (\"Ledger observations always survive re-import\"); §4.2 (append-only); §7.2"
milestone = "M4.13"
kind = "integration"
what = "Deleting a title that carries observations raises a foreign-key violation rather than succeeding: the verdict, duel, tier_edit, user_title and §13 session rows are all still there afterwards. A title carrying only derived rows still deletes. A source guard fails if any package file gains a `DELETE FROM title`."
why = "Seven observation tables and the §13 outcome row — eight tables, ten foreign-key columns — declared ON DELETE CASCADE, so §10's survival guarantee was kept only by the convention that no code deletes a title. The first admin action that removes a mis-matched or rolled-back acquisition would erase every member's verdicts on it with no error and no log line, and taste data is the one thing this app cannot re-derive."
tests = [
    "backend/tests/test_schema_contracts.py::test_deleting_a_title_that_carries_observations_is_refused",
