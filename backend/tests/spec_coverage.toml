# on it), and the test list did not have to move: the named Playwright case is the same one,
# extended through the guest's ballot to the reveal rather than duplicated into a second file.
# Two further claims of this row were held by nothing until M4.12 either, both inside that test
# and both about the Undo on the incoming screen: it was clicked under `.catch(() => false)`, so
# a screen with no Undo at all skipped the click and passed, and the only assertion after it was
# a NEGATIVE -- the host's count unchanged -- which a screen that wrote nowhere satisfies. The
# positive half is now there beside it: the guest's own count is 0, because at their pair 1 the
# undo has nothing of theirs to take back. The frame half of "which seat this device is
# playing" is not this row's; it has its own at M4.12. [M4.12 findings 13, 46]
tests = ["e2e/specs/14-tonight.spec.js::the guest hand-off clears the screen and offers nothing early", "backend/tests/test_tonight_integration.py::test_a_guest_cannot_answer_before_the_initiator_has_finished", "backend/tests/test_tonight_integration.py::test_only_one_guest_turn_is_open_at_a_time", "backend/tests/test_tonight_integration.py::test_undo_reaches_only_your_own_last_live_answer", "backend/tests/test_tonight_routes.py::test_a_host_may_take_a_guests_turn", "backend/tests/test_tonight_routes.py::test_a_member_seat_is_never_writable_by_the_host"]

