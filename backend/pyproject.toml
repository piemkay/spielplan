[project]
name = "spielplan"
version = "0.1.0"
description = "Spielplan — household media graph: catalog, taste ledger, tonight sessions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # app.py registers an exception handler on Starlette's own HTTPException: the router raises
    # that class for 404/405, and FastAPI's subclass is not in its MRO, so handling only the
    # FastAPI one would let those two drop §3.2's slid session cookie. It arrives transitively
    # with fastapi; naming it here means the import cannot break on someone else's bump.
    "starlette>=0.40",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "itsdangerous>=2.2",
    # §3.2: WebAuthn passkeys are primary auth. py_webauthn does the CBOR/COSE parsing and the
    # attestation and assertion verification; hand-rolling that is error-prone crypto.
    "webauthn>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "numpy>=1.26",
    # §5.2's Ledger and §5.1's scoring stack are numpy; §8 stage 9's Cold Tower is a torch
    # module the corpus project exports as `cold_tower.pt`. §1: "Torch CPU wheels only. The
    # image must build and run on a GPU-less VM" — ops/backend.Dockerfile pins the CPU index.
    "torch>=2.5",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # tests/fixtures/soft_authenticator.py builds real CTAP2 structures, so it encodes COSE
    # keys and attestation objects itself. It arrives transitively with webauthn; naming it
    # here means a test import cannot break on someone else's dependency change.
    "cbor2>=5.6",
]

[project.scripts]
spielplan-migrate = "spielplan.db.migrate:main"
# §2 makes rotating SECRETS_KEY an explicit admin action, and both of its gestures need the key
# that is being replaced — which no running process holds, so this is a command and not a route.
# .env.example's rotation paragraph and README's Recovery block name it. [M4.7 spec-08]
spielplan-secrets = "spielplan.core.secrets_cli:main"
# decision 162 makes the household's movie data the only copy there is, and M4.5 shipped the
# archive with no caller: `write_archive`/`restore_archive` existed and nothing outside their
# own tests could reach them. README's Recovery block names this command. [M4.7 spec-07]
spielplan-movie-data = "spielplan.backup.movie_data:main"

# §1: "Torch CPU wheels only. The image must build and run on a GPU-less VM." That used to be kept
# by an index strategy in `ops/backend.Dockerfile` that takes the highest version across PyPI and
# the CPU index — so the build was CPU-only only because `2.14.0+cpu` happens to sort above
# `2.14.0`, and the first PyPI release ahead of the CPU index would have flipped it to the GPU
# wheel and a couple of gigabytes of driver packages, with the CPU index URL still in the file.
# Declared here instead, because a dependency spec is what every consumer reads: the image, CI's
# three jobs and a developer's `-e ".[dev]"` all resolve the same wheel.
#
# `explicit = true` is the load-bearing half: without it this index competes with PyPI for every
# package it carries, and the CPU index carries a 2022 `certifi`. With it, the index is used only
# for what `[tool.uv.sources]` names. Verified with `uv pip compile --emit-index-annotation`:
# 47 packages, exactly one of them annotated to download.pytorch.org, and no driver packages at
# all. [M4.7 dd28]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spielplan"]

[tool.ruff]
# 108, not the usual 100: this codebase quotes spec sentences inline next to the code they
# govern, and wrapping those quotes across lines makes them harder to diff against the spec.
line-length = 108
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids calls in argument defaults, which is exactly how FastAPI declares parameter
# metadata. These four are the framework's idiom, not a mutable-default bug.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
